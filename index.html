<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRS</title>
<link rel="icon" type="image/svg+xml" href="assets/drs-icon-small.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="description" content="DRS (Data Reasoning Studio): a research prototype for reasoning with messy, authentic scientific data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#131b24; --ink-2:#26313d; --ink-3:#5b6874;
  --paper:#e6eaec; --paper-2:#f2f4f5; --line:#c3cbd1;
  --x:#2f6f9e; --y:#c26a16; --third:#4a7c59; --flag:#a8322a; --y-soft:#f9e8d4;
  --bg:#f2f4f5; --fg:#131b24; --panel:#ffffff; --miss:#d6dce1; --rule:#cfd6db; --muted:#5b6874;
  --shell:#131b24; --shell-fg:#dbe3e8; --shell-line:#2c3844;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e151c; --fg:#dde4e9; --panel:#16202a; --miss:#3b4754; --rule:#2a3642; --muted:#8f9 da8;
    --muted:#8f9da8; --paper:#16202a; --paper-2:#1c2731; --line:#2a3642;
    --x:#6aa8d6; --y:#e0975a; --third:#7fae90; --flag:#d9776e; --y-soft:#3a2b1c;
    --shell:#0a1017; --shell-fg:#dde4e9; --shell-line:#1f2a35;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151c; --fg:#dde4e9; --panel:#16202a; --miss:#3b4754; --rule:#2a3642; --muted:#8f9da8;
  --paper:#16202a; --paper-2:#1c2731; --line:#2a3642;
  --x:#6aa8d6; --y:#e0975a; --third:#7fae90; --flag:#d9776e; --y-soft:#3a2b1c;
  --shell:#0a1017; --shell-fg:#dde4e9; --shell-line:#1f2a35;
}
*,*::before,*::after{box-sizing:inherit}
/* On screen the print document is not there at all; when printing it is the
   only thing there, so the story prints as a document rather than as a
   screenshot of the workspace. */
#printdoc{display:none}
@media print{
  html,body{background:#fff!important;height:auto!important}
  body > *{display:none!important}
  body > #printdoc{display:block!important}
  #printdoc{padding:0;margin:0}
  @page{margin:16mm}
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.serif{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-0.01em}
h1{font-size:2.1rem;line-height:1.12;margin:0 0 .4rem}
h2{font-size:1.35rem;line-height:1.2;margin:0 0 .5rem}
h3{font-size:1.05rem;margin:0 0 .35rem}
p{margin:0 0 .8rem;max-width:68ch}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--x);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;min-height:100%}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--shell);color:var(--shell-fg);
  border-bottom:1px solid var(--shell-line);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-in{display:flex;align-items:center;gap:1rem;padding:.55rem 1rem;flex-wrap:wrap}
.brand{font-family:Newsreader,serif;font-size:1.15rem;letter-spacing:.01em;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.brand{display:inline-flex;align-items:center;line-height:1}
.brand .logo{height:34px;width:auto;display:block;color:var(--shell-fg)}
.topbar nav{display:flex;gap:.15rem;margin-left:auto;flex-wrap:wrap}
.navb{background:none;border:1px solid transparent;border-radius:5px;padding:.3rem .62rem;font-size:.85rem;color:#9fb0bd;cursor:pointer}
.navb:hover{color:#fff}
.navb[aria-current="true"]{color:#fff;border-color:var(--shell-line);background:#1d2833}
.build{font-size:.68rem;color:#6b7c8a;margin-left:auto;order:9;letter-spacing:.02em}
.dsbadge{font-size:.78rem;color:#8b9caa;border-left:1px solid var(--shell-line);padding-left:.8rem}
main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:1.4rem 1rem 4rem}

/* ---------- generic ---------- */
.panel{background:var(--panel);border:1px solid var(--rule)}
.pad{padding:1rem}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tiny{font-size:.75rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;min-width:0}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:5px;padding:.4rem .8rem;cursor:pointer;font-size:.88rem;white-space:nowrap;flex:0 0 auto;max-width:100%}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:var(--panel);color:var(--fg);border-color:var(--rule)}
.btn.ghost:hover{background:var(--paper-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],textarea,input[type=number]{
  font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--rule);
  border-radius:4px;padding:.35rem .5rem;max-width:100%;
}
textarea{width:100%;resize:vertical;line-height:1.5}
label.fld{display:block;margin-bottom:.7rem}
label.fld > span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.2rem}
.scroll-x{overflow-x:auto}
hr.rule{border:0;border-top:1px solid var(--rule);margin:1.1rem 0}

/* ---------- home ---------- */
.hero{margin-bottom:1.6rem;max-width:72ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.dcard{background:var(--panel);padding:.9rem;display:flex;flex-direction:column;gap:.55rem;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit}
.dcard:focus-visible{outline:2px solid var(--x);outline-offset:-2px}
.facts{display:flex;flex-direction:column;gap:.15rem;font-size:.86rem}
.chkbtn{align-self:flex-start;background:none;border:0;padding:0;font:inherit;font-size:.74rem;
  color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.chkbtn:hover{color:var(--fg)}
.sortb{display:flex;align-items:center;gap:.3rem;width:100%;background:none;border:0;
  padding:0;font:inherit;font-size:.78rem;font-weight:500;cursor:pointer;color:inherit;text-align:left}
.sortb:hover{color:var(--x)}
.annoblock{margin-bottom:.15rem}
.scopebar{display:flex;align-items:center;gap:.3rem;margin:.3rem 0 0;flex-wrap:wrap;
  background:var(--paper-2);border:1px solid var(--line);padding:.25rem .45rem;width:fit-content;max-width:100%}
.scopebar > .tiny{margin-right:.15rem}
.scopebar button{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:.12rem .5rem;font:inherit;font-size:.72rem;cursor:pointer;color:var(--muted)}
.scopebar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chipx{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 .1rem;font-size:.95rem;line-height:1;flex:none}
.chipx:hover{color:var(--flag)}
.refviz{touch-action:auto}
.refviz .vizhead .t{font-size:.76rem}
.iconb.star{border-color:var(--rule)}
.iconb.star.on{color:var(--y);border-color:var(--y)}
.whykeep{font-size:.78rem;border-top:1px solid var(--line);border-radius:0}
.think{border:1px solid var(--line);background:var(--panel);padding:.55rem;margin-bottom:.5rem}
.thhead{font-family:Newsreader,serif;font-size:1rem;border-left:3px solid var(--flag);
  padding-left:.5rem;margin-bottom:.45rem}
.thfield{margin-bottom:.45rem}
.thfield:last-child{margin-bottom:0}
.thlab{font-size:.78rem;font-weight:500;margin-bottom:.12rem}
.gloss{font-size:.74rem;line-height:1.45;color:var(--muted);background:var(--paper-2);
  border-left:2px solid var(--line);padding:.35rem .5rem;margin-top:.3rem}
.gloss p{margin:0 0 .2rem;max-width:none}
.gloss p:last-child{margin:0}
.chartrow{display:flex;gap:.7rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:.8rem;
  padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.chartrow:last-child{border-bottom:0;margin-bottom:0}
.chartrow .refviz{flex:0 1 auto;max-width:100%}
.thinkpanel{flex:1 1 300px;min-width:0}
.markstrip{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;margin-bottom:.45rem}
.markpill{font-size:.72rem;border:1px solid var(--flag);color:var(--flag);border-radius:12px;
  padding:.08rem .45rem;background:var(--panel)}
.resbox{border:1px solid var(--line);background:var(--paper-2);padding:.6rem}
.resitem{border-left:3px solid var(--third);padding:.35rem .6rem;margin:.4rem 0;background:var(--panel)}
.resitem .rt{font-weight:500;font-size:.88rem}
.resitem .rn{font-size:.82rem;line-height:1.45;margin-top:.15rem}
.resitem .rl{font-size:.76rem;color:var(--x);word-break:break-all;display:inline-block;margin-top:.2rem}
.resbar{display:flex;gap:.3rem;align-items:center;margin:.1rem 0 .45rem}
.ressearch{flex:1 1 auto;min-width:0;font-size:.8rem;padding:.3rem .4rem;
  border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.reskind{font-size:.64rem;color:var(--muted);border:1px solid var(--line);
  padding:0 .25rem;margin-left:.35rem;white-space:nowrap}
.resmeta{margin-top:.4rem;border-top:1px dotted var(--line);padding-top:.32rem}
.resmeta > div{font-size:.76rem;line-height:1.45;margin-top:.22rem}
.resmeta b{font-weight:500;color:var(--muted)}
.resmeta.thin{color:var(--muted);font-style:italic}
.restable{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:.35rem}
.restable th{text-align:left;font-weight:500;color:var(--muted);
  border-bottom:1px solid var(--line);padding:.15rem .3rem;white-space:nowrap}
.restable td{border-bottom:1px solid var(--line);padding:.18rem .3rem;vertical-align:top;line-height:1.35}
.restable tr.hit td{background:var(--paper-2);box-shadow:inset 2px 0 0 var(--y)}
.resmore{font-size:.72rem;color:var(--muted);margin-top:.25rem;background:none;
  border:0;padding:0;cursor:pointer;text-decoration:underline}
.resused{display:flex;align-items:center;gap:.3rem;font-size:.73rem;color:var(--muted);margin-top:.35rem}
.resnone{font-size:.78rem;color:var(--muted);padding:.4rem 0}
.tblprev{max-height:150px;overflow:auto;border:1px solid var(--line);margin-top:.25rem;background:var(--panel)}
.sortb .sl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sortb .sa{flex:none;color:var(--muted);font-size:.72rem}
table.grid th.sorted{background:var(--panel);box-shadow:inset 0 -2px 0 var(--x)}
table.grid th.sorted .sa{color:var(--x)}
.sect{border:1px solid var(--line);margin-bottom:.45rem;background:var(--panel)}
.sect.open{border-color:var(--rule)}
.secthead{display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;
  background:var(--paper-2);border:0;border-bottom:1px solid transparent;
  padding:.45rem .6rem;cursor:pointer;font:inherit;color:inherit}
.sect.open .secthead{border-bottom-color:var(--line)}
.secthead:hover{background:var(--paper)}
.caret{color:var(--muted);font-size:.8rem;flex:none;width:.9rem}
.secttitle{font-family:Newsreader,serif;font-size:1rem}
.sectbody{padding:.6rem}
.subsect{margin-bottom:1.1rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.subsect:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.subtitle{font-family:Newsreader,serif;font-size:1.02rem;font-weight:500;margin:0 0 .45rem}
.steps{font-size:.79rem;line-height:1.5;border-left:3px solid var(--x);padding-left:.55rem;background:var(--paper-2)}
.steps p{margin:0 0 .3rem}
.steps p:last-child{margin:0}
.guide{margin:0 0 .45rem;padding:.25rem .6rem;background:var(--paper-2);border-left:3px solid var(--x);
  font-size:.79rem;line-height:1.35}
.guide p{margin:0;max-width:none}
.showtog{display:inline-flex;align-items:center;gap:.3rem;margin-left:auto;cursor:pointer;white-space:nowrap}
.showtog input{margin:0}
.qedit.off .qnum{color:var(--muted);text-decoration:line-through}
.qedit.off textarea{opacity:.5}
.fixedline{margin:-.3rem 0 .7rem;padding:.4rem .5rem;background:var(--paper-2);
  border-left:2px solid var(--rule)}
.fixedline p{margin:.15rem 0 0;font-size:.8rem;color:var(--muted)}
.promptfull{margin-top:.45rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.76rem;line-height:1.45;background:var(--paper-2)}
.guidebar{margin:0 0 .55rem;gap:.4rem}
.guidebar .tiny{margin-right:auto}
.btn.mini{padding:.18rem .5rem;font-size:.76rem}
.guide p + p{margin-top:.12rem}
.guide p:last-child{margin:0}
.annobar{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;margin-bottom:.1rem}
.annobar button{background:var(--panel);border:0;border-right:1px solid var(--rule);padding:.3rem .7rem;
  font:inherit;font-size:.78rem;cursor:pointer;color:inherit;white-space:nowrap}
.annobar button:last-child{border-right:0}
.annobar button[aria-pressed="true"]{background:var(--ink);color:#fff}
.annobar .btn{margin-left:.4rem}
.annowrap{position:relative}
.annohost{position:relative}
.annohost > svg{display:block}
.annorow{gap:.4rem;align-items:center;flex-wrap:wrap}
.annobar{flex-wrap:wrap}
.cvanno{margin:0 0 .45rem}
.noteed{position:fixed;z-index:95;width:236px;background:var(--panel);border:1px solid var(--y);
  border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:.45rem}
.noteed textarea{font-size:.84rem}
.interptop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-bottom:.8rem}
/* sitting under the charts, this block needs a clear edge of its own so a
   student scrolling down cannot read past the question without seeing it */
.interptop.below{margin:1rem 0 0;border-top:3px solid var(--x)}
.interptop.below > section{max-height:none}
.interptop.below .itemcol > h3:first-child{font-size:1.05rem;color:var(--x)}
.interptop > section{background:var(--panel);padding:.8rem .85rem;min-width:0;
  max-height:min(50vh,480px);overflow:auto}
.interptop .itemcol .tossgrid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.interpcharts{background:var(--panel);border:1px solid var(--rule);padding:.85rem}
@media(max-width:900px){.interptop{grid-template-columns:minmax(0,1fr)}
  .interptop > section{max-height:none}}
.annosvg{position:absolute;inset:0;pointer-events:none;z-index:4}
.annopad{position:absolute;inset:0;z-index:5;touch-action:none;background:transparent}
.anonote{position:absolute;z-index:6;width:168px;background:var(--panel);border:1px solid var(--y);
  box-shadow:0 1px 4px rgba(0,0,0,.12);padding:.3rem;display:flex;gap:.2rem;align-items:flex-start}
.anonote textarea{font-size:.76rem;min-height:2.4rem;resize:vertical;width:100%}
.anonote .iconb{flex:0 0 auto;order:2}
.graphtray{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.45rem}
.gtile{border:1px solid var(--line);background:var(--panel);padding:.3rem;min-width:0}
.gtile .btn{font-size:.72rem;padding:.2rem .4rem;width:100%}
.brief.wide{max-width:none}
.partgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:.45rem;margin-top:.5rem}
.part{min-width:0}
.part .q{font-weight:500;font-size:.8rem;margin-bottom:.15rem}
.part textarea{font-size:.78rem}
.gname{font-size:.7rem;color:var(--muted);margin-bottom:.15rem;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gfig{cursor:zoom-in;touch-action:none;border:1px solid var(--line);background:var(--panel)}
.planner{border:1px solid var(--line);background:var(--paper-2);padding:.6rem .7rem;margin-bottom:.8rem}
.planner .slot{margin-bottom:.55rem}
.planner .slot:last-child{margin-bottom:0}
.planner .q{font-weight:500;font-size:.86rem;margin-bottom:.1rem}
.planner .ask{font-size:.76rem;color:var(--muted);margin-bottom:.2rem;line-height:1.35}
.storycanvas{border:1px dashed var(--line);background:var(--paper-2);padding:.6rem;
  transition:background .12s,border-color .12s}
.storycanvas.hot{border-color:var(--x);border-style:solid;background:var(--panel)}
.storytitle{width:100%;font-family:Newsreader,serif;font-size:1.15rem;margin:.4rem 0 .6rem}
.sblock{border:1px solid var(--line);background:var(--panel);padding:.45rem;margin-bottom:.1rem}
.sbhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem}
.sbfig{border:1px solid var(--line);cursor:zoom-in;margin-bottom:.3rem}
.linkrow{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:center;padding:.3rem 0}
.linkb{background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;
  padding:.12rem .55rem;font:inherit;font-size:.72rem;cursor:pointer;color:var(--muted)}
.linkb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.zoomback{position:fixed;inset:0;background:rgba(19,27,36,.55);z-index:80;display:flex;
  align-items:center;justify-content:center;padding:1.5rem}
.zoominner{background:var(--panel);padding:.8rem;max-width:860px;width:100%;max-height:90vh;overflow:auto}
.viewpanel{border:1px solid var(--x);background:var(--paper-2);padding:.6rem .75rem .7rem;margin:0 0 .6rem}
.viewpanel .vphead{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.viewpanel h4{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.02rem;margin:0}
.viewpanel .vpq{font-size:.84rem;margin:.55rem 0 .25rem}
.viewpanel .vpchoices{display:flex;flex-wrap:wrap;gap:.35rem}
.viewpanel .vpchoices button{font:inherit;font-size:.84rem;padding:.3rem .6rem;border:1px solid var(--line);
  background:var(--panel);color:var(--fg);cursor:pointer;text-align:left}
.viewpanel .vpchoices button small{display:block;color:var(--muted);font-size:.72rem}
.viewpanel .vpchoices button[aria-pressed="true"]{border-color:var(--x);box-shadow:inset 0 0 0 1px var(--x)}
.viewpanel .vpchoices button:focus-visible{outline:2px solid var(--x);outline-offset:2px}
.viewpanel .vpuse{font-size:.84rem;line-height:1.45;margin:.45rem 0 0;max-width:62ch;
  border-left:3px solid var(--x);padding-left:.5rem}
.viewpanel .vpvars{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin:.55rem 0 0;font-size:.82rem;align-items:center}
.viewpanel .vpvars label{display:flex;gap:.35rem;align-items:center}
.viewpanel .vpvars input[type=number]{width:6.5rem}
.viewpanel .vpprev{background:var(--panel);border:1px solid var(--line);margin-top:.55rem;max-width:30rem}
.viewpanel .vpnote{font-size:.74rem;color:var(--muted);margin:.5rem 0 0}
.showas{font:inherit;font-size:.68rem;padding:.08rem .4rem;border:1px solid var(--line);background:var(--panel);
  color:var(--fg);cursor:pointer;margin-right:.25rem;white-space:nowrap}
.showas[aria-pressed="true"]{border-color:var(--x);color:var(--x)}
.expanel{border:1px solid var(--line);background:var(--panel);padding:.75rem 1rem;margin:.5rem 0 .75rem;max-width:860px}
.expanel .exlead{font-size:.85rem;color:var(--muted);margin:.1rem 0 .6rem}
.expanel h5{font-size:1rem;margin:.9rem 0 .3rem}
.expanel .vphead{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.expanel h4{margin:0;font-family:Newsreader,serif;font-size:1.15rem}
.expanel .exsec{border-top:1px solid var(--line);margin-top:.6rem}
.expanel .exsec p{max-width:70ch;margin:.3rem 0 .5rem;line-height:1.5}
.expanel img{display:block;max-width:100%;height:auto;margin:.4rem auto .7rem;background:#fff}
.vptap{margin:.5rem 0 .25rem;font-size:.85rem;color:var(--fg)}
.vpprev.tappable svg{cursor:crosshair}
.storyonly{font-size:.66rem;color:var(--x);border:1px solid var(--x);padding:0 .3rem;margin-left:.35rem;white-space:nowrap}
.exbox{border:1px solid var(--third);background:var(--paper-2);padding:.55rem .7rem;margin-bottom:.5rem}
.exsteps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:.5rem;margin:.45rem 0 .35rem}
@media(max-width:700px){.exsteps{grid-template-columns:1fr}}
.exstep{background:var(--panel);border:1px solid var(--line);padding:.5rem .6rem;min-width:0}
.exstep .exh{font-family:Newsreader,serif;font-size:.95rem;border-left:3px solid var(--third);padding-left:.4rem;margin-bottom:.3rem}
.exstep .ext{font-size:.84rem;line-height:1.45;margin:0;max-width:none}
.exstep img{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);margin-top:.4rem}
.exbox .rl{font-size:.8rem;color:var(--x);word-break:break-all}
.exbox .rn{font-size:.84rem;line-height:1.45}
.famgloss{color:var(--muted);font-size:.72rem}
.pagenav button[aria-pressed="true"] .famgloss{color:#b9c6d1}
.slotname{font-family:Newsreader,serif;font-size:.92rem;border-left:3px solid var(--third);
  padding-left:.4rem;margin:0 0 .25rem}
.sblock.slotted{border-color:var(--third)}
.sblock.empty{background:var(--paper-2);border-style:dashed}
.sblock.hot{border-color:var(--x);border-style:solid;box-shadow:0 0 0 2px var(--x) inset}
.storyhead{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:0 0 .6rem}
.storyhead .pagenav{margin:0}
.storyhead > .btn{margin-left:auto}
.storytop.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.storytop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:.8rem}
.storytop > section{background:var(--panel);padding:.7rem .8rem;min-width:0;
  max-height:min(36vh,360px);overflow:auto}
.storytop .graphtray{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.storytop .planner{border:0;background:none;padding:0;margin:0}
.storytop .partgrid{grid-template-columns:minmax(0,1fr);gap:.3rem}
@media(max-width:900px){.storytop{grid-template-columns:minmax(0,1fr)}
  .storytop > section{max-height:none}}
.pdet{border:1px solid var(--line);background:var(--panel);padding:.3rem .45rem}
.pdet summary{cursor:pointer;display:flex;align-items:center;gap:.35rem;list-style:none}
.pdet summary::-webkit-details-marker{display:none}
.pdet summary::before{content:'\25b8';color:var(--muted);font-size:.75rem}
.pdet[open] summary::before{content:'\25be'}
.pdet summary .q{margin:0}
.pdet textarea{margin-top:.3rem}
.pdone{color:var(--third);font-size:.8rem;margin-left:auto}
.boardwrap{position:relative;height:max(380px,64vh);overflow-y:auto;overflow-x:hidden;
  border:1px solid var(--line);background:var(--panel);overscroll-behavior:contain}
.boardwrap .board{border:0}
.storycanvas.focus{position:fixed;inset:0;z-index:70;margin:0;border:0;background:var(--panel);
  padding:calc(.6rem + env(safe-area-inset-top,0px)) .9rem calc(.6rem + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;overflow:auto}
.storycanvas.focus .boardwrap{flex:1 0 320px;height:auto}
body:has(.storycanvas.focus){overflow:hidden}
.sbedge-r{position:absolute;top:26px;right:-4px;bottom:16px;width:9px;z-index:8;cursor:ew-resize;touch-action:none}
.sbedge-b{position:absolute;left:10px;right:16px;bottom:-4px;height:9px;z-index:8;cursor:ns-resize;touch-action:none}
.sbedge-r:hover{background:linear-gradient(var(--x),var(--x)) center/2px 100% no-repeat}
.sbedge-b:hover{background:linear-gradient(var(--x),var(--x)) center/100% 2px no-repeat}
.sbfig{overflow:hidden;position:relative}
.cvhead{flex-wrap:wrap;gap:.45rem;margin-bottom:.45rem}
.cvhead h3{margin:0}
.cvhead .storytitle{flex:1 1 220px;width:auto;margin:0}
.cvtools{flex-wrap:wrap;gap:.45rem;margin:0 0 .45rem;align-items:center}
.cvtools .annobar{margin:0}
.cvtip{margin:0 0 0 auto;max-width:48ch;text-align:right}
@media(max-width:900px){.cvtip{margin:0;text-align:left;max-width:none}}
.board{position:relative;min-height:560px;background:var(--panel);border:1px solid var(--line);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;
  overflow:hidden}
.boardsvg{position:absolute;inset:0;pointer-events:none}
.boardsvg .bchip{pointer-events:auto}
.boardpad{position:absolute;inset:0;z-index:6;touch-action:none;cursor:crosshair}
.board .sblock{position:absolute;width:225px;margin:0;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* the corner you pull to make a card bigger; sits above the connect pad */
.sbgrip{position:absolute;right:0;bottom:0;width:15px;height:15px;z-index:8;
  cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 52%,var(--line) 52%,var(--line) 62%,
    transparent 62%,transparent 74%,var(--line) 74%,var(--line) 84%,transparent 84%)}
.sbgrip:hover{background:linear-gradient(135deg,transparent 52%,var(--x) 52%,var(--x) 62%,
    transparent 62%,transparent 74%,var(--x) 74%,var(--x) 84%,transparent 84%)}
.sblock textarea{resize:none}
.board .sblock.moving{z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.board .sblock.pending{outline:2px solid var(--x);outline-offset:1px}
.board .dropempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:2rem}
.pickpad{position:absolute;inset:0;z-index:7;cursor:pointer;background:transparent}
.sbhead{cursor:grab}
/* the card's own controls sit above the connect pad, and above the drawing
   pad too, so a card can still be removed whatever tool is in hand */
.sbhead{position:relative;z-index:8}
.board.drawing .sblock{z-index:auto}
.sblock.moving .sbhead{cursor:grabbing}
.qblock{margin-bottom:1rem;padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.qblock:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.qdots{display:flex;flex-wrap:wrap;gap:.3rem;margin:0 0 .7rem}
.qdot{width:1.75rem;height:1.75rem;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:.75rem;cursor:pointer;color:var(--ink);padding:0}
.qdot.done{background:var(--paper-2);border-color:var(--ink)}
.qdot.cur{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.qdot:disabled{opacity:.4;cursor:not-allowed}
.qnav{justify-content:space-between;margin-top:.2rem}
textarea.locked{background:var(--paper-2);color:var(--muted)}
.qnum{font-size:.72rem;color:var(--muted);letter-spacing:.03em;margin-bottom:.25rem}
.qedit{margin-bottom:.7rem;padding-bottom:.6rem;border-bottom:1px dashed var(--line)}
.qedit:last-of-type{border-bottom:0;padding-bottom:.2rem}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.2rem}
.twoup{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.upslot{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.uplab{font-weight:500;font-size:.92rem}
.upslot input[type="file"]{font-size:.78rem;max-width:100%}
.picstrip{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
.picthumb{position:relative;width:110px}
.picthumb img{width:110px;height:72px;object-fit:cover;border:1px solid var(--line);display:block}
.picthumb .iconb{position:absolute;top:-6px;right:-6px;background:var(--panel);border:1px solid var(--rule);border-radius:50%;width:20px;height:20px;line-height:1}
.dcard:hover{background:var(--paper-2)}
.dcard h3{margin:0;font-size:1.02rem}
.thumb{height:92px;background:var(--paper-2);border:1px solid var(--line)}
.checks{display:flex;flex-direction:column;gap:.18rem;font-size:.76rem}
.chk{display:flex;gap:.4rem;align-items:baseline}
.chk b{font-weight:500;width:1.1rem;flex:none;font-size:.9rem;line-height:1}
.pass{color:var(--third)} .fail{color:var(--flag)} .warn{color:var(--y)}
.upload{border:1px dashed var(--line);padding:1rem;background:var(--paper-2)}

/* ---------- stage tabs ---------- */
.stages{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:1rem;overflow-x:auto}
.stage{flex:1;min-width:150px;background:var(--panel);border:0;padding:.6rem .7rem;text-align:left;cursor:pointer;font:inherit;color:inherit;border-bottom:3px solid transparent}
.stage:hover{background:var(--paper-2)}
.stage[aria-current="true"]{border-bottom-color:var(--x);background:var(--paper-2)}
.stage .nm{font-family:Newsreader,serif;font-size:1.02rem;display:block}
.stage .de{font-size:.74rem;color:var(--muted);display:block;line-height:1.35}

/* ---------- workspace ---------- */
.work{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,330px);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.work > section{background:var(--panel);padding:.85rem;min-width:0}
.work.notray{grid-template-columns:minmax(0,1fr) minmax(0,330px)}
@media(max-width:820px){.work.notray{grid-template-columns:minmax(0,1fr)}}
.work.noitem{grid-template-columns:minmax(0,220px) minmax(0,1fr)}
@media(max-width:820px){.work.noitem{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1180px){.work{grid-template-columns:minmax(0,260px) minmax(0,1fr)}
  .work > .itemcol{grid-column:1/-1}}
@media(max-width:820px){.work{grid-template-columns:minmax(0,1fr)}
  .work > .itemcol{grid-column:auto}}
.tray h3,.itemcol h3{font-size:.95rem;margin-bottom:.5rem}
.chip{
  display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;
  background:var(--paper-2);border:1px solid var(--line);border-radius:4px;
  padding:.35rem .5rem;margin-bottom:.3rem;cursor:grab;font:inherit;color:inherit;font-size:.82rem;
  touch-action:none;
}
.chip:hover{border-color:var(--x)}
.chip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .fl{font-size:.68rem;color:var(--muted);flex:none}
.chip.cat{border-left:3px solid var(--third)}
.chip.num{border-left:3px solid var(--x)}
.chip.bad{border-left:3px solid var(--flag)}
.chip.dragging{opacity:.4}

.surface{min-height:380px;border:1px solid var(--line);background:var(--paper-2);position:relative;padding:.6rem;display:flex;flex-wrap:wrap;gap:.6rem;align-content:flex-start}
.surface.drop{border-color:var(--x);background:color-mix(in srgb,var(--x) 8%,var(--paper-2))}
.surface .empty{margin:auto;color:var(--muted);font-size:.88rem;text-align:center;max-width:34ch;padding:2rem 1rem}
.viz{background:var(--panel);border:1px solid var(--line);position:relative;touch-action:none}
.viz.target{border-color:var(--y);box-shadow:inset 0 0 0 2px var(--y)}
.viz.dragging{opacity:.5}
.viz.gest{border-color:var(--x);box-shadow:inset 0 0 0 2px var(--x)}
.vizhead{display:flex;align-items:center;gap:.4rem;padding:.3rem .45rem;border-bottom:1px solid var(--line);font-size:.76rem;background:var(--paper-2)}
.grip{cursor:grab;color:var(--muted);flex:none;font-size:.9rem;line-height:1;padding:0 .15rem;background:none;border:0}
.vizhead .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconb{background:none;border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:.68rem;padding:.1rem .3rem;color:var(--muted)}
.iconb:disabled{opacity:.35;cursor:default}
.zoomctl{display:inline-flex;gap:.12rem;margin-left:auto;flex:0 0 auto}
.zoomctl .iconb{min-width:1.35rem;text-align:center;font-size:.72rem;line-height:1.1}
.iconb:hover{color:var(--fg);border-color:var(--x)}
.merging{animation:mg .42s ease-in-out}
@keyframes mg{0%{transform:scale(1)}45%{transform:scale(.93)}100%{transform:scale(1)}}

.notice{list-style:none;margin:.5rem 0 0;padding:0;font-size:.8rem}
.notice li{border-left:3px solid var(--flag);padding:.25rem .5rem;margin-bottom:.25rem;background:var(--paper-2);display:flex;gap:.4rem}
.notice li span{flex:1}
.notice li button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 .2rem}

/* routes */
.routes{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;margin-bottom:.6rem}
.routes button{background:var(--panel);border:0;padding:.28rem .6rem;font-size:.78rem;cursor:pointer}
.routes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.menuroute{border:1px solid var(--line);background:var(--paper-2);padding:.6rem;margin-bottom:.6rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end}
.menuroute label{font-size:.76rem;color:var(--muted)}
.menuroute select{display:block;font-size:.82rem}

/* extraction */
.ring{display:block;margin:0 auto;max-width:100%}
.ring .node{cursor:pointer}
.obsnav{display:flex;gap:.5rem 1rem;align-items:center;justify-content:space-between;
  margin-bottom:.6rem;font-size:.82rem;flex-wrap:wrap;min-width:0}
.obsnav .grp{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;min-width:0}
.stepper{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;flex:none}
.stepper button{background:var(--panel);border:0;border-right:1px solid var(--rule);
  padding:.35rem .6rem;cursor:pointer;font-size:.82rem;line-height:1.2}
.stepper button:last-child{border-right:0}
.stepper button:hover:not(:disabled){background:var(--paper-2)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.counter{flex:none;white-space:nowrap;color:var(--muted)}
.counter b{color:var(--fg)}
table.grid{border-collapse:collapse;font-size:.78rem;width:100%}
table.grid th,table.grid td{border:1px solid var(--line);padding:.22rem .4rem;text-align:left;white-space:nowrap}
table.grid th{background:var(--paper-2);font-weight:500}
table.grid td.blankcell{background:var(--miss)}
.audit{font-size:.79rem;border-left:3px solid var(--y);padding:.35rem .6rem;background:var(--paper-2);margin-bottom:.35rem}

/* extraction scene */
.brief{background:var(--paper-2);border-left:3px solid var(--x);padding:.55rem .8rem;margin-bottom:.6rem}
.brief.empty-brief{border-left-style:dashed;border-left-color:var(--line);color:var(--muted)}
.brief.empty-brief p{font-size:.95rem}
.brief p{font-family:Newsreader,serif;font-size:1.02rem;line-height:1.5;margin:0 0 .4rem;max-width:none}
.brief p:last-child{margin-bottom:0}
.brief p.ask{font-family:"IBM Plex Sans",sans-serif;font-size:.92rem;font-weight:500}
.brief p.bgtext{white-space:pre-line}
.scene{display:flex;flex-wrap:wrap;gap:.4rem;padding:.55rem;border:1px solid var(--line);background:var(--paper-2);margin-bottom:.6rem}
.thing{display:flex;align-items:center;gap:.35rem;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:.22rem .6rem .22rem .38rem;cursor:grab;touch-action:none;flex:0 1 auto;max-width:100%;
  font:inherit;font-size:.8rem;color:inherit}
.thing:hover{border-color:var(--x)}
.thing .gl{font-size:1.15rem;line-height:1;flex:none}
.thing > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.thing.dragging{opacity:.35}
.thing.done{opacity:.35;cursor:default;border-style:dashed}
.webwrap{position:relative}
.reveal{text-align:center;min-height:2.6rem;margin-top:.2rem}
.reveal .vn{font-size:.82rem;color:var(--muted)}
.reveal .vv{font-family:Newsreader,serif;font-size:1.5rem;line-height:1.2}
.reveal .vv.none{color:var(--flag);font-size:1.05rem}
.dragimg{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%);font-size:1.6rem}

/* the picture */
:root{--sky:#d7e3ec; --water:#bed2e0; --land:#cbd6c8; --ground:#dcd6c6}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#1d2b38; --water:#1b2a37; --land:#243028; --ground:#2b2a22}
}
:root[data-theme="dark"]{--sky:#1d2b38; --water:#1b2a37; --land:#243028; --ground:#2b2a22}
.picwrap{border:1px solid var(--line);background:var(--paper-2);padding:.4rem;margin-bottom:.7rem}
.sidebyside{display:flex;gap:.7rem;align-items:flex-start;flex-wrap:wrap}
.sidebyside > *{flex:1 1 340px;min-width:0}
.sidebyside .picwrap{margin-bottom:0}
.collect{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem;
  padding:.45rem .6rem;background:var(--paper-2);border:1px solid var(--line)}
.pitem{cursor:grab}
.pitem.placed{opacity:.22}
.setting{font-family:Newsreader,serif;font-size:1rem;line-height:1.5;margin:0 0 .4rem;color:var(--muted)}
.picture{display:block;width:100%;height:auto;touch-action:none;border:1px solid var(--line);background:var(--panel)}
.pitem{cursor:grab}
.pitem.placed{opacity:.3}
.pitem.tried{opacity:.6}
.preview{margin:.5rem 0;border:1px solid var(--line);padding:.3rem;background:var(--paper-2)}
.preview .picture{touch-action:auto}
.srows{display:flex;flex-direction:column;gap:.25rem;margin-top:.4rem}
.srow{display:flex;gap:.3rem;align-items:center;min-width:0}
.srow input,.srow select{font-size:.78rem;min-width:0}
.srow .gin{width:2.4rem;text-align:center;flex:0 0 auto}
.srow input[type="text"]:not(.gin){flex:1 1 7rem;min-width:4rem}
.srow select{flex:1 1 6rem;max-width:11rem}
.srow .iconb{flex:0 0 auto}
.dragimg.txt{font-size:.78rem;background:var(--ink);color:#fff;padding:.22rem .55rem;border-radius:12px;
  font-family:"IBM Plex Sans",sans-serif;white-space:nowrap}

/* extraction: page nav */
.pagenav{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;margin:0 0 .7rem}
.pagenav button{background:var(--panel);border:0;border-right:1px solid var(--rule);
  padding:.32rem .75rem;font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap;color:inherit}
.pagenav button:last-child{border-right:0}
.pagenav button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pagenav button:disabled{opacity:.4;cursor:not-allowed}

/* extraction: the line of webs */
.strip{display:flex;align-items:center;justify-content:center;gap:.15rem;
  overflow:hidden;padding:.3rem 0;touch-action:pan-y;user-select:none}
.slot{display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.slot.void{visibility:hidden}
.webcard{display:flex;flex-direction:column;align-items:center;gap:.15rem}
.webcard.done{opacity:.4}
.slot:not(.focus) .webcard{cursor:pointer;opacity:.75}
.slot:not(.focus) .webcard:hover{opacity:1}
.band{font-size:.72rem;background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:.2rem .65rem;cursor:grab;white-space:nowrap;touch-action:none;font-variant-numeric:tabular-nums}
.band:active{cursor:grabbing}
.minilab{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.25}
.minilab .mo{white-space:nowrap}
.minilab .my{font-weight:600;color:var(--fg);font-size:.78rem}
.band b{font-weight:600}
.hub .hubdisc,.hub .hubyear{transform-box:fill-box;transform-origin:center}
.hub.tick .hubdisc{animation:hubflash 1.1s ease-out}
.hub.tick .hubyear{animation:hubpop .6s ease-out}
@keyframes hubflash{0%{fill:var(--y-soft);stroke:var(--y);stroke-width:4}100%{}}
@keyframes hubpop{0%{transform:scale(1.25);fill:var(--y)}100%{transform:scale(1)}}
.focusring .wnode.used{opacity:.5}
.strip.linked .slot.focus .webcard{opacity:1}
.strip.linked .focusring .wnode.used{opacity:1}
.strip.linked .slot:not(.focus) .webcard{opacity:.3}
.strip.linked .slot:not(.focus) .webcard:hover{opacity:.8}
.varlist{display:flex;flex-direction:column;gap:.25rem}
.varrow{display:flex;gap:.4rem;align-items:center;font-size:.8rem;border:1px solid var(--line);
  background:var(--panel);border-radius:14px;padding:.2rem .55rem}
.varrow .gl{font-size:1.05rem;flex:none}
.varrow span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keybox{border-left:3px solid var(--y);background:var(--paper-2);padding:.45rem .6rem;
  margin-top:.7rem;font-size:.79rem;line-height:1.45}
.keybox p{margin:0 0 .3rem}
.keybox p:last-child{margin:0}

/* extraction: the table you build */
.tablebox{border:1px dashed var(--line);padding:.55rem;margin-top:.7rem;background:var(--paper-2);
  transition:background .12s,border-color .12s}
.tablebox.hot{border-color:var(--x);border-style:solid;background:var(--panel)}
.tabcap{font-size:.74rem;color:var(--muted);margin-bottom:.35rem;letter-spacing:.02em}
.dropempty{font-size:.85rem;color:var(--muted);padding:1.2rem .6rem;text-align:center;line-height:1.5}
table.grid td.unfilled{background:var(--panel);outline:1.5px dotted var(--muted);outline-offset:-4px}
table.grid td.rowlab{background:var(--paper-2);font-weight:500;font-variant-numeric:tabular-nums}
table.grid td.aim{box-shadow:inset 0 0 0 2px var(--x)}
table.grid tr.aim td{box-shadow:inset 0 2px 0 -1px var(--x),inset 0 -2px 0 -1px var(--x)}

const VOCAB_ALL=VOCAB.flatMap(g=>g.terms.map(x=>Object.assign({g:g.g},x)));
/* longest phrases first, so "methodology story" wins over "story" and
   "categorical variable" over "variable" */
const VOCAB_PATS=VOCAB_ALL.flatMap(v=>v.m.map(p=>({id:v.id,p,re:new RegExp('^(?:'+p+')$','i')})))
  .sort((a,b)=>b.p.length-a.p.length);
const VOCAB_RE=new RegExp('\\b(?:'+VOCAB_PATS.map(x=>x.p).join('|')+')\\b','gi');
function vocabFor(word){ const hit=VOCAB_PATS.find(x=>x.re.test(word)); return hit?hit.id:null; }

/* Turn library words inside a block of text into tappable words. Only the
   first time each word appears in the block, so the line stays readable. */
function linkTerms(root){
  const seen=new Set();
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>
    n.parentNode.closest('button,a,input,textarea,select,.vterm')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const text=node.nodeValue; VOCAB_RE.lastIndex=0;
    let m, last=0, frag=null;
    while((m=VOCAB_RE.exec(text))){
      const id=vocabFor(m[0]);
      if(!id||seen.has(id)) continue;
      seen.add(id);
      frag=frag||document.createDocumentFragment();
      frag.appendChild(document.createTextNode(text.slice(last,m.index)));
      const b=document.createElement('button'); b.type='button'; b.className='vterm'; b.dataset.v=id;
      b.textContent=m[0]; b.title='What does \u201c'+m[0]+'\u201d mean?';
      frag.appendChild(b); last=m.index+m[0].length;
    }
    if(frag){ frag.appendChild(document.createTextNode(text.slice(last))); node.parentNode.replaceChild(frag,node); }
  });
}

/* Two kinds of message. A confirmation ("Saved", "Coloured by ...") only
   needs a glance, so it goes quickly. A warning explains why something did
   not work, so it stays about five seconds; tapping it closes it sooner. */
let toastT;
function toast(msg,isWarn){

  t.setAttribute('role',isWarn?'alert':'status');

}

/* ---------- value helpers ---------- */
const isBlank=v=>v===null||v===undefined||(typeof v==='string'&&v.trim()==='');
function num(v){
  if(isBlank(v))return null;
  if(typeof v==='number')return Number.isFinite(v)?v:null;
  const s=String(v).replace(/,/g,'').trim();
  if(s==='')return null;
  const n=Number(s);
  return Number.isFinite(n)?n:null;
}
function isYearCol(p,i){
  if(i===undefined||i===null||i<0) return false;
  const nm=String(p.cols[i]||'');
  if(/year|\bdate\b/i.test(nm)) return true;
  const v=p.vars[i];
  return !!(v&&v.numeric&&v.min>=1000&&v.max<=2999&&v.nums.every(x=>Number.isInteger(x)));
}
function fmtC(p,i,n){ return isYearCol(p,i)?String(Math.round(n)):fmt(n); }
const fmt=n=>n===null?'—':(Math.abs(n)>=1000?n.toLocaleString(undefined,{maximumFractionDigits:0}):(Math.round(n*100)/100).toString());
function mean(a){return a.reduce((s,x)=>s+x,0)/a.length}
function corr(a,b){
  const n=a.length; if(n<4)return null;
  const ma=mean(a),mb=mean(b);
  let sa=0,sb=0,sab=0;
  for(let i=0;i<n;i++){const da=a[i]-ma,db=b[i]-mb;sa+=da*da;sb+=db*db;sab+=da*db;}
  if(sa===0||sb===0)return null;
  return sab/Math.sqrt(sa*sb);
}

/* ---------- dataset profiling ---------- */
function profile(ds){
  const cols=ds.cols, rows=ds.rows, n=rows.length;
  const vars=cols.map((name,i)=>{
    const raw=rows.map(r=>r[i]);
    const blanks=raw.filter(isBlank).length;
    const present=raw.filter(v=>!isBlank(v));
    const nums=present.map(num).filter(v=>v!==null);
    const numeric = present.length>0 && nums.length/present.length>=0.6;
    const distinct=new Set(present.map(v=>typeof v==='string'?v.trim():v)).size;
    const rawDistinct=new Set(raw.map(v=>v===null||v===undefined?'\u0000null':String(v))).size;
    const flags=[];
    if(blanks>0) flags.push(`${blanks} of ${n} blank`);
    if(numeric && nums.length<present.length) flags.push(`${present.length-nums.length} of these are words, not numbers`);
    if(distinct<=1) flags.push('every row has the same value, so it tells you nothing');
    // whitespace-variant coding
    const blankVariants=new Set(raw.filter(v=>typeof v==='string'&&v.trim()==='').map(v=>JSON.stringify(v)));
    if(blankVariants.size>1) flags.push(`blank is written ${blankVariants.size} different ways, so the computer sees them as different answers`);
    else if(blankVariants.size===1 && raw.some(v=>v===null)) flags.push('blank is written two different ways, so the computer sees them as different answers');
    return {name,idx:i,numeric,blanks,distinct,rawDistinct,n,
            values:raw, nums, flags,
            min:nums.length?Math.min(...nums):null, max:nums.length?Math.max(...nums):null};
  });
  return {cols,rows,n,vars};
}
function pairVals(p,i,j){
  const a=[],b=[],idx=[];
  for(let r=0;r<p.n;r++){
    const x=num(p.rows[r][i]), y=num(p.rows[r][j]);
    if(x!==null&&y!==null){a.push(x);b.push(y);idx.push(r);}
  }
  return {a,b,idx};
}

/* Vetting: the criteria the task template actually requires. */
function vet(p){
  const isIndexLike=v=>{
    if(!v.numeric||v.nums.length<4)return false;
    if(/^(year|no|id|index|row)$/i.test(v.name.trim()))return true;
    const d=v.nums.slice(1).map((x,i)=>x-v.nums[i]);
    return d.every(x=>x===d[0])&&d[0]!==0;
  };
  const numv=p.vars.filter(v=>v.numeric&&v.distinct>1&&!isIndexLike(v));
  const catv=p.vars.filter(v=>!v.numeric&&v.distinct>1&&v.distinct<=12);
  const minPair=Math.max(15,Math.round(p.n*0.5));
  const out=[];
  out.push({k:'cases',ok:p.n>=30,label:`${p.n} observations`,
            note:p.n>=30?'enough rows to show a distribution':'too few rows for a distribution'});
  out.push({k:'vars',ok:numv.length>=3,label:`${numv.length} usable number columns, ${catv.length} group columns`,
            note:numv.length>=3?'':'needs at least three to build and colour a scatterplot'});
  const anyBlank=p.vars.some(v=>v.blanks>0);
  out.push({k:'mess',ok:anyBlank,warn:!anyBlank,label:anyBlank?'has gaps and coding problems to judge':'completely clean',
            note:anyBlank?'':'nothing for students to decide about measurement quality'});
  // interesting pair
  let best=null;
  for(let i=0;i<numv.length;i++)for(let j=i+1;j<numv.length;j++){
    const {a,b}=pairVals(p,numv[i].idx,numv[j].idx);
    if(a.length<minPair)continue;
    const r=corr(a,b); if(r===null)continue;
    const ar=Math.abs(r);
    if(ar>=0.3&&ar<=0.97){ if(!best||ar>best.r) best={r:ar,x:numv[i].name,y:numv[j].name,signed:r}; }
  }
  out.push({k:'pair',ok:!!best,
            label:best?`${best.x} vs ${best.y} (r = ${best.signed.toFixed(2)})`:'no clear two-variable relationship',
            note:best?'visible but not automatic':'students would see only scatter'});
  // decoy + revealer against the best pair
  let revealer=null,decoy=null;
  if(best){
    const xi=p.vars.find(v=>v.name===best.x).idx, yi=p.vars.find(v=>v.name===best.y).idx;
    for(const v of numv){
      if(v.name===best.x||v.name===best.y)continue;
      const pa=pairVals(p,xi,v.idx), pb=pairVals(p,yi,v.idx);
      if(pa.a.length<minPair||pb.a.length<minPair)continue;
      const r1=Math.abs(corr(pa.a,pa.b)||0), r2=Math.abs(corr(pb.a,pb.b)||0);
      const s=Math.min(r1,r2);
      if(s>=0.30&&(!revealer||s>revealer.s)) revealer={name:v.name,s};
      if(Math.max(r1,r2)<=0.15&&(!decoy||Math.max(r1,r2)<decoy.s)) decoy={name:v.name,s:Math.max(r1,r2)};
    }
    for(const v of catv){ if(!revealer) revealer={name:v.name+' (groups)',s:null,cat:true}; }
  }
  out.push({k:'third',ok:!!(revealer&&decoy),warn:!!(revealer&&!decoy)||!!(!revealer&&decoy),
            label: revealer&&decoy ? `third variable that reveals (${revealer.name}) and one that doesn't (${decoy.name})`
                  : revealer ? `a revealing third variable (${revealer.name}) but no decoy`
                  : decoy ? 'only decoys — no third variable reveals anything'
                  : 'no third variable works',
            note: revealer&&decoy?'':'the drag-a-third-variable item cannot run here'});
  // smallest referenced category
  let smallest=null;
  for(const v of catv){
    const counts={};
    v.values.forEach(x=>{ if(!isBlank(x)){const k=String(x).trim(); counts[k]=(counts[k]||0)+1;} });
    const mn=Math.min(...Object.values(counts));
    if(smallest===null||mn<smallest.n) smallest={n:mn,v:v.name};
  }
  out.push({k:'cats',ok:!smallest||smallest.n>=10,warn:smallest&&smallest.n>=3&&smallest.n<10,
            label: smallest?`smallest group has ${smallest.n} case${smallest.n===1?'':'s'} (${smallest.v})`:'no grouping columns',
            note: smallest&&smallest.n<10?'an item about that group would rest on too few cases':''});
  return out;
}

let CAP={db:null,sample:null,user:null,downloads:null,assets:null};
/* Standalone (GitHub Pages): no claude.ai runtime, so live replies are
   unavailable, the written examples are used instead, and saved tasks last
   only for the session. Nothing is written to localStorage, sessionStorage,
   cookies or any other browser store. */
function localCaps(){
  return{db:null,sample:null,user:null,downloads:dl(),assets:null};
}
function dl(){
  const typeOf=n=>/\.html?$/i.test(n)?'text/html':/\.csv$/i.test(n)?'text/csv':'text/plain';
  const go=(filename,data,type)=>{
    const u=URL.createObjectURL(new Blob([data],{type:type||typeOf(filename)}));
    const a=document.createElement('a');a.href=u;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  };
  return{async save(o){go(o.filename,o.data);},async file(name,data,o){go(name,data,o&&o.mimeType);}};
}
/* Capabilities asked for:
     'sample'    - so DRS can reply.
     'downloads' - so a student can take their own report away.
     'db'        - ONLY for teacher task designs, in the "tasks" collection.
                   No student work is ever written to it: responses, charts,
                   drawings, marks and stories stay in the open tab and are
                   gone when it closes.
     'assets'    - ONLY for the photos teachers put behind a task's picture.
     'user'      - only to note which teacher saved a task (an opaque id).
                   Students are never identified. */
(async()=>{
  await Promise.resolve();
  if(!window.claude||!claude.use){ CAP=localCaps(); checkAIStatus(); render(); return; }
  CAP={db:null,sample:null,user:null,downloads:null,assets:null};
  AIStatus.state='checking';
  /* each capability lights up the moment it arrives, so one slow answer
     never holds up the others (the AI assistant in particular) */
  const one=(name,then)=>claude.use(name).catch(()=>null).then(v=>{CAP[name]=v; if(then) then(v); render();});
  await Promise.all([
    one('sample',v=>{ if(!v) checkAIStatus(); else AIStatus.state='on'; }),
    one('downloads'),
    one('db',()=>startTaskStore()),
    one('assets'),
    one('user')
  ]);
  aiDetails();
})();

/* ============================================================
   THE TASK STORE — teacher designs only
   One document per task in the "tasks" collection. The whole task is kept
   as a JSON string in "body" so nested tables survive as they are. The
   photo behind the picture goes to the artifact's asset store (or, when
   that is unavailable, is shrunk and kept inline).
   ============================================================ */
const TaskStore={on:false,status:'',unsub:null};
let pointerDown=false;
document.addEventListener('pointerdown',()=>{pointerDown=true;},true);
document.addEventListener('pointerup',()=>{pointerDown=false;if(TaskStore.pending){TaskStore.pending=false;render();}},true);
function startTaskStore(){
  if(!CAP.db||TaskStore.unsub) return;
  TaskStore.on=true;
  try{
    TaskStore.unsub=CAP.db.collection('tasks').onSnapshot(snap=>{
      const saved=[];
      snap.docs.forEach(d=>{
        const v=d.data()||{};
        try{
          const t=JSON.parse(v.body||'{}');
          if(!t||!t.title) return;
          t.savedId=d.id;
          saved.push(t);
        }catch(e){}
      });
      saved.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
      state.tasks=saved.concat(state.tasks.filter(t=>!t.savedId));
      TaskStore.status='';
      if(state.view==='teacher'){ if(pointerDown) TaskStore.pending=true; else render(); }
    },e=>{
      TaskStore.status='Saved tasks could not be loaded ('+((e&&e.code)||'error')+'). New saves stay in this session.';
      TaskStore.on=false;
      if(state.view==='teacher') render();
    });
  }catch(e){ TaskStore.on=false; }
}
/* shrink a photo so it is quick to load: longest side maxPx, JPEG */
function shrinkPicture(url,maxPx,q){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,maxPx/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k));
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
      g.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q));
    };
    im.onerror=()=>rej(new Error('picture'));
    im.src=url;
  });
}
function dataUrlBlob(u){
  const [h,b]=u.split(','); const bin=atob(b); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'});
}
async function storePicture(pic){
  if(pic.stored) return pic.stored;
  if(CAP.assets){
    try{
      const small=await shrinkPicture(pic.url,1600,0.85);
      const up=await CAP.assets.upload(dataUrlBlob(small));
      pic.stored={id:pic.id,name:pic.name,assetId:up.id};
      return pic.stored;
    }catch(e){ /* fall through to inline */ }
  }
  let inline=await shrinkPicture(pic.url,1000,0.75);
  if(inline.length>150000) inline=await shrinkPicture(pic.url,720,0.65);
  if(inline.length>150000) throw new Error('That photo is too detailed to save. Try a smaller one.');
  pic.stored={id:pic.id,name:pic.name,dataUrl:inline};
  return pic.stored;
}
/* variables renamed since some tasks were saved */
const RENAMED_COLS={"July-Sept (temp, F)": "Average Temperature (July-Sept, F)", "Apr-May (temp, F)": "Average Temperature (Apr-May, F)", "Jan-Feb (temp, F)": "Average Temperature (Jan-Feb, F)"};
/* bring an older saved task up to date: renamed variables, and the first
   instruction, which used to be part of the brief and is now one of DRS's own
   lines that the teacher can show, hide or reword */
function upgradeTask(t){
  if(!t) return t;
  const rn=n=>RENAMED_COLS[n]||n;
  if(Array.isArray(t.vars)) t.vars=t.vars.map(rn);
  if(t.scene&&Array.isArray(t.scene.items)) t.scene.items.forEach(it=>{ if(it&&it.label) it.label=rn(it.label); });
  if(t.brief&&typeof t.brief.ask==='string'){
    const a=t.brief.ask.trim(), def=TEXTS.find(x=>x[0]==='bg.ask')[2];
    if(!t.texts) t.texts={};
    if(!t.hidden) t.hidden={};
    if(!a){ if(typeof t.hidden['bg.ask']!=='boolean') t.hidden['bg.ask']=true; }
    else if(a!==def&&!t.texts['bg.ask']) t.texts['bg.ask']=a;
    delete t.brief.ask;
  }
  if(!t.items) t.items={};
  if(t.items.storytelling && !t.items.story_method && !t.items.story_findings){
    const old=t.items.storytelling;
    const arr=Array.isArray(old)?old
      :(typeof old==='string'&&old.trim()?[{q:old,gold:(t.gold&&t.gold.storytelling)||''}]:[]);
    t.items.story_method=arr.length?arr:[{q:'',gold:''}];
    t.items.story_findings=[{q:'',gold:''}];
    delete t.items.storytelling;
  }
  if(!t.showStory) t.showStory={method:true,findings:true};
  return t;
}
/* bring a saved task's photo and uploaded table back into this session */
function adoptTask(t){
  upgradeTask(t);
  const sp=t.picture;
  if(sp&&!state.pictures.some(x=>x.id===sp.id)){
    const url=sp.assetId?('/_blob/'+sp.assetId):sp.dataUrl;
    if(url) state.pictures.push({id:sp.id,name:sp.name||'Picture',url,stored:sp});
  }
  if(t.customData&&!(t.dataset in DATASETS())){
    state.custom[t.dataset]=t.customData; delete profCache[t.dataset];
  }
}
async function saveTaskRecord(draft){
  const rec=JSON.parse(JSON.stringify(draft));
  rec.at=new Date().toISOString();
  delete rec.savedId;
  rec.picture=null;
  const bd=rec.scene&&rec.scene.backdrop;
  if(bd&&bd.indexOf('img:')===0){
    const pic=state.pictures.find(x=>x.id===bd.slice(4));
    if(pic) rec.picture=await storePicture(pic);
  }
  if(state.custom[rec.dataset]) rec.customData=state.custom[rec.dataset];
  else delete rec.customData;
  let body=JSON.stringify(rec);
  if(body.length>240000&&rec.customData){
    throw new Error('Your uploaded table is too large to save with the task. Use a smaller table, or a built-in dataset.');
  }
  if(body.length>240000) throw new Error('This task is too large to save. Try a smaller photo or fewer resource tables.');
  const meta={title:rec.title,dataset:rec.dataset,at:rec.at,body};
  try{ if(CAP.user&&CAP.user.id){ const uid=await CAP.user.id(); if(uid) meta.by=uid; } }catch(e){}
  const col=CAP.db.collection('tasks');
  if(draft.savedId){ await col.doc(draft.savedId).set(meta); }
  else { const ref=await col.add(meta); draft.savedId=ref.id; }
  return rec;
}

const main=document.getElementById('main');
/* The whole page is rebuilt on every change, which means going back to the top
   of the document each time unless we put the reader back where they were.
   Arriving somewhere new — another view, another stage, another dataset, another
   page within a stage — should start at the top. Everything else is a change made
   in place, so the scroll position is kept and the caret is put back in whatever
   field the person was typing in. */
let lastPlace=null;
function placeKey(){
  /* exPage is a real page turn within Extraction, so it counts as arriving
     somewhere new. idPage is only a silent record of how far the student got
     and ticks over while they work, so it must not move the page. */
  return [state.view,state.stage,state.dsKey,state.exPage].join('|');
}
function render(){
  document.querySelectorAll('.navb').forEach(b=>b.setAttribute('aria-current',String(b.dataset.view===state.view)));
  const badge=document.getElementById('dsbadge');
  badge.textContent = state.dsKey ? dsName(state.dsKey) : '';

  const place=placeKey();
  const stay=(lastPlace!==null && place===lastPlace);
  const y=window.scrollY;
  const act=document.activeElement;
  const focus=(stay&&act&&main.contains(act)&&/^(INPUT|TEXTAREA)$/.test(act.tagName))
    ? {path:nodePath(act),start:act.selectionStart,end:act.selectionEnd} : null;

  main.innerHTML='';
  ({home:viewHome,student:viewStudent,teacher:viewTeacher,vocab:viewVocab}[state.view]||viewHome)();
  main.querySelectorAll('.guide').forEach(linkTerms);

  if(stay){
    window.scrollTo({top:y});
    if(focus){
      const n=nodeAt(focus.path);
      if(n&&/^(INPUT|TEXTAREA)$/.test(n.tagName)){
        n.focus({preventScroll:true});
        try{ n.setSelectionRange(focus.start,focus.end); }catch(e){}
      }
    }
  }else{
    window.scrollTo({top:0});
  }
  lastPlace=place;
  if(state.view==='vocab'&&state.vocabFocus){
    const id=state.vocabFocus; state.vocabFocus=null;
    requestAnimationFrame(()=>{
      const n=document.getElementById('v-'+id); if(!n) return;
      n.scrollIntoView({block:'center'}); n.classList.add('hit');
      setTimeout(()=>n.classList.remove('hit'),1400);
    });
  }
}
/* where a node sits in the tree, as child indexes down from main */
function nodePath(n){
  const out=[];
  while(n&&n!==main){ out.unshift([...n.parentNode.childNodes].indexOf(n)); n=n.parentNode; }
  return out;
}
function nodeAt(path){
  let n=main;
  for(const i of path){ n=n&&n.childNodes[i]; if(!n) return null; }
  return n;
}
document.querySelectorAll('.navb').forEach(b=>b.onclick=()=>{
  if(b.dataset.view==='vocab'){ openVocab(null); return; }
  if(b.dataset.view!=='home'&&!state.dsKey){ warn('Choose a dataset first'); state.view='home'; render(); return; }
  state.view=b.dataset.view; render();
});

function qualityLine(p){
  let blanks=0, flags=0;
  p.vars.forEach(v=>{ blanks+=(v.blanks||0); flags+=v.flags.filter(f=>!/blank/i.test(f)).length; });
  if(blanks&&flags) return 'Contains missing values and gaps';
  if(blanks) return 'Contains missing values';
  if(flags) return 'Contains coding problems';
  return 'No missing values';
}

function handlePicture(file,then){
  if(!file)return;
  if(file.size>4*1024*1024){ warn('That picture is over 4 MB — try a smaller one'); return; }
  const r=new FileReader();
  r.onload=()=>{
    const id='pic_'+Date.now();
    state.pictures.push({id,name:file.name.replace(/\.[^.]+$/,''),url:String(r.result)});
    toast('Added '+file.name);
    if(then) then(id); else render();
  };
  r.onerror=()=>warn('Could not read that picture');
  r.readAsDataURL(file);
}

function handleUpload(file){
  if(!file)return;
  const finish=(cols,rows)=>{
    if(!cols||!cols.length){warn('Could not read a header row');return;}
    const key='up_'+Date.now();
    state.custom[key]={name:file.name.replace(/\.[^.]+$/,''),cols,rows};
    delete profCache[key];
    toast('Added '+file.name); render();
  };
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    const fr=new FileReader();
    fr.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
        const cols=(aoa[0]||[]).map(c=>String(c===null?'':c));
        const rows=aoa.slice(1).filter(r=>r.some(c=>!isBlank(c)));
        finish(cols,rows);
      }catch(err){warn('Could not read that spreadsheet');}
    };
    fr.readAsArrayBuffer(file);
  }else{
    Papa.parse(file,{header:false,skipEmptyLines:true,complete:res=>{
      const d=res.data; const cols=(d[0]||[]).map(String);
      finish(cols,d.slice(1).filter(r=>r.some(c=>!isBlank(c))));
    }});
  }
}

/* small live thumbnail from the data itself */
function thumbnail(p){
  const W=260,H=90,svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:'100%'});
  const numv=p.vars.filter(v=>v.numeric&&v.distinct>2);
  if(numv.length<2){svg.appendChild(mk('text',{x:8,y:50,'font-size':11,fill:'var(--muted)'},'not enough numbers'));return svg;}
  const {a,b}=pairVals(p,numv[0].idx,numv[1].idx);
  if(!a.length)return svg;
  const xs=sc(Math.min(...a),Math.max(...a),6,W-6), ys=sc(Math.min(...b),Math.max(...b),H-8,8);
  a.forEach((v,i)=>svg.appendChild(mk('circle',{cx:xs(v),cy:ys(b[i]),r:2,fill:'var(--x)','fill-opacity':.55})));
  return svg;
}

/* ---------- item + response column ---------- */
function qlist(task,stageKey){
  const it=task&&task.items?task.items[stageKey]:null;
  const gd=task&&task.gold?task.gold[stageKey]:null;
  if(Array.isArray(it)) return it.map(q=>({q:q.q||'',gold:q.gold||'',goldDraft:!!q.goldDraft}));
  if(typeof it==='string'&&it.trim()) return [{q:it,gold:(typeof gd==='string'?gd:'')||''}];
  return [];
}
function qlistDraft(draft,stageKey){
  if(!Array.isArray(draft.items[stageKey])){
    const q=typeof draft.items[stageKey]==='string'?draft.items[stageKey]:'';
    const g=typeof draft.gold[stageKey]==='string'?draft.gold[stageKey]:'';
    draft.items[stageKey]=(q||g)?[{q,gold:g}]:[{q:'',gold:''}];
  }
  if(!draft.items[stageKey].length) draft.items[stageKey].push({q:'',gold:''});
  return draft.items[stageKey];
}

function txt(key,vars){

function richText(str){

}

function dsName(key){

/* one switch per stage. Tasks saved before that had a single switch for all

function guideOn(t,stageKey){

  return t.showGuide!==false;
}
/* each line of generic guidance can be shown or hidden by the teacher.
   An explicit choice in t.hidden wins; banners fall back to the older
   per-stage switch so tasks saved before this still behave the same. */
const ALWAYS_SHOWN=['id.axisRule'];
function shownIn(t,key){
  if(ALWAYS_SHOWN.includes(key)) return true;
  if(t&&t.hidden&&typeof t.hidden[key]==='boolean') return !t.hidden[key];
  if(key.startsWith('guide.')) return guideOn(t,key.slice(6).replace(/\d+$/,''));
  return true;
}
function shows(key){ return shownIn(activeTask(),key); }
function stageGuide(){

    ],

/* Questions for one stage, or for several shown together. Interpretation
   shows the teacher's Identification questions first and its own after them,
   numbered straight through. Each answer keeps the key it always had
   ('identification', 'interpretation:1', ...), so nothing written is mixed up. */
function pageQuestions(stageKeys,defaultStem){
  const task=activeTask();
  const out=[];
  stageKeys.forEach(sk=>{
    const qs=qlist(task,sk);
    const real=qs.map((qq,i)=>({qq,i})).filter(x=>(x.qq.q||'').trim());
    real.forEach(x=>out.push({q:x.qq.q,gold:x.qq.goldDraft?'':(x.qq.gold||''),key:qs.length>1?sk+':'+x.i:sk}));
  });
  if(!out.length){
    const last=stageKeys[stageKeys.length-1];
    out.push({q:defaultStem||STARTER_STEMS[last]||'',key:last});
  }
  return out;
}
/* one question, its answer box, and its buttons. locked: the student has
   moved past it and the teacher does not allow revising, so it is read-only */
function qBlock(qq,i,n,opts,locked,onType){
  const key=qq.key;
  const wrap=el('div','qblock');
  if(n>1){const nm=el('div','qnum');nm.textContent='Question '+(i+1)+(opts&&opts.step?' of '+n:'');wrap.appendChild(nm);}
  const q=el('div'); q.className='serif'; q.style.fontSize='1.05rem'; q.style.lineHeight='1.45'; q.style.marginBottom='.5rem';
  q.style.whiteSpace='pre-line';  /* keep the teacher's line breaks and paragraphs */
  q.textContent=qq.q||''; wrap.appendChild(q);
  const ta=document.createElement('textarea');
  ta.rows=n>1?(opts&&opts.step?6:4):7;
  ta.placeholder='Write what you found and how you know it.';
  ta.value=state.responses[key]||'';
  wrap.appendChild(ta);
  if(locked){
    ta.readOnly=true; ta.classList.add('locked');
    const nt=el('p','tiny muted'); nt.style.margin='.35rem 0 0';
    nt.textContent='You have moved past this question, so this answer can no longer be changed.';
    wrap.appendChild(nt);
    return {wrap,ta};
  }
  let ask=null;
  ta.oninput=()=>{state.responses[key]=ta.value; if(ask) ask.disabled=aiState(key).loading||!ta.value.trim(); if(onType) onType(ta.value);};
  const r=el('div','row'); r.style.marginTop='.4rem';
  const save=document.createElement('button'); save.className='btn'; save.textContent='Save response';
  save.onclick=()=>saveResponse(key);
  r.appendChild(save);
  const partner=opts&&opts.ai&&partnerOn(qq);
  if(partner){
    const h=aiState(key), ansMode=helpStance(activeTask())==='answer';
    ask=btn(h.loading?'Thinking\u2026':(h.turns.length&&!ansMode?'Ask your thinking partner again':'Ask your thinking partner'),
      ()=>askHelp(qq,opts.ai),'ghost');
    ask.disabled=h.loading||!(state.responses[key]||'').trim();
    ask.title='Write an answer first, then ask your thinking partner about it';
    r.appendChild(ask);
  }
  wrap.appendChild(r);
  if(partner) wrap.appendChild(helpBox(key));
  return {wrap,ta};
}
/* can students change an answer once they have moved on? the teacher decides */
function reviseOn(){ const t=activeTask(); return !(t&&t.allowRevise===false); }
function itemCol(host,stageKey,defaultStem,opts){
  const qs=pageQuestions(Array.isArray(stageKey)?stageKey:[stageKey],defaultStem);
  const h=el('h3'); h.textContent=qs.length>1?'Your questions':'Your task'; host.appendChild(h);
  if(opts&&opts.step&&qs.length>1) return itemColSteps(host,qs,opts);
  let first=null;
  qs.forEach((qq,i)=>{
    const b=qBlock(qq,i,qs.length,opts,false);
    host.appendChild(b.wrap);
    if(i===0) first=b.ta;
  });
  return first;
}
/* One question at a time. The next one stays hidden until the current one
   has an answer. Going back is always possible to read earlier answers;
   changing them only if the teacher allows it. */
function itemColSteps(host,qs,opts){
  const g=opts.step, n=qs.length;
  if(!state.qStep) state.qStep={};
  if(!state.qReached) state.qReached={};
  let reached=Math.min(state.qReached[g]||0,n-1);
  let cur=Math.min(Math.max(state.qStep[g]||0,0),reached);
  state.qStep[g]=cur; state.qReached[g]=reached;
  const answered=i=>!!(state.responses[qs[i].key]||'').trim();

  /* where the student is: one dot per question, reachable ones can be tapped */
  const dots=el('div','qdots');
  qs.forEach((qq,i)=>{
    const d=document.createElement('button'); d.type='button';
    d.className='qdot'+(i===cur?' cur':'')+(i<=reached&&answered(i)?' done':'');
    d.textContent=String(i+1);
    d.disabled=i>reached;
    d.title=i>reached?'Answer the questions before this one first':'Question '+(i+1);
    d.setAttribute('aria-current',String(i===cur));
    d.onclick=()=>{state.qStep[g]=i;render();};
    dots.appendChild(d);
  });
  host.appendChild(dots);

  const locked=!reviseOn()&&cur<reached;
  let next=null;
  const b=qBlock(qs[cur],cur,n,opts,locked,v=>{ if(next) next.disabled=!v.trim(); });
  host.appendChild(b.wrap);

  const nav=el('div','row qnav');
  if(cur>0) nav.appendChild(btn('\u2190 Previous question',()=>{state.qStep[g]=cur-1;render();},'ghost'));
  if(cur<n-1){
    if(cur<reached){
      nav.appendChild(btn('Next question \u2192',()=>{state.qStep[g]=cur+1;render();}));
    }else{
      next=btn('Next question \u2192',()=>{
        if(!answered(cur)){ warn('Answer this question first'); return; }
        state.qReached[g]=Math.max(state.qReached[g]||0,cur+1);
        state.qStep[g]=cur+1; render();
      });
      next.disabled=!answered(cur);
      next.title='Answer this question to see the next one';
      nav.appendChild(next);
    }
  }
  host.appendChild(nav);
  const note=el('p','tiny muted'); note.style.margin='.4rem 0 0';
  if(cur<n-1&&cur>=reached){
    note.textContent=reviseOn()
      ? 'Answer this question to see the next one.'
      : 'Answer this question to see the next one. Once you move on, you cannot change this answer.';
  }else if(cur===n-1){
    note.textContent='This is the last question.';
  }
  if(note.textContent) host.appendChild(note);
  return b.ta;
}
const INTERP_STAGES=['identification','interpretation'];
/* Answers are held in state.responses as the student types, and go no further.
