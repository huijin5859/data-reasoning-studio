/* ---------- how big a chart is drawn ----------
   Every chart is drawn into a viewBox, so a chart is resized by changing the
   width and height it is laid out at and letting the viewBox do the rest.
   Nothing about the data or the marks changes, only how much room it takes. */
const ZOOMS=[0.7,0.85,1,1.2,1.45,1.75,2.1];
/* When set, charts are laid out at exactly this width and height (in px, one
   viewBox unit per pixel) so a story card can be any shape. Text keeps its
   size; the plot area takes the room. Only chartAt() sets it. */
let CHART_BOX=null;
function zoomOf(v){ return v.zoom||1; }
function sizeChart(svg,v){
  if(CHART_BOX) return svg;
  const z=zoomOf(v);
  if(z===1) return svg;
  const w=svg.getAttribute('width');
  if(w===null||!/^[\d.]+$/.test(w)) return svg;   // fluid charts size themselves
  const vb=(svg.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  if(vb.length!==4||!vb[2]||!vb[3]) return svg;
  svg.setAttribute('width',Math.round(vb[2]*z));
  svg.setAttribute('height',Math.round(vb[3]*z));
  return svg;
}
function zoomButtons(v){
  const w=el('div','zoomctl');
  const step=d=>{
    let i=ZOOMS.indexOf(zoomOf(v));
    if(i<0) i=ZOOMS.indexOf(1);
    v.zoom=ZOOMS[Math.max(0,Math.min(ZOOMS.length-1,i+d))];
    render();
  };
  const mkb=(ch,title,fn,off)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='iconb'; b.textContent=ch; b.title=title;
    b.onclick=fn; b.disabled=off; return b;
  };
  w.appendChild(mkb('\u2212','Make this chart smaller',()=>step(-1),zoomOf(v)<=ZOOMS[0]));
  w.appendChild(mkb('+','Make this chart bigger',()=>step(1),zoomOf(v)>=ZOOMS[ZOOMS.length-1]));
  if(zoomOf(v)!==1){
    w.appendChild(mkb(Math.round(zoomOf(v)*100)+'%','Back to the normal size',
      ()=>{v.zoom=1;render();},false));
  }
  return w;
}
const PALETTE=['#2f6f9e','#c26a16','#4a7c59','#8a5a9e','#a8322a','#3f8f8a','#8d7b2f','#6b6f76'];
function isMarked(vizId,row){
  return state.noticed.some(x=>x.row===row && (x.viz===undefined||x.viz===null||x.viz===vizId));
}
function toggleMark(vizId,row,label){
  if(!annoLive()) return;
  const at=state.noticed.findIndex(x=>x.row===row &&
    (state.markScope==='all' ? true : (x.viz===undefined||x.viz===null||x.viz===vizId)));
  if(at>=0){
    // tapping a marked point again takes the mark off
    if(state.markScope==='all') state.noticed=state.noticed.filter(x=>x.row!==row);
    else state.noticed.splice(at,1);
  }else{
    state.noticed.push(state.markScope==='all'
      ? {row,text:label}
      : {row,text:label,viz:vizId});
  }
  render();
}
function markLabel(svg,x,y,text,W){
  const right = x < W-70;
  const t=mk('text',{x:right?x+8:x-8,y:y-7,'font-size':9,
    'text-anchor':right?'start':'end',fill:'var(--flag)'},text);
  t.style.pointerEvents='none';
  svg.appendChild(t);
}

function colourOf(t){ return `hsl(${210-160*t} 62% ${58-8*t}%)`; }
function scatterSvg(p,v){
  const hasNumCol = v.ci!==null&&v.ci!==undefined&&p.vars[v.ci]&&asNumber(p.vars[v.ci])&&p.vars[v.ci].nums.length>0;
  const SCALE = hasNumCol?34:0;
  const W=CHART_BOX?CHART_BOX.w:380,H=CHART_BOX?CHART_BOX.h:300+SCALE,L=52,B=40+SCALE,T=12,R=12;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'display:block'});
  const pts=[];
  for(let r=0;r<p.n;r++){
    const x=num(p.rows[r][v.xi]), y=num(p.rows[r][v.yi]);
    if(x===null||y===null)continue;
    pts.push({x,y,r});
  }
  if(!pts.length){svg.appendChild(mk('text',{x:12,y:40,'font-size':11,fill:'var(--muted)'},'no overlapping values'));return svg;}
  const xlo=Math.min(...pts.map(d=>d.x)),xhi=Math.max(...pts.map(d=>d.x));
  const ylo=Math.min(...pts.map(d=>d.y)),yhi=Math.max(...pts.map(d=>d.y));
  const xs=sc(xlo,xhi,L,W-R), ys=sc(ylo,yhi,H-B,T);
  svg.appendChild(mk('line',{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:'var(--line)'}));
  svg.appendChild(mk('line',{x1:L,y1:T,x2:L,y2:H-B,stroke:'var(--line)'}));
  niceTicks(xlo,xhi,4).forEach(t=>svg.appendChild(mk('text',{x:xs(t),y:H-B+13,'font-size':9,'text-anchor':'middle',fill:'var(--muted)'},fmtC(p,v.xi,t))));
  niceTicks(ylo,yhi,4).forEach(t=>svg.appendChild(mk('text',{x:L-5,y:ys(t),'font-size':9,'text-anchor':'end','dominant-baseline':'middle',fill:'var(--muted)'},fmtC(p,v.yi,t))));
  svg.appendChild(mk('text',{x:(L+W-R)/2,y:H-6,'font-size':9.5,'text-anchor':'middle',fill:'var(--x)'},shorten(p.cols[v.xi],38)));
  svg.appendChild(mk('text',{x:11,y:(T+H-B)/2,'font-size':9.5,'text-anchor':'middle',fill:'var(--y)',
    transform:`rotate(-90 11 ${(T+H-B)/2})`},shorten(p.cols[v.yi],32)));

  if(v.trend&&pts.length>2){
    let sx=0,sy=0,sxy=0,sxx=0;
    pts.forEach(d=>{sx+=d.x;sy+=d.y;sxy+=d.x*d.y;sxx+=d.x*d.x;});
    const nn=pts.length, den=nn*sxx-sx*sx;
    if(den!==0){
      const b=(nn*sxy-sx*sy)/den, a=(sy-b*sx)/nn;
      const y1=a+b*xlo, y2=a+b*xhi;
      const cl=Math.max(ylo,Math.min(yhi,y1)), ch=Math.max(ylo,Math.min(yhi,y2));
      const x1=b===0?xlo:(cl-a)/b, x2=b===0?xhi:(ch-a)/b;
      svg.appendChild(mk('line',{x1:xs(b===0?xlo:x1),y1:ys(cl),x2:xs(b===0?xhi:x2),y2:ys(ch),
        stroke:'var(--flag)','stroke-width':1.6,'stroke-dasharray':'5 3'}));
      let sd1=0,sd2=0;const mx=sx/nn,my=sy/nn;let cov=0;
      pts.forEach(d=>{cov+=(d.x-mx)*(d.y-my);sd1+=(d.x-mx)*(d.x-mx);sd2+=(d.y-my)*(d.y-my);});
      const r=(sd1&&sd2)?cov/Math.sqrt(sd1*sd2):0;
      svg.appendChild(mk('text',{x:W-R,y:T+10,'font-size':9.5,'text-anchor':'end',fill:'var(--flag)'},
        'trend line \u00b7 r = '+r.toFixed(2)));
    }
  }

  let keyMap=null;
  if(v.ci!==null&&v.ci!==undefined){
    const cv=p.vars[v.ci];
    if(asNumber(cv)){
      const cn=cv.nums, clo=Math.min(...cn), chi=Math.max(...cn);
      keyMap={numeric:true,clo,chi};
    }else{
      const levels=[...new Set(cv.values.filter(x=>!isBlank(x)).map(x=>String(x).trim()))].slice(0,8);
      keyMap={numeric:false,levels};
    }
  }
  pts.forEach(d=>{
    let fill='var(--x)',op=.68;
    if(keyMap){
      const raw=p.rows[d.r][v.ci];
      if(keyMap.numeric){
        const c=num(raw);
        if(c===null){fill='var(--muted)';op=.3;}
        else{const t=(c-keyMap.clo)/((keyMap.chi-keyMap.clo)||1);
          fill=colourOf(t);op=.8;}
      }else{
        const i=keyMap.levels.indexOf(String(raw).trim());
        fill=i<0?'var(--muted)':PALETTE[i%PALETTE.length]; op=i<0?.3:.8;
      }
    }
    const flagged=isMarked(v.id,d.r);
    const c=mk('circle',{cx:xs(d.x),cy:ys(d.y),r:flagged?5.5:3.6,
      fill:flagged?'none':fill,'fill-opacity':op,
      stroke:flagged?'var(--flag)':'none','stroke-width':flagged?2:0});
    if(annoLive()) c.style.cursor='pointer';
    c.onclick=()=>toggleMark(v.id,d.r,
      `${p.cols[v.xi]} ${fmtC(p,v.xi,d.x)}, ${p.cols[v.yi]} ${fmtC(p,v.yi,d.y)}`);
    const tt=mk('title',{},`${p.cols[v.xi]}: ${fmtC(p,v.xi,d.x)}\n${p.cols[v.yi]}: ${fmtC(p,v.yi,d.y)}`);
    c.appendChild(tt);
    svg.appendChild(c);
    if(flagged) markLabel(svg,xs(d.x),ys(d.y),
      fmtC(p,v.xi,d.x)+', '+fmtC(p,v.yi,d.y),W);
  });
  if(keyMap&&keyMap.numeric){
    // a scale, so the colours say which way is more and which way is less
    const bx=L, by=H-SCALE+8, bw=150, bh=10, steps=24;
    for(let i=0;i<steps;i++){
      svg.appendChild(mk('rect',{x:bx+i*(bw/steps),y:by,width:bw/steps+0.6,height:bh,
        fill:colourOf(i/(steps-1))}));
    }
    svg.appendChild(mk('rect',{x:bx,y:by,width:bw,height:bh,fill:'none',stroke:'var(--line)'}));
    svg.appendChild(mk('text',{x:bx,y:by+bh+10,'font-size':9,fill:'var(--muted)'},
      fmtC(p,v.ci,keyMap.clo)));
    svg.appendChild(mk('text',{x:bx+bw,y:by+bh+10,'font-size':9,'text-anchor':'end',
      fill:'var(--muted)'},fmtC(p,v.ci,keyMap.chi)));
    svg.appendChild(mk('text',{x:bx+bw+8,y:by+bh-1,'font-size':9.5,fill:'var(--third)'},
      shorten(p.cols[v.ci],22)));
    svg.appendChild(mk('text',{x:bx,y:by-3,'font-size':8.5,fill:'var(--muted)'},'less'));
    svg.appendChild(mk('text',{x:bx+bw,y:by-3,'font-size':8.5,'text-anchor':'end',
      fill:'var(--muted)'},'more'));
    const miss=p.rows.filter(r=>isBlank(r[v.ci])).length;
    if(miss){
      svg.appendChild(mk('circle',{cx:bx+bw+14,cy:by-6,r:3.5,fill:'var(--muted)','fill-opacity':.3}));
      svg.appendChild(mk('text',{x:bx+bw+21,y:by-3,'font-size':8.5,fill:'var(--muted)'},
        'grey = not recorded'));
    }
  }
  if(keyMap&&!keyMap.numeric){
    keyMap.levels.forEach((lv,i)=>{
      const y=T+6+i*12;
      svg.appendChild(mk('circle',{cx:W-R-70,cy:y,r:3.5,fill:PALETTE[i%PALETTE.length]}));
      svg.appendChild(mk('text',{x:W-R-62,y,'font-size':8.5,'dominant-baseline':'middle',fill:'var(--muted)'},shorten(lv,16)));
    });
  }
  if(v.curve){
    const c=curveThrough(pts,xs,ys,'var(--third)');
    if(c) svg.appendChild(c);
    else svg.appendChild(mk('text',{x:L+6,y:T+10,'font-size':9,fill:'var(--muted)'},'not enough points for a curve'));
  }
  svg._plot={l:L,r:W-R,t:T,b:H-B,
    fx:px=>fmtC(p,v.xi,xlo+(px-L)/((W-R-L)||1)*(xhi-xlo)),
    fy:py=>fmtC(p,v.yi,ylo+((H-B)-py)/((H-B-T)||1)*(yhi-ylo)),
    count:(x1,y1,x2,y2)=>{const at=[];
      pts.forEach(d=>{const X=xs(d.x),Y=ys(d.y);if(X>=x1&&X<=x2&&Y>=y1&&Y<=y2)at.push([X,Y]);});
      return {n:at.length,at,unit:'points'};}};
  return svg;
}

   INTERPRETATION — reflective tosses

/* ============================================================
   INTERPRETATION — the thinking desk
   Identification is reading the data: what is there.
   Interpretation is reading beyond it: why, and how sure.
   Nothing new is built or marked here. The charts and the marks
   carry over as reference, and the work is reasoning about them.
   ============================================================ */
function markKey(x){ return x.row+'|'+(x.text||''); }
/* every answer on the Interpretation page, with the question it answers */
function interpAnswers(){
  return pageQuestions(INTERP_STAGES).map(x=>({q:x.q,a:(state.responses[x.key]||'').trim()}));
}
function hasFirstGuess(){
  // the shelf opens once they have had a real go at any question on the page
  return interpAnswers().some(x=>x.a.split(/\s+/).filter(Boolean).length>=5);
}

/* ---------- what the teacher hands over ----------------------------------
   One resource object covers all three shapes: a link, a small table, or a
   written note. Whichever shape it takes, the teacher fills the same two
   fields — where it came from, and what it can and cannot tell you — so the
   resource reaches the student as evidence to weigh, not as an answer key.
   Those two fields are shown to the student and are also what DRS reads
   when it needs to point at a source without giving away the conclusion. */
function resKind(r){ return r.kind || (r.table?'table':(r.url?'link':'note')); }
function blankResource(kind){
  return {kind:kind||'link',title:'',url:'',note:'',table:null,source:'',limits:''};
}
function resKindLabel(k){ return k==='link'?'link':k==='table'?'table':'written note'; }
/* a teacher's second spreadsheet — the one with the years and the events —
   becomes a table resource. Same reader the dataset upload uses. */
function readResourceTable(file,then){
  const done=(cols,rows)=>{
    if(!cols||!cols.length){warn('Could not find a header row');return;}
    then({cols:cols.map(String),rows:rows});
  };
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    const fr=new FileReader();
    fr.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
        const cols=(aoa[0]||[]).map(c=>String(c===null?'':c));
        done(cols,aoa.slice(1).filter(r=>r.some(c=>!isBlank(c))));
      }catch(err){warn('Could not read that spreadsheet');}
    };
    fr.readAsArrayBuffer(file);
  }else{
    Papa.parse(file,{header:false,skipEmptyLines:true,complete:res=>{
      const d=res.data;
      done((d[0]||[]).map(String),d.slice(1).filter(r=>r.some(c=>!isBlank(c))));
    }});
  }
}
function parsePastedTable(text){
  const lines=String(text||'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return null;
  const sep=lines[0].indexOf('\t')>=0?'\t':',';
  const cut=l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
  const cols=cut(lines[0]);
  if(!cols.length) return null;
  return {cols,rows:lines.slice(1).map(cut)};
}
/* what a new task starts with on the shelf: nothing, unless the dataset has a
   ready-made event table, and then one resource the teacher can edit or bin */
function resourceList(task){ return ((task&&task.resources)||[]).slice(); }
/* a search runs over the teacher's words and, for a table, over every row,
   so that typing a year lands on the row for that year */
function resMatches(r,q){
  if(!q) return {show:true,rows:null};
  const s=q.toLowerCase();
  const head=[r.title,r.note,r.source,r.limits,r.url]
    .some(v=>String(v||'').toLowerCase().includes(s));
  if(r.table&&r.table.rows){
    const idx=[];
    r.table.rows.forEach((row,i)=>{
      if(row.some(c=>String(c===null?'':c).toLowerCase().includes(s))) idx.push(i);
    });
    if(idx.length) return {show:true,rows:idx};
  }
  return {show:head,rows:null};
}
function resTable(tb,hits,id){
  const wrap=el('div');
  const all=tb.rows||[];
  const idx=(hits&&hits.length)?hits:all.map((_,i)=>i);
  const LIM=6, open=!!state.resOpen[id], cut=!hits&&idx.length>LIM&&!open;
  const shown=cut?idx.slice(0,LIM):idx;
  const t=document.createElement('table'); t.className='restable';
  const hr=document.createElement('tr');
  (tb.cols||[]).forEach(c=>{const th=document.createElement('th');th.textContent=c;hr.appendChild(th);});
  t.appendChild(hr);
  shown.forEach(i=>{
    const tr=document.createElement('tr');
    if(hits&&hits.length) tr.className='hit';
    (all[i]||[]).forEach(c=>{
      const td=document.createElement('td');
      td.textContent=(c===null||c===undefined)?'':String(c);
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  wrap.appendChild(t);
  if(cut||open){
    const b=document.createElement('button');
    b.type='button'; b.className='resmore';
    b.textContent=open?'Show fewer rows':('Show all '+idx.length+' rows');

  }else if(hits&&hits.length){

    n.textContent=idx.length+(idx.length===1?' row matches':' rows match')+' out of '+all.length;

}
/* one resource, as the student sees it */
function resourceCard(r,q,id){
  const m=resMatches(r,q);

  const k=resKind(r);
  const d=el('div','resitem');
  const t=el('div','rt');
  t.appendChild(document.createTextNode(r.title||'Untitled'));
  const kb=el('span','reskind'); kb.textContent=resKindLabel(k);
  t.appendChild(kb);
  d.appendChild(t);
  if(r.note){const n=el('div','rn');n.textContent=r.note;d.appendChild(n);}
  if(r.url){
    const a=document.createElement('a');
    a.href=r.url; a.target='_blank'; a.rel='noopener noreferrer';
    a.textContent=r.url; a.className='rl';
    d.appendChild(a);
  }
  if(r.table&&(r.table.rows||[]).length) d.appendChild(resTable(r.table,m.rows,id));
  const meta=el('div','resmeta');
  const line=(lab,val)=>{
    const w=el('div');
    const b=document.createElement('b'); b.textContent=lab+' ';
    w.appendChild(b); w.appendChild(document.createTextNode(val));
    meta.appendChild(w);
  };
  if(r.source) line('Where this came from.',r.source);
  if(r.limits) line('What it can and cannot tell you.',r.limits);
  if(!r.source&&!r.limits){
    meta.className='resmeta thin';
    const w=el('div');
    w.textContent='Your teacher has not said where this came from, so treat it carefully.';

  }

  cb.checked=!!state.resUsed[id];
  cb.onchange=()=>{state.resUsed[id]=cb.checked;};

  d.appendChild(u);

/* ============================================================
   THE PROMPT DRS IS GIVEN
   The wording that used to sit inside askToss lives here instead, split
   into named parts a teacher can rewrite in the Teacher view without
   touching any code. Only the line that fixes the JSON keys is held back,
   because changing it stops the three replies being read at all.
   A task with no edits sends exactly the defaults below.
   ============================================================ */
const PROMPT_FORMAT='Write ONE reply to the student\u2019s latest answer below, in the style described next. '+
  'Give only the words of the reply: plain sentences, no heading, no list, no quotation marks around it.';
const PROMPT_PARTS=[
  ['role','What DRS is doing',
   'You are helping a high school science teacher study how students reason about data.'],
  ['toss','When set to \u201cAsk a question back\u201d',
   'a single reflective question that hands the thinking back to the student. It must point at something specific in their own words or in the data. Do not supply any new information or evaluate whether they are right. One or two sentences.'],
  ['hint','When set to \u201cGive a hint\u201d',
   'a nudge that names where to look next but stops short of the explanation. One or two sentences.'],
  ['style','How every reply should be written',
   'Write for a 15-year-old: short sentences, everyday words, no technical terms the student did not use first. Never more than three sentences.']
];
const PROMPT_DEF=(function(){const o={};PROMPT_PARTS.forEach(([k,,d])=>o[k]=d);return o;})();
/* a teacher's wording if they wrote one, otherwise DRS's own */
function promptPart(t,key){
  const w=t&&t.prompts&&t.prompts[key];
  return (typeof w==='string'&&w.trim())?w.trim():PROMPT_DEF[key];
}
/* the whole prompt, exactly as it is sent. ctx may be left out to preview it. */
function helpStance(t){ const st=t&&t.stance; return (st==='hint'||st==='answer')?st:'toss'; }
function buildTossPrompt(t,ctx){
  const st=helpStance(t);
  const body=[
    promptPart(t,'role'),
    PROMPT_FORMAT,
    'Your reply: '+promptPart(t,st==='answer'?'hint':st),
    promptPart(t,'style')
  ].join('\n');
  return ctx ? body+'\n\n'+ctx : body;
}

/* ============================================================
   THE AI ASSISTANT — one reply under each question
   The student writes an answer, then asks. DRS sees that one question,
   the teacher's accepted answer, what has already been said about this
   question, and the student's latest answer, and replies once in the
   style the teacher chose. Asking again after a revision replaces the
   reply. Nothing is kept once the page closes.
   ============================================================ */
function aiState(key){
  if(!state.aiHelp) state.aiHelp={};
  return state.aiHelp[key]||(state.aiHelp[key]={turns:[],loading:false,live:'',err:'',example:false});
}
function aiOn(){ const t=activeTask(); return !(t&&t.stance==='off'); }
/* the thinking partner shows under a question when it is switched on; in
   "Show my answer" mode only where the teacher has a checked answer */
function partnerOn(qq){
  if(!aiOn()) return false;
  if(helpStance(activeTask())==='answer') return !!(qq.gold||'').trim();
  return true;
}
function aiDomId(key){ return 'ai-'+String(key).replace(/[^a-z0-9]/gi,'_'); }
function helpBox(key){
  const h=aiState(key);
  const box=el('div','aihelp'); box.id=aiDomId(key);
  const showing=h.loading?h.live:(h.turns.length?h.turns[h.turns.length-1].reply:'');
  if(!h.loading&&!showing&&!h.err){ box.hidden=true; return box; }
  const last=h.turns.length?h.turns[h.turns.length-1]:null, fromTeacher=!h.loading&&last&&last.teacher;
  if(fromTeacher) box.classList.add('teacherans');
  const l=el('div','lab'); l.textContent=fromTeacher?'Thinking partner \u00b7 your teacher\u2019s answer':'Thinking partner'; box.appendChild(l);
  const body=el('div','aireply');
  body.textContent=showing||(h.loading?'Thinking\u2026':'');
  box.appendChild(body);
  if(h.err){ const e=el('p','tiny muted'); e.style.margin='.3rem 0 0'; e.textContent=h.err; box.appendChild(e); }
  if(!h.loading&&showing){
    const n=el('p','tiny muted'); n.style.margin='.35rem 0 0';
    n.textContent=fromTeacher?'Compare it with what you wrote. What did you get, and what did you miss?':'If you change your answer, ask again.';
    box.appendChild(n);
  }
  return box;
}
function paintHelp(key){
  const box=document.getElementById(aiDomId(key)); if(!box) return;
  const b=box.querySelector('.aireply'); if(b) b.textContent=aiState(key).live||'Thinking\u2026';
}
async function askHelp(qq,stageLabel){
  const key=qq.key, a=(state.responses[key]||'').trim();
  if(!a){ warn('Write an answer first'); return; }
  const h=aiState(key); if(h.loading) return;
  const t=activeTask(), stance=helpStance(t);
  if(stance==='answer'){
    const g=(qq.gold||'').trim();
    if(!g){ warn('Your teacher has not added an answer for this question yet'); return; }
    h.turns=[{a,reply:g,teacher:true}]; h.err=''; render(); return;
  }
  const p=prof(state.dsKey), ds=DATASETS()[state.dsKey];
  const gold=(qq.gold||'').trim();
  const before=h.turns.map((x,i)=>`Student's earlier answer ${i+1}: "${x.a}"\nYour reply to it: "${x.reply}"`).join('\n\n');
  const ctx=`Dataset: ${dsName(state.dsKey)}. Columns: ${ds.cols.join(', ')}. ${ds.rows.length} observations.
This question is on the ${stageLabel} page.
The question: ${qq.q}
${gold
  ? 'The teacher\u2019s accepted answer, for your judgement only: '+gold+'\n'+
      'Do not quote it and do not give away what it says; use it only to judge what the student has and has not got yet.'
  : 'The teacher gave no accepted answer for this question.'}
${before?'What has already been said about this question:\n'+before+'\n':''}The student\u2019s latest answer: "${a}"`;
  const instr=buildTossPrompt(t,ctx);
  h.loading=true; h.live=''; h.err=''; h.example=false; render();
  let reply='';
  if(!CAP.sample&&window.claude&&claude.use){
    try{ CAP.sample=await claude.use('sample'); }catch(e){}
    if(!CAP.sample) await checkAIStatus(); else AIStatus.state='on';
  }
  if(CAP.sample){
    try{
      const out=await CAP.sample(instr,{modelTier:'default',onText:({text})=>{h.live=text;paintHelp(key);}});
      reply=((out&&out.text)||'').trim();
    }catch(e){
      reply=((e&&e.text)||'').trim();
      const c=e&&e.code;
      if(!reply) h.err=(c==='not_granted')?'Permission for this page to use Claude was not given, so your thinking partner cannot reply. It can be turned on from this artifact\u2019s Permissions menu.'
        :(c==='sampling_disabled')?'Claude replies are not available for this Claude account or organization.'
        :(c==='session_expired')?'Your Claude sign-in has expired. Sign in again, then ask.'
        :(c==='rate_limited')?'Too many questions at once, or the Claude usage limit was reached. Wait a moment, then ask again.'
        :'Your thinking partner could not answer just now. Try again.';
    }
  }else{
    h.err='Your thinking partner could not reply. '+(AIStatus.why||'Live replies are not available in this view.');
  }
  if(reply) h.turns.push({a,reply});
  h.loading=false; h.live=''; render();
}
function fallbackToss(resp){
  const frag=resp.trim().split(/[.!?]/)[0].slice(0,70);
  return {
    toss:`You said “${frag}”. What would you expect to see in this data if that were true — and is it there?`,
    hint:`Look at what else was happening in the same years. One of the other columns changes at the same time.`,
    answer:`The pattern is driven by a change that is not fully recorded in these columns, so the data narrows the explanation without settling it.`
  };
}

           {text:'In 1973, across all of Berkeley\u2019s graduate departments, the university accepted 44% of men but only 35% of women. University officials feared a sex discrimination lawsuit because this looked like clear evidence of bias against women.'},
           {img:LESSON_IMGS[0],alt:'Two donut charts for the whole graduate school: 44% of men accepted, 35% of women accepted.'}]},
         {h:'What did not add up',parts:[
           {text:'At Berkeley, the university did not make admission decisions as a whole; each department made its own decisions and had its own acceptance rate. So, the university asked statistician Peter Bickel to check whether the gap held up inside each department.'}]},
         {h:'What was really going on',parts:[
           {text:'The department-by-department analysis by Peter Bickel and his colleagues told a different story: the gap mostly disappeared, and women did better in several departments. Most women had applied to highly competitive departments, while most men applied to departments that accepted many applicants, which dragged down women\u2019s combined rate. This is called Simpson\u2019s Paradox.'},
           {text:'The charts below show the six largest departments. Their real names are replaced by the letters A to F. Taken together, these six departments show the same gap as the whole school: 46% of men were accepted, but only 30% of women. These numbers differ a little from 44% and 35% because they come from six departments, not all of them.'},

function chartSvg(p,v){
  const svg=v.type==='hist'?histSvg(p,v):
            v.type==='bars'?barsSvg(p,v):
            v.type==='parallel'?parallelSvg(p,v):
            v.type==='dual'?dualSvg(p,v):scatterSvg(p,v);
  drawAnno(svg,v);
  return sizeChart(svg,v);
}
function fluidChart(p,v){
  const svg=chartSvg(p,v);
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.style.width='100%'; svg.style.height='auto'; svg.style.display='block';
  return svg;
}
/* a chart laid out at an exact size, for story cards */
function chartAt(p,v,w,h){
  CHART_BOX={w:Math.max(160,Math.round(w)),h:Math.max(110,Math.round(h))};
  let svg;
  try{ svg=chartSvg(p,v); } finally{ CHART_BOX=null; }
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.style.width='100%'; svg.style.height='100%'; svg.style.display='block';
  return svg;
}
/* height over width of a chart at its usual size, so a new card looks as before */
function chartAspect(p,v){
  const vb=(chartSvg(p,Object.assign({},v,{zoom:1})).getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
  return (vb.length===4&&vb[2]&&vb[3])?vb[3]/vb[2]:0.75;
}
/* scroll the canvas (and the page) while something is dragged near an edge */
function edgeScroll(getY,onScroll){
  let raf=0, on=true;
  const tick=()=>{
    if(!on) return;
    const y=getY(), wrap=document.getElementById('boardwrap');
    let moved=false;
    if(wrap){
      const r=wrap.getBoundingClientRect(), zone=46;
      /* gentle near the edge, a little faster the closer the pointer gets */
      if(y>r.bottom-zone&&y<r.bottom+60){ wrap.scrollTop+=Math.min(10,2+(y-(r.bottom-zone))/6); moved=true; }
      else if(y<r.top+zone&&y>r.top-60&&wrap.scrollTop>0){ wrap.scrollTop-=Math.min(10,2+((r.top+zone)-y)/6); moved=true; }
    }
    if(!moved){
      if(y>innerHeight-36){ scrollBy(0,9); moved=true; }
      else if(y<36&&scrollY>0){ scrollBy(0,-9); moved=true; }
    }
    if(moved&&onScroll) onScroll();
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
  return ()=>{ on=false; cancelAnimationFrame(raf); };
}
function boardCols(){
  const bw=(document.getElementById('storyboard')||{}).clientWidth||780;

}

/* ============================================================
   SHOWING A CHART A DIFFERENT WAY
   In Interpretation the charts are organised by how many variables they
   hold. Here they are organised by the point a card makes. A student keeps
   a chart as it is (the default), shows it a different way, or builds a new
   view. Either way the new view lives only in the story; nothing goes back
   to the charts made earlier.
   ============================================================ */
const POINTS=[
  {k:'trend',   nm:'A trend',            ask:'something goes up, goes down, or stays steady over time', views:['line']},
  {k:'contrast',nm:'A contrast',         ask:'two or more groups are different',                         views:['groupbars','colour']},
  {k:'anomaly', nm:'An odd one out',     ask:'one observation does not fit the rest',                    views:['line','colour']},
  {k:'part',    nm:'A part of the whole',ask:'a share of all the observations falls in one group',      views:['pie','dots']}
];
const VIEW_KINDS={
  line:{nm:'Line graph',short:'change over time',
    use:'Pick a line graph when your idea is about change over time: going up, going down, or staying steady. For an odd one out, tap the point that does not fit and it will be circled.',
    needs:['x','y']},
  groupbars:{nm:'Side-by-side bars',short:'compare groups',
    use:'Pick side-by-side bars when you compare amounts across separate groups: which is bigger, and by how much. Every bar uses the same scale, so the comparison is fair.',
    needs:['g','y']},
  colour:{nm:'Split and colour by group',short:'same dots, coloured',
    use:'Pick split and colour when a pattern might look different inside each group than it does for everyone together. The dots stay where they were; only the colours are new.',
    needs:['x','y','g']},
  pie:{nm:'Circle',short:'shares of one whole',
    use:'Pick a circle when your idea is about shares of one whole, and there are only a few groups. The whole circle is every observation.',
    needs:['g']},
  dots:{nm:'Dot picture',short:'count the dots',
    use:'Pick a dot picture when you want people to count. Each dot stands for the same number of observations, so the groups can be compared by eye.',
    needs:['g']}
};
const VAR_LABEL={x:'Across the bottom',y:'Measured',g:'Groups'};

function timeVar(p){
  const v=p.vars.find(x=>x.numeric&&/year|date|time|season|month/i.test(x.name));
  return v?v.idx:(p.vars.find(x=>x.numeric)||p.vars[0]).idx;
}
function otherVar(p,not,numericOnly){
  const v=p.vars.find(x=>!not.includes(x.idx)&&(!numericOnly||x.numeric));
  return v?v.idx:null;
}
/* sensible starting variables, taken from the chart being re-shown */
function viewBase(p,v){
  const t=timeVar(p);
  if(!v) { const y=otherVar(p,[t],true); return {x:t,y:y,g:otherVar(p,[t,y],false)}; }
  if(v.type==='scatter'){
    const g=(v.ci!==null&&v.ci!==undefined)?v.ci:otherVar(p,[v.xi,v.yi],false);
    return {x:v.xi,y:v.yi,g};
  }
  if(v.type==='dual') return {x:v.xi,y:v.yi,g:v.y2};
  if(v.type==='parallel') return {x:t,y:v.xi,g:v.xj};
  const y=v.xi, x=(t!==y)?t:otherVar(p,[y],true);
  return {x,y,g:v.xi};
}
function median(a){ const s=a.slice().sort((m,n)=>m-n); const k=s.length>>1; return s.length%2?s[k]:(s[k-1]+s[k])/2; }
function niceCut(p,gi){
  const vv=p.vars[gi]; if(!vv||!asNumber(vv)||!vv.nums.length) return null;
  const m=median(vv.nums);
  if(isYearCol(p,gi)) return Math.round(m);
  const mag=Math.pow(10,Math.floor(Math.log10(Math.abs(m)||1))-1);
  return Math.round(m/mag)*mag;
}
/* a numeric variable with many values is split in two at a cut point;
   a variable with a few values keeps each value as its own group */
function splitsAtCut(p,gi){
  const vv=p.vars[gi];
  if(!vv||!asNumber(vv)) return false;
  return new Set(vv.nums).size>6;
}
function groupsOf(p,gi,cut){
  const vv=p.vars[gi]; const out=[];
  if(!vv) return out;
  if(splitsAtCut(p,gi)){
    const c=(cut===null||cut===undefined||isNaN(cut))?niceCut(p,gi):cut;
    const lo={label:'below '+fmtC(p,gi,c),rows:[]}, hi={label:fmtC(p,gi,c)+' or more',rows:[]};
    for(let r=0;r<p.n;r++){ const z=num(p.rows[r][gi]); if(z===null)continue; (z<c?lo:hi).rows.push(r); }
    return [lo,hi];
  }
  const m=new Map();
  for(let r=0;r<p.n;r++){
    const raw=p.rows[r][gi]; if(isBlank(raw)) continue;
    const k=vv.numeric?fmtC(p,gi,num(raw)):String(raw).trim();
    if(!m.has(k)) m.set(k,{label:k,rows:[],o:vv.numeric?num(raw):m.size});
    m.get(k).rows.push(r);
  }
  return [...m.values()].sort((a,b)=>a.o-b.o).slice(0,8);
}
function viewName(p,w){
  const k=VIEW_KINDS[w.kind]; if(!k) return 'A chart';
  const c=i=>(i===null||i===undefined||!p.cols[i])?'?':p.cols[i];
  const odd=(Array.isArray(w.odd)&&w.odd.length&&(w.kind==='line'||w.kind==='colour'))
    ? '. Odd one out circled: '+w.odd.map(r=>fmtC(p,w.x,num(p.rows[r][w.x]))+', '+fmtC(p,w.y,num(p.rows[r][w.y]))).join('; ') : '';
  if(w.kind==='line') return k.nm+': '+c(w.y)+' across '+c(w.x)+odd;
  if(w.kind==='groupbars') return k.nm+': average '+c(w.y)+' by '+c(w.g);
  if(w.kind==='colour') return k.nm+': '+c(w.x)+' and '+c(w.y)+', coloured by '+c(w.g)+odd;
  return k.nm+': observations by '+c(w.g);
}
function viewAspect(w){ return w.kind==='pie'?0.62:w.kind==='dots'?0.62:w.kind==='groupbars'?0.58:0.72; }
function viewAt(p,w,wd,ht){
  CHART_BOX={w:Math.max(160,Math.round(wd)),h:Math.max(110,Math.round(ht))};
  let svg; try{ svg=viewSvg(p,w); } finally{ CHART_BOX=null; }
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.style.width='100%'; svg.style.height='100%'; svg.style.display='block';
  return svg;
}
/* a point is circled if it was marked on the original chart, or tapped as the odd one out here */
function isOdd(w,r){ return isMarked(w.src,r)||(Array.isArray(w.odd)&&w.odd.includes(r)); }
function viewSvg(p,w){
  const W=CHART_BOX?CHART_BOX.w:400, H=CHART_BOX?CHART_BOX.h:Math.round(400*viewAspect(w));
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'display:block'});
  const say=t=>{svg.appendChild(mk('text',{x:12,y:30,'font-size':11,fill:'var(--muted)'},t));return svg;};
  const ok=i=>i!==null&&i!==undefined&&p.vars[i];
  const need=VIEW_KINDS[w.kind]?VIEW_KINDS[w.kind].needs:[];
  for(const n of need){ if(!ok(w[n])) return say('Choose '+VAR_LABEL[n].toLowerCase()+' below.'); }
  if(need.includes('y')&&!asNumber(p.vars[w.y])) return say(p.cols[w.y]+' is not a number. Choose a measured variable.');
  if(need.includes('x')&&!asNumber(p.vars[w.x])) return say(p.cols[w.x]+' is not a number. Choose another variable.');

  if(w.kind==='line'){
    const L=50,R=14,T=14,B=36;
    const pts=[];
    for(let r=0;r<p.n;r++){ const x=num(p.rows[r][w.x]),y=num(p.rows[r][w.y]); if(x!==null&&y!==null) pts.push({x,y,r}); }
    if(pts.length<2) return say('Not enough values to draw a line.');
    pts.sort((a,b)=>a.x-b.x);
    const xlo=pts[0].x,xhi=pts[pts.length-1].x;
    const ylo=Math.min(...pts.map(d=>d.y)),yhi=Math.max(...pts.map(d=>d.y));
    const xs=sc(xlo,xhi,L,W-R), ys=sc(ylo,yhi,H-B,T);
    svg.appendChild(mk('line',{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:'var(--line)'}));
    svg.appendChild(mk('line',{x1:L,y1:T,x2:L,y2:H-B,stroke:'var(--line)'}));
    niceTicks(xlo,xhi,4).forEach(t=>svg.appendChild(mk('text',{x:xs(t),y:H-B+13,'font-size':9,'text-anchor':'middle',fill:'var(--muted)'},fmtC(p,w.x,t))));
    niceTicks(ylo,yhi,4).forEach(t=>svg.appendChild(mk('text',{x:L-5,y:ys(t),'font-size':9,'text-anchor':'end','dominant-baseline':'middle',fill:'var(--muted)'},fmtC(p,w.y,t))));
    svg.appendChild(mk('text',{x:(L+W-R)/2,y:H-6,'font-size':9.5,'text-anchor':'middle',fill:'var(--x)'},shorten(p.cols[w.x],38)));
    svg.appendChild(mk('text',{x:11,y:(T+H-B)/2,'font-size':9.5,'text-anchor':'middle',fill:'var(--y)',transform:`rotate(-90 11 ${(T+H-B)/2})`},shorten(p.cols[w.y],32)));
    svg.appendChild(mk('polyline',{points:pts.map(d=>xs(d.x).toFixed(1)+','+ys(d.y).toFixed(1)).join(' '),
      fill:'none',stroke:'var(--y)','stroke-width':1.8,'stroke-linejoin':'round'}));
    pts.forEach(d=>{
      const m=isOdd(w,d.r);
      svg.appendChild(mk('circle',{cx:xs(d.x),cy:ys(d.y),r:m?5.5:2.2,fill:m?'none':'var(--y)',
        stroke:m?'var(--flag)':'none','stroke-width':m?2:0,'data-r':d.r}));
      if(m) markLabel(svg,xs(d.x),ys(d.y),fmtC(p,w.x,d.x)+', '+fmtC(p,w.y,d.y),W);
    });
    return svg;
  }

  const gs=groupsOf(p,w.g,w.cut);
  if(!gs.length) return say('Nothing recorded for '+p.cols[w.g]+'.');
  const caption=()=>svg.appendChild(mk('text',{x:6,y:11,'font-size':9,fill:'var(--third)'},
    shorten('Groups: '+p.cols[w.g],Math.floor(W/5.4))));
  const fit=px=>Math.max(6,Math.floor(px/5.4));

  if(w.kind==='groupbars'){
    caption();
    const L=Math.min(150,Math.round(W*.38)),R=40,T=20,B=26;
    const rows=gs.map(g=>{const vals=g.rows.map(r=>num(p.rows[r][w.y])).filter(z=>z!==null);
      return {label:g.label,n:vals.length,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null};});
    const hi=Math.max(...rows.map(r=>r.avg||0)), lo=Math.min(0,...rows.map(r=>r.avg||0));
    const xs=sc(lo,hi||1,L,W-R);
    const step=(H-T-B)/rows.length, bh=Math.min(22,step*.66);
    svg.appendChild(mk('line',{x1:xs(0),y1:T,x2:xs(0),y2:H-B,stroke:'var(--line)'}));
    rows.forEach((r,i)=>{
      const y=T+i*step+(step-bh)/2;
      svg.appendChild(mk('text',{x:L-6,y:y+bh/2,'font-size':9.5,'text-anchor':'end','dominant-baseline':'middle',fill:'var(--fg)'},shorten(r.label,fit(L-8))));
      if(r.avg===null){ svg.appendChild(mk('text',{x:L+4,y:y+bh/2,'font-size':9,'dominant-baseline':'middle',fill:'var(--muted)'},'no values')); return; }
      const x0=xs(Math.min(0,r.avg)), x1=xs(Math.max(0,r.avg));
      svg.appendChild(mk('rect',{x:x0,y,width:Math.max(1,x1-x0),height:bh,fill:PALETTE[i%PALETTE.length],'fill-opacity':.8}));
      svg.appendChild(mk('text',{x:x1+4,y:y+bh/2,'font-size':9.5,'dominant-baseline':'middle',fill:'var(--muted)'},fmt(r.avg)));
    });
    svg.appendChild(mk('text',{x:(L+W-R)/2,y:H-8,'font-size':9.5,'text-anchor':'middle',fill:'var(--y)'},'average '+shorten(p.cols[w.y],34)));
    return svg;
  }

  if(w.kind==='colour'){
    const L=50,R=12,T=12+gs.length*12,B=36;
    const all=[];
    gs.forEach((g,gi)=>g.rows.forEach(r=>{const x=num(p.rows[r][w.x]),y=num(p.rows[r][w.y]); if(x!==null&&y!==null) all.push({x,y,r,gi});}));
    if(!all.length) return say('No observations have both values.');
    const xlo=Math.min(...all.map(d=>d.x)),xhi=Math.max(...all.map(d=>d.x));
    const ylo=Math.min(...all.map(d=>d.y)),yhi=Math.max(...all.map(d=>d.y));
    const xs=sc(xlo,xhi,L,W-R), ys=sc(ylo,yhi,H-B,T);
    svg.appendChild(mk('line',{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:'var(--line)'}));
    svg.appendChild(mk('line',{x1:L,y1:T,x2:L,y2:H-B,stroke:'var(--line)'}));
    niceTicks(xlo,xhi,4).forEach(t=>svg.appendChild(mk('text',{x:xs(t),y:H-B+13,'font-size':9,'text-anchor':'middle',fill:'var(--muted)'},fmtC(p,w.x,t))));
    niceTicks(ylo,yhi,4).forEach(t=>svg.appendChild(mk('text',{x:L-5,y:ys(t),'font-size':9,'text-anchor':'end','dominant-baseline':'middle',fill:'var(--muted)'},fmtC(p,w.y,t))));
    svg.appendChild(mk('text',{x:(L+W-R)/2,y:H-6,'font-size':9.5,'text-anchor':'middle',fill:'var(--x)'},shorten(p.cols[w.x],38)));
    svg.appendChild(mk('text',{x:11,y:(T+H-B)/2,'font-size':9.5,'text-anchor':'middle',fill:'var(--y)',transform:`rotate(-90 11 ${(T+H-B)/2})`},shorten(p.cols[w.y],32)));
    all.forEach(d=>{
      const m=isOdd(w,d.r);
      svg.appendChild(mk('circle',{cx:xs(d.x),cy:ys(d.y),r:m?5.5:3.6,fill:m?'none':PALETTE[d.gi%PALETTE.length],
        'fill-opacity':.8,stroke:m?'var(--flag)':'none','stroke-width':m?2:0,'data-r':d.r}));
    });
    all.filter(d=>isOdd(w,d.r)).forEach(d=>markLabel(svg,xs(d.x),ys(d.y),fmtC(p,w.x,d.x)+', '+fmtC(p,w.y,d.y),W));
    gs.forEach((g,i)=>{
      const y=8+i*12;
      svg.appendChild(mk('circle',{cx:L+4,cy:y,r:3.5,fill:PALETTE[i%PALETTE.length]}));
      svg.appendChild(mk('text',{x:L+12,y,'font-size':9,'dominant-baseline':'middle',fill:'var(--fg)'},shorten(p.cols[w.g]+': '+g.label,fit(W-L-20))));
    });
    return svg;
  }

  const total=gs.reduce((a,g)=>a+g.rows.length,0)||1;
  const pct=n=>Math.round(100*n/total)+'%';

  if(w.kind==='pie'){
    const r=Math.min(H/2-12,W*.2), cx=r+10, cy=H/2+4, ir=r*.52;
    let a0=-Math.PI/2;
    gs.forEach((g,i)=>{
      const a1=a0+2*Math.PI*g.rows.length/total;
      const big=(a1-a0)>Math.PI?1:0;
      const P=(rr,a)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
      let d;
      if(g.rows.length===total){
        d=`M${cx} ${cy-r} A${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} L${cx-0.01} ${cy-ir} A${ir} ${ir} 0 1 0 ${cx} ${cy-ir} Z`;
      }else{
        const [x1,y1]=P(r,a0),[x2,y2]=P(r,a1),[x3,y3]=P(ir,a1),[x4,y4]=P(ir,a0);
        d=`M${x1} ${y1} A${r} ${r} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${ir} ${ir} 0 ${big} 0 ${x4} ${y4} Z`;
      }
      svg.appendChild(mk('path',{d,fill:PALETTE[i%PALETTE.length],'fill-opacity':.85,stroke:'var(--panel)','stroke-width':1.5}));
      a0=a1;
    });
    svg.appendChild(mk('text',{x:cx,y:cy+3,'font-size':10,'text-anchor':'middle',fill:'var(--muted)'},total+' in all'));
    const lx=cx+r+18;
    svg.appendChild(mk('text',{x:lx,y:cy-(gs.length-1)*8-16,'font-size':9,fill:'var(--third)'},shorten(p.cols[w.g],fit(W-lx-4))));
    gs.forEach((g,i)=>{
      const y=cy-(gs.length-1)*8+i*16;
      svg.appendChild(mk('rect',{x:lx,y:y-5,width:10,height:10,fill:PALETTE[i%PALETTE.length]}));
      svg.appendChild(mk('text',{x:lx+15,y,'font-size':9.5,'dominant-baseline':'middle',fill:'var(--fg)'},
        pct(g.rows.length)+'  '+shorten(g.label,fit(W-lx-40))));
    });
    return svg;
  }

  /* dots: each dot is the same number of observations */
  const most=Math.max(...gs.map(g=>g.rows.length));
  caption();
  const L=Math.min(140,Math.round(W*.34)), R=34, T=22, B=22;
  const room=W-L-R, rowH=(H-T-B)/gs.length;
  let per=1; for(const k of [1,2,5,10,20,50,100,200,500]){ per=k; if(Math.ceil(most/k)*9<=room*Math.max(1,Math.floor(rowH/9))) break; }
  const perRow=Math.max(1,Math.floor(room/9));
  gs.forEach((g,i)=>{
    const n=Math.ceil(g.rows.length/per), y0=T+i*rowH;
    svg.appendChild(mk('text',{x:L-6,y:y0+6,'font-size':9.5,'text-anchor':'end','dominant-baseline':'middle',fill:'var(--fg)'},shorten(g.label,fit(L-8))));
    svg.appendChild(mk('text',{x:L-6,y:y0+17,'font-size':8.5,'text-anchor':'end','dominant-baseline':'middle',fill:'var(--muted)'},g.rows.length+' ('+pct(g.rows.length)+')'));
    for(let k=0;k<n;k++){
      const cxk=L+4+(k%perRow)*9, cyk=y0+6+Math.floor(k/perRow)*9;
      if(cyk>y0+rowH-3) break;
      svg.appendChild(mk('circle',{cx:cxk,cy:cyk,r:3.4,fill:PALETTE[i%PALETTE.length],'fill-opacity':.85}));
    }
  });
  svg.appendChild(mk('text',{x:L,y:H-6,'font-size':9,fill:'var(--muted)'},'each dot = '+per+(per===1?' observation':' observations')));
  return svg;
}

/* the panel above the canvas: keep a card's chart, show it differently, or build a new chart */
function viewPanel(p,s){
  const vp=state.viewPanel;
  let b=null, w, srcViz=null;
  if(vp.isNew){
    if(!vp.draft) vp.draft={point:'trend',kind:'line',...viewBase(p,null),cut:null,src:null};
    w=vp.draft;
  }else{
    b=s.blocks.find(x=>x.bid===vp.bid);
    if(!b){ state.viewPanel=null; return null; }
    srcViz=(b.viz!==null&&b.viz!==undefined)?state.vizzes.find(x=>x.id===b.viz):null;
    if(!b.point) b.point='trend';
    w=b.view;
  }
  const point=vp.isNew?w.point:b.point;
  const box=el('section','viewpanel');
  box.setAttribute('aria-label',vp.isNew?'Build a new chart':'Keep or show differently');
  const head=el('div','vphead');
  const h=document.createElement('h4');
  const n=vp.isNew?0:storyOrder(s).indexOf(b)+1;
  h.textContent=vp.isNew?'Build a new chart for your story'
    :'Card '+n+': keep '+(srcViz?'“'+shorten(chartName(p,srcViz),40)+'”':'this chart')+' or show it differently';
  head.appendChild(h);
  head.appendChild(btn(vp.isNew?'Close':'Done',()=>{state.viewPanel=null;render();},'ghost'));
  box.appendChild(head);

  const q1=el('div','vpq'); q1.textContent='What point does this card make?';
  box.appendChild(q1);
  const pr=el('div','vpchoices');
  POINTS.forEach(pt=>{
    const o=document.createElement('button'); o.type='button';
    o.innerHTML=esc(pt.nm)+'<small>'+esc(pt.ask)+'</small>';
    o.setAttribute('aria-pressed',String(point===pt.k));
    o.onclick=()=>{
      if(vp.isNew){ w.point=pt.k; if(!pt.views.includes(w.kind)) w.kind=pt.views[0]; }
      else{ b.point=pt.k; if(b.view&&!pt.views.includes(b.view.kind)) b.view=null; }
      render();
    };
    pr.appendChild(o);
  });
  box.appendChild(pr);

  const q2=el('div','vpq'); q2.textContent=vp.isNew?'How will you show it?':'Keep it, or show it a different way?';
  box.appendChild(q2);
  const kr=el('div','vpchoices');
  const ptObj=POINTS.find(x=>x.k===point)||POINTS[0];
  if(!vp.isNew){
    const o=document.createElement('button'); o.type='button';
    o.innerHTML='Keep it as it is<small>the chart you already made</small>';
    o.setAttribute('aria-pressed',String(!b.view));
    o.onclick=()=>{ b.view=null; render(); };
    kr.appendChild(o);
  }
  ptObj.views.forEach(k=>{
    const K=VIEW_KINDS[k];
    const o=document.createElement('button'); o.type='button';
    o.innerHTML=esc(K.nm)+'<small>'+esc(K.short)+'</small>';
    o.setAttribute('aria-pressed',String(!!w&&w.kind===k));
    o.onclick=()=>{
      if(vp.isNew){ w.kind=k; }
      else{
        const base=b.view?{x:b.view.x,y:b.view.y,g:b.view.g,cut:b.view.cut,odd:b.view.odd}:Object.assign(viewBase(p,srcViz),{cut:null});
        b.view=Object.assign(base,{kind:k,src:srcViz?srcViz.id:null});
      }
      render();
    };
    kr.appendChild(o);
  });
  box.appendChild(kr);

  const use=el('p','vpuse');
  if(w&&VIEW_KINDS[w.kind]) use.textContent=VIEW_KINDS[w.kind].use;
  else{
    use.textContent='Keeping the chart is often the clearest choice. If you want to point something out on it, you can mark it up.';
    use.appendChild(document.createTextNode(' '));
    const mu=btn('Mark it up',()=>{ s.tool='chart'; state.viewPanel=null; render(); },'ghost');
    mu.classList.add('mini');
    use.appendChild(mu);
  }
  box.appendChild(use);

  if(w&&VIEW_KINDS[w.kind]){
    const vars=el('div','vpvars');
    VIEW_KINDS[w.kind].needs.forEach(key=>{
      const lab=document.createElement('label');
      lab.appendChild(document.createTextNode(VAR_LABEL[key]));
      const sel=document.createElement('select');
      p.vars.forEach(vv=>{
        if((key==='x'||key==='y')&&!asNumber(vv)) return;
        const o=document.createElement('option'); o.value=vv.idx; o.textContent=p.cols[vv.idx];
        if(w[key]===vv.idx) o.selected=true;
        sel.appendChild(o);
      });
      if(w[key]===null||w[key]===undefined){ const o=document.createElement('option'); o.value=''; o.textContent='choose'; o.selected=true; sel.prepend(o); }
      sel.onchange=()=>{ w[key]=sel.value===''?null:+sel.value; if(key==='g') w.cut=null; if(key==='x'||key==='y') w.odd=[]; render(); };
      lab.appendChild(sel); vars.appendChild(lab);
    });
    if(VIEW_KINDS[w.kind].needs.includes('g')&&w.g!==null&&w.g!==undefined&&splitsAtCut(p,w.g)){
      const lab=document.createElement('label');
      lab.appendChild(document.createTextNode('Split the groups at'));
      const inp=document.createElement('input'); inp.type='number';
      inp.value=(w.cut===null||w.cut===undefined)?niceCut(p,w.g):w.cut;
      inp.onchange=()=>{ const z=parseFloat(inp.value); w.cut=isNaN(z)?null:z; render(); };
      lab.appendChild(inp); vars.appendChild(lab);
    }
    box.appendChild(vars);
  }

  const tapOdd=point==='anomaly'&&w&&(w.kind==='line'||w.kind==='colour');
  if(vp.isNew||tapOdd){
    if(tapOdd){
      const t=el('p','vptap');
      t.textContent=(w.odd||[]).length
        ? 'Circled: the point you picked as the odd one out. Tap it again to unmark it, or tap a different point.'
        : 'Tap the point that does not fit the rest. It will be circled, with its values, so your audience sees it too.';
      box.appendChild(t);
    }
    const pv=el('div','vpprev'+(tapOdd?' tappable':''));
    CHART_BOX={w:420,h:Math.round(420*viewAspect(w))};
    let svg; try{ svg=viewSvg(p,w); } finally{ CHART_BOX=null; }
    svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.style.width='100%'; svg.style.height='auto'; svg.style.display='block';
    if(tapOdd) svg.addEventListener('click',ev=>{
      /* the nearest point to the tap, within easy finger reach */
      const m=svg.getScreenCTM(); if(!m) return;
      const pt=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(m.inverse());
      let best=null,bd=18*18;
      svg.querySelectorAll('circle[data-r]').forEach(c=>{
        const dx=+c.getAttribute('cx')-pt.x, dy=+c.getAttribute('cy')-pt.y, d=dx*dx+dy*dy;
        if(d<bd){bd=d;best=+c.getAttribute('data-r');}
      });
      if(best===null) return;
      const odd=Array.isArray(w.odd)?w.odd:(w.odd=[]);
      const i=odd.indexOf(best);
      if(i>=0) odd.splice(i,1); else odd.push(best);
      render();
    });
    pv.appendChild(svg); box.appendChild(pv);
  }
  if(vp.isNew){
    const add=el('div','row'); add.style.marginTop='.5rem';
    add.appendChild(btn('Add to story',()=>{
      const nb=newBlock(s,null);
      nb.point=w.point;
      nb.view={kind:w.kind,x:w.x,y:w.y,g:w.g,cut:w.cut,src:null,odd:(w.point==='anomaly'&&w.odd)?w.odd.slice():[]};
      s.blocks.push(nb);
      state.viewPanel=null; state.boardScroll=Math.max(0,nb.y-24); render();
    }));
    box.appendChild(add);
  }
  const note=el('p','vpnote');
  note.textContent='A chart made here lives only in your story. The charts you made before stay as they are.';
  box.appendChild(note);
  return box;
}

function newBlock(s,vizId,at){
  const n=s.blocks.length;
  if(at) return {bid:'b'+(state.storySeq++),viz:vizId,text:'',
                 x:Math.max(0,Math.round(at.x)), y:Math.max(0,Math.round(at.y))};
  /* below everything already there, so nothing is covered */
  let low=0;
  s.blocks.forEach(b=>{
    const node=document.querySelector('.sblock[data-bid="'+b.bid+'"]');
    low=Math.max(low,(b.y||0)+(node?node.offsetHeight:220));
  });
  return {bid:'b'+(state.storySeq++),viz:vizId,text:'',
          x:24, y:n?low+26:24};
}
/* lay cards out in rows across the board, each row as tall as its tallest card */
function layoutBlocks(s){
  const board=document.getElementById('storyboard');
  const bw=board?board.clientWidth:780;
  let x=24,y=24,rowH=0;
  s.blocks.forEach(b=>{
    const node=board&&board.querySelector('.sblock[data-bid="'+b.bid+'"]');
    const w=node?node.offsetWidth:(b.w||225), h=node?node.offsetHeight:220;
    if(x>24&&x+w>bw-12){ x=24; y+=rowH+26; rowH=0; }
    b.x=x; b.y=y; x+=w+26; rowH=Math.max(rowH,h);
  });
}

function storyBlock(p,s,b,i){
  const tool=s.tool||'move';
  const emptySlot = b.slot && (b.viz===null||b.viz===undefined) && !(b.text||'').trim();
  const box=el('div','sblock'+(s.pending===b.bid?' pending':'')+(b.slot?' slotted':'')+(emptySlot?' empty':''));
  box.setAttribute('data-bid',b.bid);
  box.setAttribute('data-empty',(b.viz===null||b.viz===undefined)?'1':'0');
  box.style.left=(b.x||20)+'px'; box.style.top=(b.y||20)+'px';
  if(b.w) box.style.width=b.w+'px';

  const head=el('div','sbhead');
  const num=el('span','qnum'); num.textContent=(i+1);
  const ctl=el('div','row');
  const hasChart=!!b.view||(b.viz!==null&&b.viz!==undefined);
  if(hasChart){
    const sb=el('button','showas'); sb.type='button';
    sb.textContent=b.view?'Shown differently':'Keep or show differently';
    sb.title='Keep this chart as it is, or show it a different way to make your point clearer';
    sb.setAttribute('aria-pressed',String(!!(state.viewPanel&&state.viewPanel.bid===b.bid)));
    sb.onclick=()=>{
      state.viewPanel=(state.viewPanel&&state.viewPanel.bid===b.bid)?null:{bid:b.bid};
      render();
    };
    ctl.appendChild(sb);
  }
  ctl.appendChild(iconBtn('\u00d7','Remove from the story',()=>{
    if(state.viewPanel&&state.viewPanel.bid===b.bid) state.viewPanel=null;
    s.blocks.splice(i,1);
    s.links=(s.links||[]).filter(l=>l.from!==b.bid&&l.to!==b.bid);
    render();
  }));
  head.append(num,ctl);
  if(tool==='move') dragBlock(head,b,s);
  box.appendChild(head);
  if(b.slot){
    const sl=el('div','slotname'); sl.textContent=b.slot;
    box.appendChild(sl);
  }

  let hasFig=false;
  if(b.view){
    const nm=el('div','gname'); nm.textContent=viewName(p,b.view);
    const tag=el('span','storyonly'); tag.textContent='story only';
    nm.appendChild(tag);
    const fig=el('div','sbfig');
    fig._draw=()=>{
      const w=fig.clientWidth||Math.max(150,(b.w||225)-18);
      const h=b.fh||Math.round(w*viewAspect(b.view));
      fig.style.height=h+'px';
      fig.replaceChildren(viewAt(p,b.view,w,h));
    };
    fig._draw();
    requestAnimationFrame(()=>{ if(fig.isConnected){ fig._draw(); paintBoard(s); } });
    box.append(nm,fig); hasFig=true;
  }else if(b.viz!==null&&b.viz!==undefined){
    const v=state.vizzes.find(x=>x.id===b.viz);
    if(v){
      const nm=el('div','gname'); nm.textContent=chartName(p,v);
      const fig=el('div','sbfig');
      const asp=chartAspect(p,v);
      if(tool==='chart') fig._pad=annoPad(fig,p,v);
      fig._draw=()=>{
        const w=fig.clientWidth||Math.max(150,(b.w||225)-18);
        const h=b.fh||Math.round(w*asp);
        fig.style.height=h+'px';
        fig.replaceChildren(chartAt(p,v,w,h));
        if(fig._pad) fig.appendChild(fig._pad);
      };
      fig._draw();
      requestAnimationFrame(()=>{ if(fig.isConnected){ fig._draw(); paintBoard(s); } });
      if(tool==='move') fig.onclick=()=>{state.zoomViz=v.id;render();};
      box.append(nm,fig); hasFig=true;
    }else{
      const g=el('p','small muted');
      g.textContent='That chart was closed in Identification, so it is no longer here.';
      box.appendChild(g);
    }
  }
  const ta=document.createElement('textarea');
  ta.rows=2;
  ta.placeholder=b.prompt
    ? b.prompt
    : ((b.viz!==null&&b.viz!==undefined)
       ? 'What does this chart show, and why is it in your story?'
       : 'Write this part of the story.');
  ta.value=b.text||'';
  /* the writing box grows with what is written, so nothing is hidden; a card
     with no chart can also be pulled taller */
  ta._fit=()=>{
    const min=hasFig?40:(b.th||40);
    ta.style.height='auto';
    ta.style.height=Math.max(min,ta.scrollHeight+2)+'px';
  };
  ta.oninput=()=>{b.text=ta.value; ta._fit(); paintBoard(s);};
  if(tool!=='move'){ ta.readOnly=true; ta.style.pointerEvents='none'; }
  box.appendChild(ta);
  requestAnimationFrame(()=>{ if(ta.isConnected){ ta._fit(); paintBoard(s); } });

  if(tool==='move'){
    [['sbedge-r','w','Drag to make this card wider or narrower'],
     ['sbedge-b','h','Drag to make this card taller or shorter'],
     ['sbgrip','both','Drag to change the width and height']].forEach(([cls,mode,tip])=>{
      const g=el('div',cls); g.title=tip;
      resizeBlock(g,box,b,s,mode);
      box.appendChild(g);
    });
  }

  if(tool==='connect'){
    const hit=el('div','pickpad');
    hit.onclick=()=>{
      if(!s.pending){ s.pending=b.bid; render(); return; }
      if(s.pending===b.bid){ s.pending=null; render(); return; }
      if(!s.links) s.links=[];
      const dup=s.links.some(l=>l.from===s.pending&&l.to===b.bid);
      if(!dup) s.links.push({from:s.pending,to:b.bid,style:s.linkStyle||'arrow'});
      s.pending=null; render();
    };
    box.appendChild(hit);
  }
  return box;
}

/* draw the connections once the cards have been laid out */
function paintBoard(s){
  const board=document.getElementById('storyboard');
  if(!board)return;
  const svg=board.querySelector('.boardsvg');
  if(!svg)return;
  [...svg.querySelectorAll('.blink,.bpen,.bchip')].forEach(n=>n.remove());
  /* the board is as tall as its window, or as its lowest card plus room to
     keep going, whichever is more */
  {
    const wrap=board.parentNode;
    const base=(wrap&&wrap.classList.contains('boardwrap'))?wrap.clientHeight:560;
    let low=0;
    board.querySelectorAll('.sblock').forEach(n=>{ low=Math.max(low,n.offsetTop+n.offsetHeight); });
    (s.pen||[]).forEach(pt=>pt.forEach(q=>{ low=Math.max(low,q[1]); }));
    const need=Math.max(base,Math.ceil(low+300));
    if(Math.abs(board.offsetHeight-need)>1) board.style.height=need+'px';
  }
  svg.setAttribute('viewBox','0 0 '+board.clientWidth+' '+board.clientHeight);

  /* a card keeps the width it was given, but never wider than the board it
     sits on — a narrow window must not push it out of reach */
  board.querySelectorAll('.sblock').forEach(n=>{
    const bl=(s.blocks||[]).find(x=>x.bid===n.dataset.bid);
    if(!bl||!bl.w) return;
    const w=Math.max(170,Math.min(bl.w,board.clientWidth-(bl.x||0)-4));
    if(n.offsetWidth!==w) n.style.width=w+'px';
  });

  (s.pen||[]).forEach(pt=>{
    if(pt.length<2)return;
    const pl=mk('polyline',{class:'bpen',points:pt.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '),
      fill:'none',stroke:'var(--flag)','stroke-width':2.2,'stroke-linecap':'round','stroke-linejoin':'round'});
    svg.appendChild(pl);
  });

  const rectOf=bid=>{
    const n=board.querySelector('.sblock[data-bid="'+bid+'"]');
    if(!n)return null;
    return {x:n.offsetLeft,y:n.offsetTop,w:n.offsetWidth,h:n.offsetHeight};
  };
  (s.links||[]).forEach((l,li)=>{
    const A=rectOf(l.from), B=rectOf(l.to);
    if(!A||!B)return;
    const ac={x:A.x+A.w/2,y:A.y+A.h/2}, bc={x:B.x+B.w/2,y:B.y+B.h/2};
    const p1=edgePoint(A,ac,bc), p2=edgePoint(B,bc,ac);
    const ln=mk('line',{class:'blink',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,
      stroke:'var(--ink)','stroke-width':1.8});
    if(l.style==='dashed') ln.setAttribute('stroke-dasharray','6 4');
    if(l.style==='arrow'||l.style==='double') ln.setAttribute('marker-end','url(#ah)');
    if(l.style==='double') ln.setAttribute('marker-start','url(#ah)');
    svg.appendChild(ln);
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const chip=mk('g',{class:'bchip'});
    const c=mk('circle',{cx:mx,cy:my,r:9,fill:'var(--panel)',stroke:'var(--rule)'});
    const t=mk('text',{x:mx,y:my+1,'text-anchor':'middle','dominant-baseline':'middle',
      'font-size':11,fill:'var(--muted)'},'\u00d7');
    t.style.pointerEvents='none';
    chip.append(c,t);
    chip.style.cursor='pointer';
    chip.onclick=()=>{ s.links.splice(li,1); render(); };
    const ttl=mk('title',{}); ttl.textContent='Remove this connection';
    chip.appendChild(ttl);
    svg.appendChild(chip);
  });
}
function edgePoint(r,from,to){
  const dx=to.x-from.x, dy=to.y-from.y;
  if(dx===0&&dy===0)return from;
  const hw=r.w/2, hh=r.h/2;
  const sx=dx===0?Infinity:hw/Math.abs(dx);
  const sy=dy===0?Infinity:hh/Math.abs(dy);
  const k=Math.min(sx,sy);
  return {x:from.x+dx*k, y:from.y+dy*k};
}

/* Pull the bottom-right corner: sideways changes the card's width, and the
   chart inside it follows because it is drawn to the width it is given.
   Downwards grows the writing box. The links are redrawn as it moves so the
   arrows stay attached. */
/* mode 'w' changes only the width, 'h' only the height, 'both' either.
   On a chart card the height goes to the chart; on a text card, to the box. */
function resizeBlock(grip,box,b,s,mode){
  mode=mode||'both';
  grip.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation();
    const board=document.getElementById('storyboard');
    const wrap=document.getElementById('boardwrap');
    const fig=box.querySelector('.sbfig');
    const ta=box.querySelector('textarea');
    const w0=box.offsetWidth, fh0=fig?fig.offsetHeight:0, th0=ta?ta.offsetHeight:0;
    if(fig&&!b.fh) b.fh=fh0;   // from now on width and height are independent
    const x0=e.clientX, y0=e.clientY, sy0=wrap?wrap.scrollTop:0;
    const maxW=board?Math.max(170,board.clientWidth-(b.x||0)-4):700;
    let lastX=x0, lastY=y0, queued=false;
    box.classList.add('moving');
    const apply=()=>{
      if(mode!=='h'){
        const w=Math.max(170,Math.min(maxW,w0+(lastX-x0)));
        b.w=w; box.style.width=w+'px';
      }
      if(mode!=='w'){
        const dy=(lastY-y0)+((wrap?wrap.scrollTop:0)-sy0);
        if(fig) b.fh=Math.max(90,Math.round(fh0+dy));
        else if(ta){ b.th=Math.max(36,Math.round(th0+dy)); ta._fit?ta._fit():(ta.style.height=b.th+'px'); }
      }
      if(fig&&fig._draw&&!queued){
        queued=true;
        requestAnimationFrame(()=>{ queued=false; fig._draw(); paintBoard(s); });
      }
      paintBoard(s);
    };
    const stop=mode==='w'?()=>{}:edgeScroll(()=>lastY,apply);
    const move=ev=>{ lastX=ev.clientX; lastY=ev.clientY; apply(); };
    const up=()=>{
      stop();
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      box.classList.remove('moving');
      if(fig&&fig._draw) fig._draw();
      paintBoard(s);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function dragBlock(handle,b,s){
  handle.style.cursor='grab';
  handle.style.touchAction='none';
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('.iconb'))return;
    e.preventDefault();
    const box=handle.parentNode, board=document.getElementById('storyboard');
    if(!board)return;
    const r0=board.getBoundingClientRect();
    const ox=e.clientX-r0.left-box.offsetLeft, oy=e.clientY-r0.top-box.offsetTop;
    let lastX=e.clientX, lastY=e.clientY;
    box.classList.add('moving');
    /* measured from the board's current position, so scrolling mid-drag keeps
       the card under the finger; there is no floor, the board grows instead */
    const place=()=>{
      const r=board.getBoundingClientRect();
      const nx=Math.max(0,Math.min(board.clientWidth-box.offsetWidth,lastX-r.left-ox));
      const ny=Math.max(0,lastY-r.top-oy);
      b.x=nx; b.y=ny;
      box.style.left=nx+'px'; box.style.top=ny+'px';
      paintBoard(s);
    };
    const stop=edgeScroll(()=>lastY,place);
    const move=ev=>{ lastX=ev.clientX; lastY=ev.clientY; place(); };
    const up=()=>{
      stop();
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      box.classList.remove('moving');
      paintBoard(s);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function iconBtn(ch,title,fn){
  const b=document.createElement('button');
  b.type='button'; b.className='iconb'; b.textContent=ch; b.title=title;
  b.onclick=fn; return b;
}

function zoomBox(p,v){
  const back=el('div','zoomback');
  const inner=el('div','zoominner');
  const h=el('div','row'); h.style.justifyContent='space-between';
  const nm=el('div','gname'); nm.textContent=chartName(p,v);
  h.append(nm,iconBtn('\u00d7','Close',()=>{state.zoomViz=null;render();}));
  inner.append(h);
  const fig=el('div'); fig.appendChild(fluidChart(p,v));
  inner.appendChild(fig);
  back.appendChild(inner);
  back.onclick=e=>{ if(e.target===back){state.zoomViz=null;render();} };
  return back;
}

function dragFromStory(node,label,onDrop){
  node.style.touchAction='none';
  node.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const x0=e.clientX,y0=e.clientY;
    const g=el('div','dragimg txt'); g.textContent=label;
    g.style.left=x0+'px'; g.style.top=y0+'px';
    document.body.appendChild(g);
    let lastY=y0;
    const stop=edgeScroll(()=>lastY,null);
    const zoneAt=(x,y)=>{
      const t=document.elementFromPoint(x,y);
      if(!t||!t.closest)return null;
      const slot=t.closest('.sblock');
      if(slot&&slot.dataset.empty==='1') return slot;
      return t.closest('[data-drop="storycanvas"]');
    };
    const move=ev=>{
      lastY=ev.clientY;
      g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
      const z=zoneAt(ev.clientX,ev.clientY);
      document.querySelectorAll('[data-drop="storycanvas"]').forEach(n=>n.classList.toggle('hot',n===z));
      document.querySelectorAll('.sblock').forEach(n=>n.classList.toggle('hot',n===z));
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      g.remove(); stop();
      document.querySelectorAll('[data-drop="storycanvas"]').forEach(n=>n.classList.remove('hot'));
      document.querySelectorAll('.sblock').forEach(n=>n.classList.remove('hot'));
      const moved=Math.abs(ev.clientX-x0)>6||Math.abs(ev.clientY-y0)>6;
      if(!moved){ state.zoomViz=null; }
      const z=moved?zoneAt(ev.clientX,ev.clientY):null;
      if(z){
        let at=null;
        const board=document.getElementById('storyboard');
        if(board&&!z.classList.contains('sblock')){
          const r=board.getBoundingClientRect();
          if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)
            at={x:Math.min(r.width-230,ev.clientX-r.left-20), y:ev.clientY-r.top-14};
        }
        onDrop(z.classList.contains('sblock')?z.dataset.bid:null, at);
      }
      else render();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function storyText(){
  const s=storyState();
  const p=prof(state.dsKey);
  const type=famOf(state.story.fam);
  const out=[];
  out.push(s.title?s.title:'(untitled story)');
  out.push(dsName(state.dsKey)+'  \u00b7  '+type.nm+' ('+type.gloss+')');
  out.push('');
  if(s.blocks.length){
    out.push(''); out.push('THE CARDS');
    const order=s.blocks.map((b,i)=>({b,i})).sort((m,n)=>
      (m.b.y||0)-(n.b.y||0) || (m.b.x||0)-(n.b.x||0));
    const numOf={};
    order.forEach((o,k)=>{numOf[o.b.bid]=k+1;});
    order.forEach((o,k)=>{
      const b=o.b;
      const v=(b.viz!==null&&b.viz!==undefined)?state.vizzes.find(x=>x.id===b.viz):null;
      out.push((k+1)+'. '+(b.slot?b.slot+' \u2014 ':'')+(b.view?('[chart] '+viewName(p,b.view)):v?('[chart] '+chartName(p,v)):'[text]'));
      if(b.text&&b.text.trim()) out.push('   '+b.text.trim());
    });
    if(s.links&&s.links.length){
      out.push(''); out.push('HOW THEY CONNECT');
      const mark={arrow:'\u2192',line:'\u2014',dashed:'--',double:'\u2194'};
      s.links.forEach(l=>{
        const a=numOf[l.from], b2=numOf[l.to];
        if(a&&b2) out.push('   '+a+' '+(mark[l.style]||'\u2192')+' '+b2);
      });
    }
    if(s.pen&&s.pen.length){
      out.push(''); out.push('(the student also drew '+s.pen.length+
        (s.pen.length===1?' mark':' marks')+' on the canvas)');
    }
  }
  return out.join('\n');
}

/* ============================================================
   THE STORY AS A DOCUMENT
   The canvas is a working surface: cards sit where they were dragged,
   arrows cross, nothing is in reading order. A story that leaves the tool
   has to be a document instead, so one builder lays the canvas out in
   reading order and two things use it — a file the student saves, and
   what the printer gets. The charts are written in as SVG, because a data
   story without its charts is not the story.
   ============================================================ */
function storyOrder(s){
  return s.blocks.map((b,i)=>({b,i}))
    .sort((m,n)=>(m.b.y||0)-(n.b.y||0) || (m.b.x||0)-(n.b.x||0))
    .map(o=>o.b);
}
function storyDoc(p){
  const s=storyState();
  const type=famOf(state.story.fam);
  const doc=el('div','storydoc');

  const h=document.createElement('h1');
  h.textContent=s.title&&s.title.trim()?s.title.trim():'Untitled story';
  doc.appendChild(h);

  const meta=el('p','sd-meta');
  meta.textContent=dsName(state.dsKey)+' \u00b7 '+type.nm+' ('+type.gloss+')';
  doc.appendChild(meta);

  const order=storyOrder(s);
  const numOf={}; order.forEach((b,i)=>numOf[b.bid]=i+1);
  order.forEach((b,i)=>{
    const card=el('div','sd-card');
    const hd=el('div','sd-chead');
    const n=el('span','sd-num'); n.textContent=(i+1);
    hd.appendChild(n);
    if(b.slot){ const sl=el('span','sd-slot'); sl.textContent=b.slot; hd.appendChild(sl); }
    card.appendChild(hd);
    const v=(b.viz!==null&&b.viz!==undefined)?state.vizzes.find(x=>x.id===b.viz):null;
    if(b.view){
      const cn=el('div','sd-cname'); cn.textContent=viewName(p,b.view);
      card.appendChild(cn);
      const fig=el('div','sd-fig');
      CHART_BOX={w:420,h:Math.round(420*viewAspect(b.view))};
      let svg; try{ svg=viewSvg(p,b.view); } finally{ CHART_BOX=null; }
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.setAttribute('preserveAspectRatio','xMidYMid meet');
      svg.style.width='100%'; svg.style.height='auto'; svg.style.display='block';
      fig.appendChild(svg);
      card.appendChild(fig);
    }else if(v){
      const cn=el('div','sd-cname'); cn.textContent=chartName(p,v);
      card.appendChild(cn);
      const fig=el('div','sd-fig');
      const svg=chartSvg(p,Object.assign({},v,{zoom:1}));
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.setAttribute('preserveAspectRatio','xMidYMid meet');
      svg.style.width='100%'; svg.style.height='auto'; svg.style.display='block';
      fig.appendChild(svg);
      card.appendChild(fig);
    }else if(b.viz!==null&&b.viz!==undefined){
      const g=el('p','sd-missing');
      g.textContent='A chart was here, but it was closed before the story was saved.';
      card.appendChild(g);
    }
    if(b.text&&b.text.trim()){
      const t=el('p','sd-text'); t.textContent=b.text.trim();
      card.appendChild(t);
    }
    doc.appendChild(card);
  });

  if(s.links&&s.links.length){
    const mark={arrow:'\u2192',line:'\u2014',dashed:'--',double:'\u2194'};
    const w=el('div','sd-links');
    const t=el('div','sd-plabel'); t.textContent='How the parts connect';
    w.appendChild(t);
    const ul=document.createElement('ul');
    s.links.forEach(l=>{
      const a=numOf[l.from], b2=numOf[l.to];
      if(!a||!b2)return;
      const li=document.createElement('li');
      li.textContent=a+' '+(mark[l.style]||'\u2192')+' '+b2;
      ul.appendChild(li);
    });
    if(ul.children.length){ w.appendChild(ul); doc.appendChild(w); }
  }

  const f=el('p','sd-foot');
  f.textContent='Made with DRS \u00b7 '+new Date().toLocaleDateString();
  doc.appendChild(f);
  return doc;
}

/* ---- B: a file the student keeps ---- */
function storyFileHTML(p){
  const doc=storyDoc(p);
  const title=(storyState().title||'').trim()||'Data story';
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
    '<title>'+esc(title)+'</title>\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">\n'+
    '<style>\nbody{margin:0;padding:2.2rem 1.2rem 3rem;background:#f2f4f5}\n'+
    STORY_DOC_CSS+'\n@media print{body{background:#fff;padding:0}}\n</style>\n'+
    '</head>\n<body>\n'+doc.outerHTML+'\n</body>\n</html>';
}
function safeName(t){
  const n=String(t||'').trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').slice(0,60);
  return (n||'data-story')+'.html';
}
async function saveStoryFile(){
  const p=prof(state.dsKey);
  const html=storyFileHTML(p);
  const name=safeName(storyState().title);
  /* inside claude.ai a script cannot hand over a file, so ask the host;
     anywhere else (a static server, a local copy) a Blob does it */
  if(CAP.downloads){
    try{ await CAP.downloads.save({filename:name,data:html}); return; }
    catch(e){ toast('Save was cancelled'); return; }
  }
  try{
    const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    const a=document.createElement('a');
    a.href=url; a.download=name;

/* ---------- Draft with AI ----------
   The AI writes a first version of the teacher's answer from the question
   and the data. It lands in the answer box marked as a draft; students never
   see it, in any mode, until the teacher has read it and marked it checked. */
const GOLDGEN=new WeakMap();
function goldGen(qq){ let g=GOLDGEN.get(qq); if(!g){ g={loading:false,undo:null,id:''}; GOLDGEN.set(qq,g); } return g; }
function goldTools(qb,draft,stageKey,i,qq,p){
  const gg=goldGen(qq);
  if(qq.goldDraft&&!gg.loading){
    const nt=el('div','draftnote');
    const t=el('div'); t.textContent='AI draft. Check it against the data and fix anything that is off. Students will not see it until you mark it checked.';
    nt.appendChild(t);

    const ok=btn('Mark as checked',()=>{ delete qq.goldDraft; gg.undo=null; render(); toast('Answer checked'); });
    ok.classList.add('mini');
    r.appendChild(ok);
    if(gg.undo!==null){
      const u=btn(gg.undo?'Undo, bring back my answer':'Undo, clear the draft',()=>{ qq.gold=gg.undo; delete qq.goldDraft; gg.undo=null; render(); },'ghost');
      u.classList.add('mini'); r.appendChild(u);
    }
    nt.appendChild(r); qb.appendChild(nt);
  }
  const bar=el('div','goldbar');
  const d=btn(gg.loading?'Drafting\u2026':((qq.gold||'').trim()?'Redraft with AI':'Draft with AI'),()=>draftGold(draft,stageKey,i,qq,p),'ghost');
  d.classList.add('mini'); d.disabled=gg.loading;
  d.title='The AI writes a first version of your answer from the question and the data. You check it before students can see it.';
  bar.appendChild(d);
  if(!gg.loading&&!qq.goldDraft&&!(qq.gold||'').trim()&&!(qq.q||'').trim()){
    const h=el('span','tiny muted'); h.textContent='Write the question first.'; bar.appendChild(h);
  }
  qb.appendChild(bar);
}
const STAGE_FOR_DRAFT={
  extraction:'the Extraction page, where students work out what the scientists chose to measure and how what happened in the world was turned into the variables and values in this table',
  identification:'the Identification page, where students use charts to find trends, patterns and anomalies in the data',
  interpretation:'the Interpretation page, where students explain what the trends, patterns and anomalies mean and why they happen, drawing on science knowledge and background facts beyond the chart',
  story_method:'the Methodology story page, where students build a data story whose single point is about how the analysis was done',
  story_findings:'the Findings story page, where students build a data story whose single point is one key finding'
};
function draftCSV(p){
  const cell=v=>{ if(isBlank(v)) return ''; const t=String(v); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  let out=p.cols.map(cell).join(',');
  for(const r of p.rows){ const line='\n'+r.map(cell).join(','); if(out.length+line.length>60000){ out+='\n(remaining rows left out for length)'; break; } out+=line; }
  return out;
}
async function draftGold(draft,stageKey,i,qq,p){
  const q=(qq.q||'').trim();
  if(!q){ warn('Write the question first, then the AI can draft an answer to it'); return; }
  const gg=goldGen(qq); if(gg.loading) return;
  if(!CAP.sample&&window.claude&&claude.use){
    try{ CAP.sample=await claude.use('sample'); }catch(e){}
    if(!CAP.sample) await checkAIStatus(); else AIStatus.state='on';
  }
  if(!CAP.sample){ warn('Drafting with AI is not available in this view. '+(AIStatus.why||'Live Claude replies are not available here.')); return; }
  const prev=qq.goldDraft?(gg.undo!==null?gg.undo:''):(qq.gold||'');
  const bg=(draft.brief&&draft.brief.body||'').slice(0,1500);
  const others=qlistDraft(draft,stageKey).map((x,j)=>j!==i&&(x.q||'').trim()?'- '+x.q.trim():'').filter(Boolean).join('\n');
  const instr=`You are helping a high school science teacher write the model answer to one question in a data-reasoning task for students aged about 15. The teacher will read your draft, correct it, and decide whether to keep it.

Write the answer the teacher would accept in full, as a strong student could write it:
- Ground it in the actual data below. Name the years, values or columns that show it. Never invent a value.
- If the data cannot fully settle the question, say what it does show and what it leaves open.
- Two to five short sentences, everyday words, no heading, no list, no quotation marks around it.
- Give only the answer text.

The question is on ${STAGE_FOR_DRAFT[stageKey]||'one of the task pages'}.
The question: ${q}
${others?'Other questions on the same page (do not answer these):\n'+others+'\n':''}
Dataset: ${dsName(state.dsKey)}.
Background the teacher wrote: ${bg||'(none yet)'}

The data, as CSV (an empty cell means nothing was recorded, which is not the same as zero):
${draftCSV(p)}`;
  gg.loading=true; gg.undo=prev; render();
  let text='', why='';
  try{
    const out=await CAP.sample(instr,{modelTier:'default',onText:({text:t})=>{ qq.gold=t; const box=document.getElementById(gg.id); if(box) box.value=t; }});
    text=((out&&out.text)||'').trim();
  }catch(e){
    text=((e&&e.text)||'').trim();
    const c=e&&e.code;
    why=(c==='not_granted')?'Permission for this page to use Claude was not given.'
      :(c==='rate_limited')?'The Claude usage limit was reached. Wait a moment, then try again.'
      :(c==='session_expired')?'Your Claude sign-in has expired.':'The AI could not draft an answer just now.';
  }
  gg.loading=false;
  if(text){ qq.gold=text; qq.goldDraft=true; }
  else{ qq.gold=prev; gg.undo=null; warn(why||'The AI could not draft an answer just now. Try again.'); }
  render();
}
/* in "Your answer" mode: how many questions on the thinking-partner pages lack a checked answer */
function partnerMissing(draft){
  let total=0,n=0;
  ['extraction','identification','interpretation'].forEach(k=>{
    const it=draft.items&&draft.items[k];
    if(!Array.isArray(it)) return;
    it.forEach(x=>{ if(!(x.q||'').trim()) return; total++; if(!(x.gold||'').trim()||x.goldDraft) n++; });
  });
  return {total,n};
}
