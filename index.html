  if(state.zoomViz!==null&&state.zoomViz!==undefined){
    const v=state.vizzes.find(x=>x.id===state.zoomViz);
    if(v) main.appendChild(zoomBox(p,v));
  }

  itemCol(item,'storytelling',
    'Tell this story to someone who has never seen the data. Say what you found, what you think it means, what you are still unsure about, and why they should care.');
}

function newBlock(s,vizId,at){
  const n=s.blocks.length;
  if(at) return {bid:'b'+(state.storySeq++),viz:vizId,text:'',
                 x:Math.max(0,Math.round(at.x)), y:Math.max(0,Math.round(at.y))};
  /* below everything already there, so nothing is covered */
  let low=0;
  s.blocks.forEach(b=>{
    const node=document.querySelector('.sblock[data-bid="'+b.bid+'"]');
    low=Math.max(low,(b.y||0)+(node?node.offsetHeight:220));
  });
  return {bid:'b'+(state.storySeq++),viz:vizId,text:'',
          x:24, y:n?low+26:24};
}
/* lay cards out in rows across the board, each row as tall as its tallest card */
function layoutBlocks(s){
  const board=document.getElementById('storyboard');
  const bw=board?board.clientWidth:780;
  let x=24,y=24,rowH=0;
  s.blocks.forEach(b=>{
    const node=board&&board.querySelector('.sblock[data-bid="'+b.bid+'"]');
    const w=node?node.offsetWidth:(b.w||225), h=node?node.offsetHeight:220;
    if(x>24&&x+w>bw-12){ x=24; y+=rowH+26; rowH=0; }
    b.x=x; b.y=y; x+=w+26; rowH=Math.max(rowH,h);
  });
}

function storyBlock(p,s,b,i){
  const tool=s.tool||'move';
  const emptySlot = b.slot && (b.viz===null||b.viz===undefined) && !(b.text||'').trim();
  const box=el('div','sblock'+(s.pending===b.bid?' pending':'')+(b.slot?' slotted':'')+(emptySlot?' empty':''));
  box.setAttribute('data-bid',b.bid);
  box.setAttribute('data-empty',(b.viz===null||b.viz===undefined)?'1':'0');
  box.style.left=(b.x||20)+'px'; box.style.top=(b.y||20)+'px';
  if(b.w) box.style.width=b.w+'px';

  const head=el('div','sbhead');
  const num=el('span','qnum'); num.textContent=(i+1);
  const ctl=el('div','row');
  ctl.appendChild(iconBtn('\u00d7','Remove from the story',()=>{
    s.blocks.splice(i,1);
    s.links=(s.links||[]).filter(l=>l.from!==b.bid&&l.to!==b.bid);
    render();
  }));
  head.append(num,ctl);
  if(tool==='move') dragBlock(head,b,s);
  box.appendChild(head);
  if(b.slot){
    const sl=el('div','slotname'); sl.textContent=b.slot;
    box.appendChild(sl);
  }

  let hasFig=false;
  if(b.viz!==null&&b.viz!==undefined){
    const v=state.vizzes.find(x=>x.id===b.viz);
    if(v){
      const nm=el('div','gname'); nm.textContent=chartName(p,v);
      const fig=el('div','sbfig');
      const asp=chartAspect(p,v);
      if(tool==='chart') fig._pad=annoPad(fig,p,v);
      fig._draw=()=>{
        const w=fig.clientWidth||Math.max(150,(b.w||225)-18);
        const h=b.fh||Math.round(w*asp);
        fig.style.height=h+'px';
        fig.replaceChildren(chartAt(p,v,w,h));
        if(fig._pad) fig.appendChild(fig._pad);
      };
      fig._draw();
      requestAnimationFrame(()=>{ if(fig.isConnected){ fig._draw(); paintBoard(s); } });
      if(tool==='move') fig.onclick=()=>{state.zoomViz=v.id;render();};
      box.append(nm,fig); hasFig=true;
    }else{
      const g=el('p','small muted');
      g.textContent='That chart was closed in Identification, so it is no longer here.';
      box.appendChild(g);
    }
  }
  const ta=document.createElement('textarea');
  ta.rows=2;
  ta.placeholder=b.prompt
    ? b.prompt
    : ((b.viz!==null&&b.viz!==undefined)
       ? 'What does this chart show, and why is it in your story?'
       : 'Write this part of the story.');
  ta.value=b.text||'';
  /* the writing box grows with what is written, so nothing is hidden; a card
     with no chart can also be pulled taller */
  ta._fit=()=>{
    const min=hasFig?40:(b.th||40);
    ta.style.height='auto';
    ta.style.height=Math.max(min,ta.scrollHeight+2)+'px';
  };
  ta.oninput=()=>{b.text=ta.value; ta._fit(); paintBoard(s);};
  if(tool!=='move'){ ta.readOnly=true; ta.style.pointerEvents='none'; }
  box.appendChild(ta);
  requestAnimationFrame(()=>{ if(ta.isConnected){ ta._fit(); paintBoard(s); } });

  if(tool==='move'){
    [['sbedge-r','w','Drag to make this card wider or narrower'],
     ['sbedge-b','h','Drag to make this card taller or shorter'],
     ['sbgrip','both','Drag to change the width and height']].forEach(([cls,mode,tip])=>{
      const g=el('div',cls); g.title=tip;
      resizeBlock(g,box,b,s,mode);
      box.appendChild(g);
    });
  }

  if(tool==='connect'){
    const hit=el('div','pickpad');
    hit.onclick=()=>{
      if(!s.pending){ s.pending=b.bid; render(); return; }
      if(s.pending===b.bid){ s.pending=null; render(); return; }
      if(!s.links) s.links=[];
      const dup=s.links.some(l=>l.from===s.pending&&l.to===b.bid);
      if(!dup) s.links.push({from:s.pending,to:b.bid,style:s.linkStyle||'arrow'});
      s.pending=null; render();
    };
    box.appendChild(hit);
  }
  return box;
}

/* draw the connections once the cards have been laid out */
function paintBoard(s){
  const board=document.getElementById('storyboard');
  if(!board)return;
  const svg=board.querySelector('.boardsvg');
  if(!svg)return;
  [...svg.querySelectorAll('.blink,.bpen,.bchip')].forEach(n=>n.remove());
  /* the board is as tall as its window, or as its lowest card plus room to
     keep going, whichever is more */
  {
    const wrap=board.parentNode;
    const base=(wrap&&wrap.classList.contains('boardwrap'))?wrap.clientHeight:560;
    let low=0;
    board.querySelectorAll('.sblock').forEach(n=>{ low=Math.max(low,n.offsetTop+n.offsetHeight); });
    (s.pen||[]).forEach(pt=>pt.forEach(q=>{ low=Math.max(low,q[1]); }));
    const need=Math.max(base,Math.ceil(low+300));
    if(Math.abs(board.offsetHeight-need)>1) board.style.height=need+'px';
  }
  svg.setAttribute('viewBox','0 0 '+board.clientWidth+' '+board.clientHeight);

  /* a card keeps the width it was given, but never wider than the board it
     sits on — a narrow window must not push it out of reach */
  board.querySelectorAll('.sblock').forEach(n=>{
    const bl=(s.blocks||[]).find(x=>x.bid===n.dataset.bid);
    if(!bl||!bl.w) return;
    const w=Math.max(170,Math.min(bl.w,board.clientWidth-(bl.x||0)-4));
    if(n.offsetWidth!==w) n.style.width=w+'px';
  });

  (s.pen||[]).forEach(pt=>{
    if(pt.length<2)return;
    const pl=mk('polyline',{class:'bpen',points:pt.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '),
      fill:'none',stroke:'var(--flag)','stroke-width':2.2,'stroke-linecap':'round','stroke-linejoin':'round'});
    svg.appendChild(pl);
  });

  const rectOf=bid=>{
    const n=board.querySelector('.sblock[data-bid="'+bid+'"]');
    if(!n)return null;
    return {x:n.offsetLeft,y:n.offsetTop,w:n.offsetWidth,h:n.offsetHeight};
  };
  (s.links||[]).forEach((l,li)=>{
    const A=rectOf(l.from), B=rectOf(l.to);
    if(!A||!B)return;
    const ac={x:A.x+A.w/2,y:A.y+A.h/2}, bc={x:B.x+B.w/2,y:B.y+B.h/2};
    const p1=edgePoint(A,ac,bc), p2=edgePoint(B,bc,ac);
    const ln=mk('line',{class:'blink',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,
      stroke:'var(--ink)','stroke-width':1.8});
    if(l.style==='dashed') ln.setAttribute('stroke-dasharray','6 4');
    if(l.style==='arrow'||l.style==='double') ln.setAttribute('marker-end','url(#ah)');
    if(l.style==='double') ln.setAttribute('marker-start','url(#ah)');
    svg.appendChild(ln);
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const chip=mk('g',{class:'bchip'});
    const c=mk('circle',{cx:mx,cy:my,r:9,fill:'var(--panel)',stroke:'var(--rule)'});
    const t=mk('text',{x:mx,y:my+1,'text-anchor':'middle','dominant-baseline':'middle',
      'font-size':11,fill:'var(--muted)'},'\u00d7');
    t.style.pointerEvents='none';
    chip.append(c,t);
    chip.style.cursor='pointer';
    chip.onclick=()=>{ s.links.splice(li,1); render(); };
    const ttl=mk('title',{}); ttl.textContent='Remove this connection';
    chip.appendChild(ttl);
    svg.appendChild(chip);
  });
}
function edgePoint(r,from,to){
  const dx=to.x-from.x, dy=to.y-from.y;
  if(dx===0&&dy===0)return from;
  const hw=r.w/2, hh=r.h/2;
  const sx=dx===0?Infinity:hw/Math.abs(dx);
  const sy=dy===0?Infinity:hh/Math.abs(dy);
  const k=Math.min(sx,sy);
  return {x:from.x+dx*k, y:from.y+dy*k};
}

/* Pull the bottom-right corner: sideways changes the card's width, and the
   chart inside it follows because it is drawn to the width it is given.
   Downwards grows the writing box. The links are redrawn as it moves so the
   arrows stay attached. */
/* mode 'w' changes only the width, 'h' only the height, 'both' either.
   On a chart card the height goes to the chart; on a text card, to the box. */
function resizeBlock(grip,box,b,s,mode){
  mode=mode||'both';
  grip.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation();
    const board=document.getElementById('storyboard');
    const wrap=document.getElementById('boardwrap');
    const fig=box.querySelector('.sbfig');
    const ta=box.querySelector('textarea');
    const w0=box.offsetWidth, fh0=fig?fig.offsetHeight:0, th0=ta?ta.offsetHeight:0;
    if(fig&&!b.fh) b.fh=fh0;   // from now on width and height are independent
    const x0=e.clientX, y0=e.clientY, sy0=wrap?wrap.scrollTop:0;
    const maxW=board?Math.max(170,board.clientWidth-(b.x||0)-4):700;
    let lastX=x0, lastY=y0, queued=false;
    box.classList.add('moving');
    const apply=()=>{
      if(mode!=='h'){
        const w=Math.max(170,Math.min(maxW,w0+(lastX-x0)));
        b.w=w; box.style.width=w+'px';
      }
      if(mode!=='w'){
        const dy=(lastY-y0)+((wrap?wrap.scrollTop:0)-sy0);
        if(fig) b.fh=Math.max(90,Math.round(fh0+dy));
        else if(ta){ b.th=Math.max(36,Math.round(th0+dy)); ta._fit?ta._fit():(ta.style.height=b.th+'px'); }
      }
      if(fig&&fig._draw&&!queued){
        queued=true;
        requestAnimationFrame(()=>{ queued=false; fig._draw(); paintBoard(s); });
      }
      paintBoard(s);
    };
    const stop=mode==='w'?()=>{}:edgeScroll(()=>lastY,apply);
    const move=ev=>{ lastX=ev.clientX; lastY=ev.clientY; apply(); };
    const up=()=>{
      stop();
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      box.classList.remove('moving');
      if(fig&&fig._draw) fig._draw();
      paintBoard(s);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function dragBlock(handle,b,s){
  handle.style.cursor='grab';
  handle.style.touchAction='none';
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('.iconb'))return;
    e.preventDefault();
    const box=handle.parentNode, board=document.getElementById('storyboard');
    if(!board)return;
    const r0=board.getBoundingClientRect();
    const ox=e.clientX-r0.left-box.offsetLeft, oy=e.clientY-r0.top-box.offsetTop;
    let lastX=e.clientX, lastY=e.clientY;
    box.classList.add('moving');
    /* measured from the board's current position, so scrolling mid-drag keeps
       the card under the finger; there is no floor, the board grows instead */
    const place=()=>{
      const r=board.getBoundingClientRect();
      const nx=Math.max(0,Math.min(board.clientWidth-box.offsetWidth,lastX-r.left-ox));
      const ny=Math.max(0,lastY-r.top-oy);
      b.x=nx; b.y=ny;
      box.style.left=nx+'px'; box.style.top=ny+'px';
      paintBoard(s);
    };
    const stop=edgeScroll(()=>lastY,place);
    const move=ev=>{ lastX=ev.clientX; lastY=ev.clientY; place(); };
    const up=()=>{
      stop();
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      box.classList.remove('moving');
      paintBoard(s);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function iconBtn(ch,title,fn){
  const b=document.createElement('button');
  b.type='button'; b.className='iconb'; b.textContent=ch; b.title=title;
  b.onclick=fn; return b;
}

function zoomBox(p,v){
  const back=el('div','zoomback');
  const inner=el('div','zoominner');
  const h=el('div','row'); h.style.justifyContent='space-between';
  const nm=el('div','gname'); nm.textContent=chartName(p,v);
  h.append(nm,iconBtn('\u00d7','Close',()=>{state.zoomViz=null;render();}));
  inner.append(h);
  const fig=el('div'); fig.appendChild(fluidChart(p,v));
  inner.appendChild(fig);
  back.appendChild(inner);
  back.onclick=e=>{ if(e.target===back){state.zoomViz=null;render();} };
  return back;
}

function dragFromStory(node,label,onDrop){
  node.style.touchAction='none';
  node.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const x0=e.clientX,y0=e.clientY;
    const g=el('div','dragimg txt'); g.textContent=label;
    g.style.left=x0+'px'; g.style.top=y0+'px';
    document.body.appendChild(g);
    let lastY=y0;
    const stop=edgeScroll(()=>lastY,null);
    const zoneAt=(x,y)=>{
      const t=document.elementFromPoint(x,y);
      if(!t||!t.closest)return null;
      const slot=t.closest('.sblock');
      if(slot&&slot.dataset.empty==='1') return slot;
      return t.closest('[data-drop="storycanvas"]');
    };
    const move=ev=>{
      lastY=ev.clientY;
      g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
      const z=zoneAt(ev.clientX,ev.clientY);
      document.querySelectorAll('[data-drop="storycanvas"]').forEach(n=>n.classList.toggle('hot',n===z));
      document.querySelectorAll('.sblock').forEach(n=>n.classList.toggle('hot',n===z));
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      g.remove(); stop();
      document.querySelectorAll('[data-drop="storycanvas"]').forEach(n=>n.classList.remove('hot'));
      document.querySelectorAll('.sblock').forEach(n=>n.classList.remove('hot'));
      const moved=Math.abs(ev.clientX-x0)>6||Math.abs(ev.clientY-y0)>6;
      if(!moved){ state.zoomViz=null; }
      const z=moved?zoneAt(ev.clientX,ev.clientY):null;
      if(z){
        let at=null;
        const board=document.getElementById('storyboard');
        if(board&&!z.classList.contains('sblock')){
          const r=board.getBoundingClientRect();
          if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)
            at={x:Math.min(r.width-230,ev.clientX-r.left-20), y:ev.clientY-r.top-14};
        }
        onDrop(z.classList.contains('sblock')?z.dataset.bid:null, at);
      }
      else render();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function storyText(){
  const s=storyState();
  const p=prof(state.dsKey);
  const type=famOf(state.story.fam);
  const tpl=tplOf(s.tpl);
  const out=[];
  out.push(s.title?s.title:'(untitled story)');
  out.push(dsName(state.dsKey)+'  \u00b7  '+type.nm+' ('+type.gloss+')'+(tpl?('  \u00b7  '+tpl.nm):''));
  out.push('');
  out.push('Big idea: '+(s.big&&s.big.trim()?s.big.trim():'(not written)'));
  out.push('');
  STORY_PARTS.forEach(([k,label])=>{
    if(s.parts[k]&&s.parts[k].trim()) out.push(label+': '+s.parts[k].trim());
  });
  if(s.blocks.length){
    out.push(''); out.push('THE CARDS');
    const order=s.blocks.map((b,i)=>({b,i})).sort((m,n)=>
      (m.b.y||0)-(n.b.y||0) || (m.b.x||0)-(n.b.x||0));
    const numOf={};
    order.forEach((o,k)=>{numOf[o.b.bid]=k+1;});
    order.forEach((o,k)=>{
      const b=o.b;
      const v=(b.viz!==null&&b.viz!==undefined)?state.vizzes.find(x=>x.id===b.viz):null;
      out.push((k+1)+'. '+(b.slot?b.slot+' \u2014 ':'')+(v?('[chart] '+chartName(p,v)):'[text]'));
      if(b.text&&b.text.trim()) out.push('   '+b.text.trim());
    });
    if(s.links&&s.links.length){
      out.push(''); out.push('HOW THEY CONNECT');
      const mark={arrow:'\u2192',line:'\u2014',dashed:'--',double:'\u2194'};
      s.links.forEach(l=>{
        const a=numOf[l.from], b2=numOf[l.to];
        if(a&&b2) out.push('   '+a+' '+(mark[l.style]||'\u2192')+' '+b2);
      });
    }
    if(s.pen&&s.pen.length){
      out.push(''); out.push('(the student also drew '+s.pen.length+
        (s.pen.length===1?' mark':' marks')+' on the canvas)');
    }
  }
  return out.join('\n');
}

/* ============================================================
   THE STORY AS A DOCUMENT
   The canvas is a working surface: cards sit where they were dragged,
   arrows cross, nothing is in reading order. A story that leaves the tool
   has to be a document instead, so one builder lays the canvas out in
   reading order and two things use it — a file the student saves, and
   what the printer gets. The charts are written in as SVG, because a data
   story without its charts is not the story.
   ============================================================ */
function storyOrder(s){
  return s.blocks.map((b,i)=>({b,i}))
    .sort((m,n)=>(m.b.y||0)-(n.b.y||0) || (m.b.x||0)-(n.b.x||0))
    .map(o=>o.b);
}
function storyDoc(p){
  const s=storyState();
  const type=famOf(state.story.fam);
  const tpl=tplOf(s.tpl);
  const doc=el('div','storydoc');

  const h=document.createElement('h1');
  h.textContent=s.title&&s.title.trim()?s.title.trim():'Untitled story';
  doc.appendChild(h);

  const meta=el('p','sd-meta');
  meta.textContent=dsName(state.dsKey)+' \u00b7 '+type.nm+' ('+type.gloss+')'+(tpl?(' \u00b7 '+tpl.nm):'');
  doc.appendChild(meta);

  if(s.big&&s.big.trim()){
    const b=el('div','sd-big');
    b.textContent=s.big.trim();
    doc.appendChild(b);
  }

  const filled=STORY_PARTS.filter(([k])=>s.parts[k]&&s.parts[k].trim());
  if(filled.length){
    const dl=el('div','sd-parts');
    filled.forEach(([k,label])=>{
      const r=el('div','sd-part');
      const t=el('div','sd-plabel'); t.textContent=label;
      const v=el('div','sd-pvalue'); v.textContent=s.parts[k].trim();
      r.append(t,v); dl.appendChild(r);
    });
    doc.appendChild(dl);
  }

  const order=storyOrder(s);
  const numOf={}; order.forEach((b,i)=>numOf[b.bid]=i+1);
  order.forEach((b,i)=>{
    const card=el('div','sd-card');
    const hd=el('div','sd-chead');
    const n=el('span','sd-num'); n.textContent=(i+1);
    hd.appendChild(n);
    if(b.slot){ const sl=el('span','sd-slot'); sl.textContent=b.slot; hd.appendChild(sl); }
    card.appendChild(hd);
    const v=(b.viz!==null&&b.viz!==undefined)?state.vizzes.find(x=>x.id===b.viz):null;
    if(v){
      const cn=el('div','sd-cname'); cn.textContent=chartName(p,v);
      card.appendChild(cn);
      const fig=el('div','sd-fig');
      const svg=chartSvg(p,Object.assign({},v,{zoom:1}));
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.setAttribute('preserveAspectRatio','xMidYMid meet');
      svg.style.width='100%'; svg.style.height='auto'; svg.style.display='block';
      fig.appendChild(svg);
      card.appendChild(fig);
    }else if(b.viz!==null&&b.viz!==undefined){
      const g=el('p','sd-missing');
      g.textContent='A chart was here, but it was closed before the story was saved.';
      card.appendChild(g);
    }
    if(b.text&&b.text.trim()){
      const t=el('p','sd-text'); t.textContent=b.text.trim();
      card.appendChild(t);
    }
    doc.appendChild(card);
  });

  if(s.links&&s.links.length){
    const mark={arrow:'\u2192',line:'\u2014',dashed:'--',double:'\u2194'};
    const w=el('div','sd-links');
    const t=el('div','sd-plabel'); t.textContent='How the parts connect';
    w.appendChild(t);
    const ul=document.createElement('ul');
    s.links.forEach(l=>{
      const a=numOf[l.from], b2=numOf[l.to];
      if(!a||!b2)return;
      const li=document.createElement('li');
      li.textContent=a+' '+(mark[l.style]||'\u2192')+' '+b2;
      ul.appendChild(li);
    });
    if(ul.children.length){ w.appendChild(ul); doc.appendChild(w); }
  }

  const f=el('p','sd-foot');
  f.textContent='Made with DRS \u00b7 '+new Date().toLocaleDateString();
  doc.appendChild(f);
  return doc;
}

/* the styles the document carries with it, used by the file and the printer */
const STORY_DOC_CSS = `

/* ---- B: a file the student keeps ---- */
function storyFileHTML(p){
  const doc=storyDoc(p);
  const title=(storyState().title||'').trim()||'Data story';
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
    '<title>'+esc(title)+'</title>\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">\n'+
    '<style>\nbody{margin:0;padding:2.2rem 1.2rem 3rem;background:#f2f4f5}\n'+
    STORY_DOC_CSS+'\n@media print{body{background:#fff;padding:0}}\n</style>\n'+
    '</head>\n<body>\n'+doc.outerHTML+'\n</body>\n</html>';
}
function safeName(t){
  const n=String(t||'').trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').slice(0,60);
  return (n||'data-story')+'.html';
}
async function saveStoryFile(){
  const p=prof(state.dsKey);
  const html=storyFileHTML(p);
  const name=safeName(storyState().title);
  /* inside claude.ai a script cannot hand over a file, so ask the host;
     anywhere else (a static server, a local copy) a Blob does it */
  if(CAP.downloads){
    try{ await CAP.downloads.save({filename:name,data:html}); return; }
    catch(e){ toast('Save was cancelled'); return; }
  }
  try{
    const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ toast('Could not save the file'); }
}

/* ---- C: the printer gets the same document ---- */
function printStory(){
  const p=prof(state.dsKey);
  let host=document.getElementById('printdoc');
  if(!host){ host=el('div'); host.id='printdoc'; document.body.appendChild(host); }
  host.textContent='';
  host.appendChild(storyDoc(p));
  const done=()=>{ host.textContent=''; window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  window.print();
}

function sect(host,key,title,build,defOpen){
  if(state.openSec[key]===undefined) state.openSec[key]=!!defOpen;
  const open=state.openSec[key];
  const box=el('div','sect'+(open?' open':''));
  const head=document.createElement('button');
  head.type='button'; head.className='secthead';
  head.setAttribute('aria-expanded',String(open));
  const car=el('span','caret'); car.textContent=open?'\u25be':'\u25b8';
  const nm=el('span','secttitle'); nm.textContent=title;
  head.append(car,nm);
  head.onclick=()=>{state.openSec[key]=!open;render();};
  box.appendChild(head);
  if(open){
    const body=el('div','sectbody');
    build(body);
    box.appendChild(body);
  }
  host.appendChild(box);
  return box;
}

/* One group open at a time, with the parts inside as plain headings rather
   than more accordions: two levels of clicking to reach a field was worse. */
function group(host,key,title,build){
  const open=state.openGroup===key;

/* ---------- the prompt panel ----------
   Every box is empty by default and shows DRS's own wording as a placeholder,
   so an untouched task behaves exactly as it did before anyone opened this. */
function tPrompt(draft,body){
  if(!draft.prompts) draft.prompts={};

  const n=el('p','tiny muted'); n.style.margin='0 0 .5rem';
  n.textContent='This is the instruction DRS is given each time a student presses \u201cShow three replies\u201d on the Interpretation page. '+
    'The student never sees it. Rewrite any part in your own words; leave a box empty to keep DRS\u2019s wording.';
  body.appendChild(n);

  const edited=PROMPT_PARTS.filter(([k])=>(draft.prompts[k]||'').trim()).length;
  const bar=el('div','row guidebar');
  const cnt=el('span','tiny muted');
  cnt.textContent=edited?edited+' of '+PROMPT_PARTS.length+' parts rewritten':'All parts are DRS\u2019s own wording';
  const ra=btn('Reset all',()=>{draft.prompts={};render();},'ghost');
  ra.classList.add('mini'); ra.disabled=!edited;
  bar.append(cnt,ra); body.appendChild(bar);

  PROMPT_PARTS.forEach(([key,label,def])=>{
    const mine=(draft.prompts[key]||'').trim();
    const r=el('div','qedit'+(mine?'':' plain'));
    const hd=el('div','qhead');
    const t=el('span','qnum'); t.textContent=label;
    hd.appendChild(t);
    if(mine){
      const rb=document.createElement('button'); rb.className='iconb'; rb.textContent='reset';
      rb.title='Go back to DRS\u2019s wording';
      rb.onclick=()=>{delete draft.prompts[key];render();};
      hd.appendChild(rb);
    }
    r.appendChild(hd);
    const ta=document.createElement('textarea');
    ta.rows=key==='toss'?4:3;
    ta.placeholder=def;
    ta.value=draft.prompts[key]||'';
    ta.oninput=()=>{draft.prompts[key]=ta.value;};
    r.appendChild(ta);
    body.appendChild(r);

    /* the one line that cannot move, shown where it actually sits */
    if(key==='role'){
      const f=el('div','fixedline');
      const fl=el('span','tiny muted'); fl.textContent='Fixed \u2014 this line keeps the three replies readable:';
      const fb=el('p'); fb.textContent=PROMPT_FORMAT;
      f.append(fl,fb); body.appendChild(f);
    }
  });

  const nb=el('p','tiny muted'); nb.style.margin='.5rem 0 .35rem';
  nb.textContent='What the student wrote, their chart notes and the sources you left are added underneath automatically.';
  body.appendChild(nb);

  const pv=el('div','row');
  const open=!!state.promptPreview;
  pv.appendChild(btn(open?'Hide the whole prompt':'See the whole prompt',
    ()=>{state.promptPreview=!open;render();},'ghost'));
  pv.appendChild(btn('Copy the whole prompt',()=>{
    const full=buildTossPrompt(draft,'');
    const done=()=>toast('Prompt copied');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(full).then(done,()=>fallbackCopy(full,done));
    } else fallbackCopy(full,done);
  },'ghost'));
  body.appendChild(pv);
  const cn=el('p','tiny muted'); cn.style.margin='.3rem 0 0';
  cn.textContent='Copying gives you the exact wording to paste into any other model, so a comparison uses one identical prompt.';
  body.appendChild(cn);

  if(open){
    const box=document.createElement('textarea');
    box.className='promptfull'; box.rows=14; box.readOnly=true;
    box.value=buildTossPrompt(draft,'');
    body.appendChild(box);
  }
}
function fallbackCopy(text,then){
  const a=document.createElement('textarea');
  a.value=text; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.select();
  try{document.execCommand('copy');then();}catch(e){toast('Could not copy \u2014 select the text instead');}
  a.remove();
}

function tResources(draft,body){

    if(!draft.resources) draft.resources=[];
    const n=el('p','tiny muted'); n.style.margin='0 0 .5rem';
    n.textContent='Provide the science ideas and background information students need to explain the trends, patterns and anomalies they find. They see these only after they have tried to explain something themselves.';

      const kb=el('div','scopebar');
      const kl=el('span','tiny'); kl.textContent='Shape'; kb.appendChild(kl);

      ti.placeholder='Title students will see, e.g. Why wolves were flown to the island';

      b.appendChild(ti);

      if(r.kind==='link'){
        const ui=document.createElement('input'); ui.type='text'; ui.style.width='100%';
        ui.style.marginTop='.25rem';
        ui.placeholder='https:// \u2026 a page, a news article, a shared document';

        b.appendChild(ui);
        const na=document.createElement('textarea'); na.rows=2; na.style.marginTop='.25rem';
        na.placeholder='A line about what is on the other end of that link (optional).';
        na.value=r.note||''; na.oninput=()=>r.note=na.value;
        b.appendChild(na);
      }else if(r.kind==='table'){
        const rowsN=(r.table&&r.table.rows||[]).length;
        const tb=el('div','row'); tb.style.marginTop='.3rem';
        const fi=document.createElement('input');
        fi.type='file'; fi.accept='.csv,.tsv,.txt,.xlsx,.xls'; fi.style.display='none';
        fi.onchange=e=>{ if(e.target.files[0]) readResourceTable(e.target.files[0],t=>{r.table=t;render();}); };
        tb.appendChild(btn(rowsN?'Replace with another file':'Upload a spreadsheet',()=>fi.click(),'ghost'));
        tb.appendChild(fi);
        b.appendChild(tb);
        const pa=document.createElement('textarea'); pa.rows=2; pa.style.marginTop='.25rem';
        pa.placeholder='Or paste rows here \u2014 first line is the column names, columns split by a tab or a comma.';
        pa.onchange=()=>{ const t=parsePastedTable(pa.value); if(t){r.table=t;pa.value='';render();} else toast('Could not read that as a table'); };
        b.appendChild(pa);
        if(rowsN){
          const pv=el('div','tblprev');
          pv.appendChild(resTable(r.table,null,'tt'+i));
          b.appendChild(pv);
          const c=el('div','tiny muted'); c.style.marginTop='.2rem';
          c.textContent=rowsN+' rows, '+(r.table.cols||[]).length+' columns. Students can search every cell of this.';
          b.appendChild(c);
        }
      }else{
        const na=document.createElement('textarea'); na.rows=4; na.style.marginTop='.25rem';
        na.placeholder='Write it out for them, in a few sentences.';
        na.value=r.note||''; na.oninput=()=>r.note=na.value;
        b.appendChild(na);
      }

      /* the two fields, asked for every source whatever shape it takes */
      const mh=el('div','tiny muted'); mh.style.margin='.5rem 0 .2rem';
      mh.textContent='Students read both of these alongside the source, and DRS reads them too.';
      b.appendChild(mh);
      const so=document.createElement('textarea'); so.rows=2;
      so.placeholder='Where this came from \u2014 who made it and what it covers.';
      so.value=r.source||''; so.oninput=()=>{r.source=so.value;};
      b.appendChild(so);
      const li=document.createElement('textarea'); li.rows=2; li.style.marginTop='.25rem';
      li.placeholder='What it can and cannot tell you \u2014 the question it answers, and the one it leaves open.';
      li.value=r.limits||''; li.oninput=()=>{r.limits=li.value;};
      b.appendChild(li);
      if(!String(r.source||'').trim()||!String(r.limits||'').trim()){
        const w=el('div','audit'); w.style.marginTop='.3rem';
        w.textContent=!String(r.source||'').trim()&&!String(r.limits||'').trim()
          ? 'Both boxes are empty. Without them students will read this as the answer rather than as one source among others.'
          : (!String(r.source||'').trim()
             ? 'No origin given. Students cannot judge a source they cannot place.'
             : 'No limits given. This is the box that stops the source closing the question.');
        b.appendChild(w);
      }
      body.appendChild(b);
    });

    const ab=el('div','row'); ab.style.marginTop='.35rem';
    ab.appendChild(btn('Add a link',()=>{draft.resources.push(blankResource('link'));render();},'ghost'));
    ab.appendChild(btn('Add a table',()=>{draft.resources.push(blankResource('table'));render();},'ghost'));
    ab.appendChild(btn('Write a note',()=>{draft.resources.push(blankResource('note'));render();},'ghost'));
    body.appendChild(ab);
}

function tExamples(draft,body){

    if(!draft.examples) draft.examples={};
    const n=el('p','tiny muted'); n.style.margin='0 0 .5rem';
    n.textContent='Each story shape comes with a worked example from other people\u2019s data. Swap in your own if you have a better one for your class. Leave a box empty to keep the original.';
    body.appendChild(n);
    TEMPLATES.forEach(t=>{
      if(!draft.examples[t.k]) draft.examples[t.k]={};
      const e=draft.examples[t.k];
      const b=el('div','qedit');
      const hd=el('div','qhead');
      const lab=el('span','qnum'); lab.textContent=t.nm;
      hd.appendChild(lab); b.appendChild(hd);
      const ti=document.createElement('input'); ti.type='text'; ti.style.width='100%';
      ti.placeholder=t.ex.title; ti.value=e.title||''; ti.oninput=()=>e.title=ti.value;
      b.appendChild(ti);
      const ui=document.createElement('input'); ui.type='text'; ui.style.width='100%';
      ui.style.marginTop='.25rem';
      ui.placeholder=t.ex.url; ui.value=e.url||''; ui.oninput=()=>e.url=ui.value;
      b.appendChild(ui);
      const na=document.createElement('textarea'); na.rows=2; na.style.marginTop='.25rem';
      na.placeholder=t.ex.look; na.value=e.look||''; na.oninput=()=>e.look=na.value;
      b.appendChild(na);
      body.appendChild(b);
    });
}

/* a small guard against the exemplar-answer problem */
function checkGold(p,gold){
  if(!gold.trim())return null;
  const years=(gold.match(/\b(19|20)\d{2}\b/g)||[]).map(Number);
  if(!years.length)return null;
  const yv=p.vars.find(v=>/year/i.test(v.name));
  if(!yv)return null;
  const numv=p.vars.filter(v=>v.numeric&&v.name!==yv.name&&v.distinct>2);
  const msgs=[];
  numv.forEach(v=>{
    const vals=[];
    for(let r=0;r<p.n;r++){const y=num(p.rows[r][yv.idx]),x=num(p.rows[r][v.idx]);if(y!==null&&x!==null)vals.push({y,x});}
    if(vals.length<8)return;
    const mn=Math.min(...vals.map(d=>d.x));
    const atMin=vals.filter(d=>d.x===mn).map(d=>d.y);
    if(atMin.length>1&&years.some(y=>atMin.includes(y))&&!atMin.every(y=>years.includes(y))){
      msgs.push(`${v.name} reaches its lowest value (${fmt(mn)}) in ${atMin.join(', ')} — your answer names ${years.join(', ')}.`);
    }
  });
  return msgs.length?msgs[0]:null;
}

/* ============================================================
   tiny DOM helpers
   ============================================================ */
function el(tag,cls){const n=document.createElement(tag);if(cls)n.className=cls;return n;}
function hh(t){const h=el('h3');h.textContent=t;return h;}
function btn(label,fn,variant){const b=document.createElement('button');b.className='btn'+(variant?' '+variant:'');b.textContent=label;b.onclick=fn;return b;}
function fld(label,build){const l=document.createElement('label');l.className='fld';const s=document.createElement('span');s.textContent=label;l.append(s,build());return l;}
function mk(tag,attrs,text){
  const n=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const k in attrs) if(attrs[k]!==undefined&&attrs[k]!=='') n.setAttribute(k,attrs[k]);
  if(text!==undefined) n.textContent=text;
  return n;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shorten(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}

render();
