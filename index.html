/* ============================================================
   THE PICTURE — Claude builds a scene from the teacher's two inputs
   (the background they wrote + the columns in their file)
   ============================================================ */
const ZONES=[
  {k:'sky',nm:'in the sky or air'},
  {k:'land',nm:'on the land'},
  {k:'water',nm:'in the water'},
  {k:'front',nm:'in the foreground'}
];
const BACKDROPS=[
  {k:'island',nm:'Island in a lake'},
  {k:'coast',nm:'Coast or shoreline'},
  {k:'forest',nm:'Forest'},
  {k:'field',nm:'Open field'},
  {k:'road',nm:'Road'},
  {k:'lab',nm:'Lab or workshop'},
  {k:'plain',nm:'Plain background'}
];
const ZKEYS=ZONES.map(z=>z.k), BKEYS=BACKDROPS.map(b=>b.k);

function sceneContext(p,draft){
  const cols=p.cols.map((c,i)=>{
    const ex=[];
    for(let r=0;r<p.rows.length&&ex.length<3;r++){
      const v=p.rows[r][i];
      if(!isBlank(v)) ex.push(String(v));
    }
    return `- "${c}" — example values: ${ex.join(', ')||'(all blank)'}`;
  }).join('\n');
  const bg=(draft.brief&&draft.brief.body||'').slice(0,1200);
  return `BACKGROUND THE TEACHER WROTE:\n${bg||'(the teacher has not written any background yet)'}\n\nCOLUMNS IN THE DATA FILE:\n${cols}`;
}

async function generateScene(draft){
  const p=prof(state.dsKey);
  state.sceneGen={loading:true,error:''};render();
  const instr=`You are helping a high school science teacher build a picture of the place where a dataset was collected. Students will drag things out of the picture to work out what the scientists actually measured.

Return strict JSON only. No prose, no code fences. Keys:
"setting" — one plain sentence naming the place and when, for a 15-year-old.
"backdrop" — exactly one of: ${BKEYS.join(', ')}.
"items" — an array of 10 to 16 objects, each with:
   "label" — what the thing is called in everyday words, 1 to 4 words. Not the column name.
   "column" — the EXACT column name from the list below that this thing is measured by, or null if the scientists did not measure it.
   "zone" — one of: ${ZKEYS.join(', ')}.
   "glyph" — a single emoji for the thing.

Rules:
- Include one item for EVERY column in the list, each with that exact column name.
- Then add 3 to 5 extra items with "column": null. These are real parts of the place that nobody measured. A student should plausibly think they might have been measured. Do not make them silly.
- Put things where they belong: things in the air in "sky", things on the ground in "land", things in water in "water", equipment or close-up things in "front".
- Labels are what a student would call the thing, not scientific jargon.

${sceneContext(p,draft)}`;
  try{
    if(!CAP.sample) throw new Error('no model');
    const out=await CAP.sample.json(instr,{modelTier:'default'});
    draft.scene=normalizeScene(out,p);
    state.sceneGen={loading:false,error:''};
  }catch(e){
    draft.scene=fallbackScene(p);
    state.sceneGen={loading:false,
      error:'AI-drawn pictures are not available in this version, so the picture below is just the column names laid out on a plain background. You can edit it, or try generating again.'};
  }
  render();
}

function normalizeScene(out,p){
  const items=[], seen={};
  (out&&out.items||[]).forEach(it=>{
    if(!it||!it.label)return;
    let col=null;
    if(it.column){
      const nm=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,'');
      const t=nm(it.column);
      let i=p.cols.findIndex(c=>nm(c)===t);
      if(i<0&&t) i=p.cols.findIndex(c=>{const cn=nm(c);return cn&&(cn.indexOf(t)>=0||t.indexOf(cn)>=0);});
      if(i>=0)col=i;
    }
    if(col!==null){ if(seen[col])return; seen[col]=1; }
    items.push({
      label:String(it.label).slice(0,40),
      col,
      zone:ZKEYS.includes(it.zone)?it.zone:'land',
      glyph:(function(){const g=String(it.glyph||'').trim();
        return (g&&g.length<=12)?g:glyphFor(it.label);})()
    });
  });
  // columns with nothing to draw stay out of the picture; the collect button brings them in
  return {
    setting:String(out&&out.setting||'').slice(0,200),
    backdrop:BKEYS.includes(out&&out.backdrop)?out.backdrop:'field',
    items
  };
}
function fallbackScene(p){
  return {setting:'',backdrop:'plain',
    items:p.cols.map((c,i)=>({label:String(c).slice(0,40),col:i,zone:'land',glyph:glyphFor(c)}))};
}

/* ---------- drawing ---------- */
function backdropShapes(svg,kind,W,H){
  if(kind&&kind.indexOf('img:')===0){
    const pic=state.pictures.find(x=>x.id===kind.slice(4));
    if(pic){
      const im=mk('image',{x:0,y:0,width:W,height:H,preserveAspectRatio:'xMidYMid slice'});
      im.setAttributeNS('http://www.w3.org/1999/xlink','href',pic.url);
      im.setAttribute('href',pic.url);
      svg.appendChild(im);
      return;
    }
  }
  const r=(x,y,w,h,f)=>svg.appendChild(mk('rect',{x,y,width:w,height:h,fill:f}));
  const sky='var(--sky)', water='var(--water)', land='var(--land)', ground='var(--ground)';
  if(kind==='island'){
    r(0,0,W,H*0.55,sky); r(0,H*0.55,W,H*0.45,water);
    svg.appendChild(mk('ellipse',{cx:W*0.5,cy:H*0.66,rx:W*0.42,ry:H*0.17,fill:land}));
  }else if(kind==='coast'){
    r(0,0,W,H*0.5,sky); r(0,H*0.5,W,H*0.5,water);
    svg.appendChild(mk('path',{d:`M0 ${H*0.5} L${W*0.55} ${H*0.5} L${W*0.35} ${H} L0 ${H} Z`,fill:land}));
  }else if(kind==='forest'){
    r(0,0,W,H*0.6,sky); r(0,H*0.6,W,H*0.4,ground);
    for(let i=0;i<7;i++){
      const x=W*(0.07+i*0.14), y=H*0.6;
      svg.appendChild(mk('path',{d:`M${x} ${y-56} L${x-20} ${y} L${x+20} ${y} Z`,fill:land,opacity:.85}));
    }
  }else if(kind==='field'){
    r(0,0,W,H*0.58,sky); r(0,H*0.58,W,H*0.42,land);
  }else if(kind==='road'){
    r(0,0,W,H*0.55,sky); r(0,H*0.55,W,H*0.45,ground);
    r(0,H*0.72,W,H*0.16,'var(--ink-3)');
    for(let i=0;i<9;i++) r(W*(0.03+i*0.11),H*0.795,W*0.055,2.5,'var(--paper-2)');
  }else if(kind==='lab'){
    r(0,0,W,H*0.74,'var(--paper-2)'); r(0,H*0.74,W,H*0.26,ground);
    svg.appendChild(mk('line',{x1:0,y1:H*0.74,x2:W,y2:H*0.74,stroke:'var(--rule)'}));
  }else{
    r(0,0,W,H,'var(--paper-2)');
  }
}

function sceneSvg(p,scene,opts){
  opts=opts||{};
  const W=460,H=300;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,class:'picture',width:'100%'});
  backdropShapes(svg,scene.backdrop,W,H);
  const bands={sky:0.12,land:0.52,water:0.80,front:0.90};
  const auto=[], fixed=[];
  scene.items.forEach(it=>{ (it.x===undefined||it.x===null?auto:fixed).push(it); });
  const groups={};
  auto.forEach(it=>{(groups[it.zone]=groups[it.zone]||[]).push(it);});
  Object.keys(groups).forEach(z=>{
    const arr=groups[z], top=H*(bands[z]!==undefined?bands[z]:bands.land);
    const per=Math.min(5,Math.max(1,arr.length));
    arr.forEach((it,k)=>{
      const ci=k%per, ri=Math.floor(k/per);
      const x=W*0.08+(W*0.84)*(per===1?0.5:ci/(per-1));
      const y=Math.min(top+ri*42,H-16);
      svg.appendChild(sceneItem(p,it,x,y,opts,W,H));
    });
  });
  fixed.forEach(it=>svg.appendChild(sceneItem(p,it,W*it.x,H*it.y,opts,W,H)));
  return svg;
}

function sceneItem(p,it,x,y,opts,W,H){
  const placed = it.col!==null && state.placed.includes(it.col);
  const tried  = it.col===null && state.notMeasured.indexOf(it.label)>=0;
  const g=mk('g',{class:'pitem'+(placed?' placed':'')+(tried?' tried':'')});
  g.appendChild(mk('circle',{cx:x,cy:y,r:24,fill:'transparent'}));
  if(opts.place){
    // the teacher needs to see what is where in order to place it over the real thing
    g.appendChild(mk('circle',{cx:x,cy:y,r:17,fill:'var(--panel)','fill-opacity':.82,
      stroke:it.col===null?'var(--flag)':'var(--rule)'}));
    const t=mk('text',{x,y:y+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':18},it.glyph);
    t.style.pointerEvents='none'; g.appendChild(t);
    const l=mk('text',{x,y:y+28,'text-anchor':'middle','font-size':9,
      fill:it.col===null?'var(--flag)':'var(--muted)'},shorten(it.label,17));
    l.style.pointerEvents='none'; g.appendChild(l);
  }else if(tried){
    const xx=mk('text',{x,y:y+1,'text-anchor':'middle','dominant-baseline':'middle',
      'font-size':15,fill:'var(--flag)','fill-opacity':.75},'\u2715');
    xx.style.pointerEvents='none'; g.appendChild(xx);
  }
  if(opts.place) placeDrag(g,it,x,y,W,H);
  else if(!placed&&!opts.static) dragThing(g,it,p);
  else g.style.cursor='default';
  return g;
}

function placeDrag(node,it,x0,y0,W,H){
  node.style.cursor='move'; node.style.touchAction='none';
  node.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation();
    const svg=node.ownerSVGElement;
    const move=ev=>{
      const r=svg.getBoundingClientRect();
      if(!r.width||!r.height)return;
      let fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height;
      fx=Math.max(.05,Math.min(.95,fx)); fy=Math.max(.07,Math.min(.90,fy));
      it.x=fx; it.y=fy;
      node.setAttribute('transform','translate('+(fx*W-x0)+','+(fy*H-y0)+')');
    };
    const up=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      render();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function dragThing(node,it,p){
  node.style.cursor='grab';
  node.style.touchAction='none';
  node.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation();
    try{node.setPointerCapture&&node.setPointerCapture(e.pointerId);}catch(_){}
    const x0=e.clientX,y0=e.clientY;
    const g=el('div','dragimg'); g.textContent=it.glyph;
    g.style.left=x0+'px'; g.style.top=y0+'px';
    document.body.appendChild(g);
    const move=ev=>{
      g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
      document.querySelectorAll('[data-slot]').forEach(n=>n.setAttribute('stroke-width','1'));
      const e2=document.elementFromPoint(ev.clientX,ev.clientY);
      const hot=e2&&e2.closest?e2.closest('[data-slot]'):null;
      if(hot) hot.setAttribute('stroke-width','3');
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      g.remove();
      const moved=Math.abs(ev.clientX-x0)>6||Math.abs(ev.clientY-y0)>6;
      const e2=document.elementFromPoint(ev.clientX,ev.clientY);
      const onWeb=e2&&e2.closest?(e2.closest('[data-slot]')||e2.closest('svg.ring')):null;
      if(!moved||onWeb) placeThing(p,it);
      else render();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function placeThing(p,it){
  if(it.col!==null){ placeVar(p,it.col); return; }
  if(state.notMeasured.indexOf(it.label)<0) state.notMeasured.push(it.label);
  state.reveal={label:it.label};
  render();
}

function webStrip(p,cur,tv){
  const strip=el('div','strip');
  // a value tapped in the table: the web holding it comes forward, its neighbours step back
  if(state.tlink&&state.tlink.row===cur) strip.classList.add('linked');
  const SPAN=3, PX=[300,148,94,62];
  for(let d=-SPAN;d<=SPAN;d++){
    const i=cur+d, dist=Math.abs(d);
    const slot=el('div','slot'+(d===0?' focus':''));
    if(i<0||i>=p.n){ slot.style.width=PX[dist]+'px'; slot.classList.add('void'); strip.appendChild(slot); continue; }
    const card=el('div','webcard'+(rowComplete(p,i)?' done':''));
    if(d===0){
      const band=el('div','band');
      band.innerHTML='<b>Observation '+(i+1)+'</b>  \u00b7  '+esc(obsLabel(p,i));
      dragFrom(band,obsLabel(p,i),()=>recordRow(p,i,tv),{row:i},'txt');
      card.appendChild(band);
      card.appendChild(focusWeb(p,i,PX[0],tv));
    }else{
      card.appendChild(miniWeb(p,i,PX[dist],tv));
      const t=el('div','minilab');
      t.innerHTML='<span class="mo">Observation '+(i+1)+'</span><span class="my">'+esc(obsLabel(p,i))+'</span>';
      card.appendChild(t);
      card.onclick=()=>{state.exRow=i;state.tlink=null;render();};
      card.title='Tap to bring this observation to the middle';
    }
    slot.appendChild(card);
    strip.appendChild(slot);
  }
  makeStripSwipe(strip,p);
  return strip;
}

/* The year in the middle of the web changes by one digit from one observation
   to the next, which is easy to miss. When the observation in the middle is a
   different one from last time it was drawn, the centre flashes once. */
let hubSeen=null;
function hubChanged(rowIdx){
  const key=state.dsKey+'|'+(state.exPage||1);
  const changed=!!(hubSeen&&hubSeen.key===key&&hubSeen.row!==rowIdx);
  hubSeen={key,row:rowIdx};
  return changed;
}
function focusWeb(p,rowIdx,px,tv){
  const S=340,c=S/2,R=92;
  const svg=mk('svg',{viewBox:`0 0 ${S} ${S}`,class:'ring focusring'});
  svg.setAttribute('width',px); svg.setAttribute('height',px);
  svg.appendChild(mk('circle',{cx:c,cy:c,r:R,fill:'none',stroke:'var(--line)'}));
  const cells=state.cells[rowIdx]||{};
  const lk=state.tlink;
  const litRow = lk&&lk.row===rowIdx;
  tv.forEach((vi,kk)=>{
    const ang=(kk/tv.length)*Math.PI*2-Math.PI/2;
    const x=c+R*Math.cos(ang), y=c+R*Math.sin(ang);
    const raw=p.rows[rowIdx][vi];
    const used=!!cells[vi];
    const lit = litRow && lk.col===vi;
    const g=mk('g',{class:'wnode'+(used?' used':'')+(lit?' lit':'')});
    g.appendChild(mk('line',{x1:c,y1:c,x2:x,y2:y,
      stroke:lit?'var(--y)':'var(--line)','stroke-width':lit?2.5:1}));
    if(lit) g.appendChild(mk('circle',{cx:x,cy:y,r:26,fill:'none',
      stroke:'var(--y)','stroke-width':3,opacity:.85,class:'halo'}));
    g.appendChild(mk('circle',{cx:x,cy:y,r:17,
      fill:lit?'var(--y-soft)':'var(--panel)',
      stroke:lit?'var(--y)':(isBlank(raw)?'var(--flag)':'var(--x)'),
      'stroke-width':lit?3:(used?1:2),
      'stroke-dasharray':(used&&!lit)?'2 3':''}));
    const gl=mk('text',{x,y:y+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':15},glyphFor(p.cols[vi]));
    gl.style.pointerEvents='none';
    g.appendChild(gl);
    const anchor=Math.cos(ang)>0.25?'start':(Math.cos(ang)<-0.25?'end':'middle');
    const nx=c+(R+26)*Math.cos(ang), ny=c+(R+26)*Math.sin(ang);
    const t1=mk('text',{x:nx,y:ny-5,'text-anchor':anchor,'dominant-baseline':'middle',
      'font-size':9.5,fill:'var(--muted)'},shorten(p.cols[vi],16));
    const t2=mk('text',{x:nx,y:ny+7,'text-anchor':anchor,'dominant-baseline':'middle',
      'font-size':11.5,fill:isBlank(raw)?'var(--flag)':'var(--fg)'},
      isBlank(raw)?'not recorded':String(raw));
    t1.style.pointerEvents='none'; t2.style.pointerEvents='none';
    g.append(t1,t2);
    g.style.cursor='grab';
    dragFrom(g,glyphFor(p.cols[vi]),()=>recordCell(p,rowIdx,vi),{row:rowIdx,col:vi});
    svg.appendChild(g);
  });
  const litHub = litRow && lk.col===null;
  const hub=mk('g',{class:'hub'+(litHub?' lit':'')});
  if(litHub) hub.appendChild(mk('circle',{cx:c,cy:c,r:35,fill:'none',
    stroke:'var(--y)','stroke-width':3,opacity:.85,class:'halo'}));
  if(hubChanged(rowIdx)) hub.classList.add('tick');
  hub.appendChild(mk('circle',{cx:c,cy:c,r:34,class:'hubdisc',
    fill:litHub?'var(--y-soft)':'var(--panel)',
    stroke:litHub?'var(--y)':'var(--x)','stroke-width':litHub?3:2}));
  const hl=obsLabel(p,rowIdx);
  const ht=mk('text',{x:c,y:c+1,'text-anchor':'middle','dominant-baseline':'middle',class:'hubyear',
    'font-size':hl.length<=5?21:14,'font-weight':700,fill:'var(--fg)'},shorten(hl,8));
  ht.style.pointerEvents='none';
  hub.appendChild(ht);
  hub.style.cursor='grab';
  dragFrom(hub,obsLabel(p,rowIdx),()=>recordRow(p,rowIdx,tv),{row:rowIdx},'txt');
  svg.appendChild(hub);
  return svg;
}

function miniWeb(p,rowIdx,px,tv){
  const S=220,c=S/2,R=74;
  const svg=mk('svg',{viewBox:`0 0 ${S} ${S}`,class:'ring mini'});
  svg.setAttribute('width',px); svg.setAttribute('height',px);
  svg.appendChild(mk('circle',{cx:c,cy:c,r:R,fill:'none',stroke:'var(--line)'}));
  tv.forEach((vi,kk)=>{
    const ang=(kk/tv.length)*Math.PI*2-Math.PI/2;
    const x=c+R*Math.cos(ang), y=c+R*Math.sin(ang);
    const raw=p.rows[rowIdx][vi];
    svg.appendChild(mk('line',{x1:c,y1:c,x2:x,y2:y,stroke:'var(--line)'}));
    svg.appendChild(mk('circle',{cx:x,cy:y,r:13,fill:'var(--panel)',
      stroke:isBlank(raw)?'var(--flag)':'var(--x)','stroke-width':2}));
  });
  svg.appendChild(mk('circle',{cx:c,cy:c,r:20,fill:'var(--paper-2)',stroke:'var(--rule)'}));
  return svg;
}

function sortedRows(p,tv){
  const rows=state.observedRows.slice();
  const s=state.tsort;
  if(!s||s.col===null||s.col===undefined) return rows;
  const key=r=>{
    if(s.col==='obs'){ const i=obsCol(p); return i>=0?p.rows[r][i]:r; }
    return p.rows[r][s.col];
  };
  return rows.sort((ra,rb)=>{
    const a=key(ra), b=key(rb);
    const ab=isBlank(a), bb=isBlank(b);
    if(ab&&bb) return 0;
    if(ab) return 1;          // blanks always sink to the bottom
    if(bb) return -1;
    const na=num(a), nb=num(b);
    let c;
    if(na!==null&&nb!==null) c=na-nb;
    else c=String(a).localeCompare(String(b),undefined,{numeric:true});
    return s.dir<0 ? -c : c;
  });
}
function sortHeader(p,label,colKey){
  const th=document.createElement('th');
  const b=document.createElement('button');
  b.type='button'; b.className='sortb';
  const s=state.tsort||{};
  const on = s.col===colKey;
  const arrow = !on ? '\u21c5' : (s.dir>0?'\u2191':'\u2193');
  b.innerHTML='<span class="sl">'+esc(label)+'</span><span class="sa">'+arrow+'</span>';
  b.title = !on ? 'Sort smallest to largest'
          : (s.dir>0?'Sort largest to smallest':'Stop sorting');
  b.onclick=()=>{
    if(!on) state.tsort={col:colKey,dir:1};
    else if(s.dir>0) state.tsort={col:colKey,dir:-1};
    else state.tsort=null;
    render();
  };
  if(on) th.className='sorted';
  th.appendChild(b);
  return th;
}

function tableBuilt(p,tv){
  for(let r=0;r<p.n;r++){
    if(!state.cells[r]) return false;
    for(const i of tv) if(!state.cells[r][i]) return false;
  }
  return true;
}
function recordTable(p,tv){
  const box=el('div','tablebox'); box.setAttribute('data-drop','table');
  const cap=el('div','tabcap'); cap.textContent='Your table';
  box.appendChild(cap);
  if(!state.observedRows.length){
    const e=el('div','dropempty');
    e.textContent='Empty. Drag a whole web here to fill a row, or drag one dot here to fill one cell.';
    box.appendChild(e);
    return box;
  }
  const wrap=el('div','scroll-x');
  const tab=document.createElement('table'); tab.className='grid';
  const head=document.createElement('tr');
  head.appendChild(sortHeader(p,obsColName(p),'obs'));
  tv.forEach(i=>head.appendChild(sortHeader(p,p.cols[i],i)));
  tab.appendChild(head);
  const lk=state.tlink;
  sortedRows(p,tv).forEach(r=>{
    const tr=document.createElement('tr'); tr.setAttribute('data-r',r);
    const rowLit = lk&&lk.row===r;
    if(rowLit&&lk.col===null) tr.classList.add('lit');
    const td0=document.createElement('td');
    td0.className='rowlab link'+(rowLit&&lk.col===null?' lit':'');
    td0.textContent=obsLabel(p,r);
    td0.tabIndex=0;
    td0.title='Tap to bring this whole observation to the middle of the web';
    td0.onclick=()=>linkTo(r,null);
    td0.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();linkTo(r,null);}};
    tr.appendChild(td0);
    tv.forEach(i=>{
      const td=document.createElement('td');
      td.setAttribute('data-r',r); td.setAttribute('data-c',i);
      const cls=['link'];
      if(rowLit&&lk.col===i) cls.push('lit');
      if(!(state.cells[r]&&state.cells[r][i])){ cls.push('unfilled'); td.textContent=''; }
      else{
        const v=p.rows[r][i];
        if(isBlank(v)){cls.push('blankcell');td.textContent='';}
        else td.textContent=String(v);
      }
      td.className=cls.join(' ');
      td.tabIndex=0;
      td.title='Tap to find this value on the web';
      td.onclick=()=>linkTo(r,i);
      td.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();linkTo(r,i);}};
      tr.appendChild(td);
    });
    tab.appendChild(tr);
  });
  wrap.appendChild(tab); box.appendChild(wrap);
  if(lk){
    const kl=el('p','tiny linknote'); kl.style.marginTop='.35rem';
    kl.textContent=lk.col===null
      ? 'Showing ' + obsLabel(p,lk.row) + ' in the middle of the web. Tap it again to stop showing it.'
      : 'Lit up on the web: ' + p.cols[lk.col] + ' in ' + obsLabel(p,lk.row) + '. Tap it again to turn it off.';
    box.appendChild(kl);
  }
  return box;
}

/* ---------- table tap -> web ----------
   Nothing about the data changes here. The tap only moves the web to that
   observation and lights one node, and tapping the same thing again puts it
   out, so a student cannot mistake the highlight for an edit. */
function linkTo(row,col){
  const cur=state.tlink;
  if(cur&&cur.row===row&&cur.col===col) state.tlink=null;
  else { state.tlink={row:row,col:col}; state.exRow=row; }
  render();
}

/* ---------- observation labels ---------- */
function obsCol(p){
  for(let i=0;i<p.cols.length;i++) if(/^(year|date|yr)$/i.test(String(p.cols[i]).trim())) return i;
  for(let i=0;i<p.cols.length;i++) if(/year|date/i.test(String(p.cols[i]))) return i;
  return -1;
}
function obsColName(p){const i=obsCol(p);return i>=0?p.cols[i]:'Observation';}
function obsLabel(p,r){
  const i=obsCol(p);
  if(i>=0&&!isBlank(p.rows[r][i])) return String(p.rows[r][i]);
  return '#'+(r+1);
}

/* ---------- recording ---------- */
function ensureRow(r){
  if(!state.observedRows.includes(r)) state.observedRows.push(r);
  if(!state.cells[r]) state.cells[r]={};
}
function recordRow(p,r,tv){
  ensureRow(r);
  tv.forEach(i=>state.cells[r][i]=1);
  state.exRow=Math.min(r+1,p.n-1);
  render();
}
function recordCell(p,r,i){
  ensureRow(r);
  state.cells[r][i]=1;
  render();
}
function rowComplete(p,r){
  const c=state.cells[r]; if(!c)return false;
  const tv=tableVars(p);
  return tv.length>0&&tv.every(i=>c[i]);
}

/* ---------- dragging ---------- */
function dragFrom(node,ghostText,onDrop,aim,ghostCls){
  node.style.touchAction='none';
  node.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation();
    try{node.setPointerCapture&&node.setPointerCapture(e.pointerId);}catch(_){}
    const g=el('div','dragimg'+(ghostCls?' '+ghostCls:''));
    g.textContent=ghostText;
    g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px';
    document.body.appendChild(g);
    const zoneAt=(x,y)=>{
      const t=document.elementFromPoint(x,y);
      return t&&t.closest?t.closest('[data-drop="table"]'):null;
    };
    const move=ev=>{
      g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
      const zone=zoneAt(ev.clientX,ev.clientY);
      document.querySelectorAll('[data-drop="table"]').forEach(z=>z.classList.toggle('hot',z===zone));
      highlightAim(zone?aim:null);
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      g.remove();
      document.querySelectorAll('[data-drop="table"]').forEach(z=>z.classList.remove('hot'));
      highlightAim(null);
      const zone=zoneAt(ev.clientX,ev.clientY);
      if(zone) onDrop(); else render();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}
function highlightAim(aim){
  document.querySelectorAll('.aim').forEach(n=>n.classList.remove('aim'));
  if(!aim)return;
  if(aim.col!==undefined&&aim.col!==null){
    const td=document.querySelector('td[data-r="'+aim.row+'"][data-c="'+aim.col+'"]');
    if(td) td.classList.add('aim');
  }else{
    const tr=document.querySelector('tr[data-r="'+aim.row+'"]');
    if(tr) tr.classList.add('aim');
  }
}
function makeStripSwipe(strip,p){
  let x0=null;
  strip.addEventListener('pointerdown',e=>{x0=e.clientX;});
  strip.addEventListener('pointermove',e=>{
    if(x0===null)return;
    const dx=e.clientX-x0;
    if(Math.abs(dx)>70){
      const dir=dx>0?-1:1;
      const n=Math.max(0,Math.min(p.n-1,(state.exRow||0)+dir));
      x0=null;
      if(n!==state.exRow){state.exRow=n;state.tlink=null;render();}
    }
  });
  const end=()=>{x0=null;};
  strip.addEventListener('pointerup',end);
  strip.addEventListener('pointercancel',end);
  strip.addEventListener('pointerleave',end);
}

function placeVar(p,idx){
  if(!state.placed.includes(idx)) state.placed.push(idx);
  if(!state.manualPlaced.includes(idx)) state.manualPlaced.push(idx);
  state.reveal=p.vars.findIndex(v=>v.idx===idx);
  render();
}
function threshold(task,p){
  const raw=task&&task.threshold;
  const n=(raw===undefined||raw===null||raw==='')?3:Math.max(1,parseInt(raw,10)||1);
  return Math.min(n,p.cols.length);
}
function collectRest(p){
  p.cols.forEach((c,i)=>{ if(!state.placed.includes(i)) state.placed.push(i); });
  state.collected=true;
  state.reveal=null;
  render();
}
function collectBar(p,task){
  const need=threshold(task,p);
  const found=state.manualPlaced.length;
  const left=p.cols.length-state.placed.length;
  const bar=el('div','collect');
  const lab=el('span','counter');
  lab.innerHTML=`<b>${Math.min(found,need)}</b> of <b>${need}</b> variables found`;
  bar.appendChild(lab);
  if(left>0){
    const b=btn(`Collect the rest (${left} left)`,()=>collectRest(p));
    b.disabled=found<need;
    b.title=found<need
      ? `Find ${need-found} more in the picture first`
      : 'DRS adds the ones that are hard to see in a picture';
    bar.appendChild(b);
  }else{
    const done=el('span','tiny muted');
    done.textContent='All of them are on the web.';
    bar.appendChild(done);
  }
  if(found<need&&shows('ex.collectHint')){
    const h=el('p','tiny muted'); h.style.margin='.3rem 0 0';
    h.textContent=txt('ex.collectHint',{n:need});
    const box=el('div'); box.append(bar,h); return box;
  }
  return bar;
}

function makeThingDraggable(node,p,idx){
  node.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{node.setPointerCapture&&node.setPointerCapture(e.pointerId);}catch(_){}
    node.classList.add('dragging');
    const g=el('div','dragimg');
    g.textContent=glyphFor(p.cols[idx]);
    g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px';
    document.body.appendChild(g);
    const move=ev=>{
      g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
      document.querySelectorAll('[data-slot]').forEach(n=>n.setAttribute('stroke-width','1'));
      const el2=document.elementFromPoint(ev.clientX,ev.clientY);
      const hot=el2&&el2.closest?el2.closest('[data-slot]'):null;
      if(hot) hot.setAttribute('stroke-width','3');
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      g.remove(); node.classList.remove('dragging');
      const el2=document.elementFromPoint(ev.clientX,ev.clientY);
      const target=el2&&el2.closest?el2.closest('[data-slot]'):null;
      const web=el2&&el2.closest?el2.closest('svg.ring'):null;
      if(target||web) placeVar(p,idx);
      else render();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  });
}

function webSvg(p,rowIdx){
  const W=520,H=320,cx=W/2,cy=H/2-6,R=106;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,class:'ring',width:'100%'});
  const vars=p.vars;
  svg.appendChild(mk('circle',{cx,cy,r:R,fill:'none',stroke:'var(--line)'}));
  svg.appendChild(mk('circle',{cx,cy,r:R*0.55,fill:'none',stroke:'var(--line)','stroke-dasharray':'2 4'}));
  vars.forEach((v,i)=>{
    const ang=(i/vars.length)*Math.PI*2-Math.PI/2;
    const x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
    const filled=state.placed.includes(v.idx);
    const raw=p.rows[rowIdx][v.idx];
    const g=mk('g',{});
    g.appendChild(mk('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'var(--line)',
      'stroke-dasharray':filled?'':'3 4'}));
    const node=mk('circle',{cx:x,cy:y,r:14,'data-slot':i,
      fill:filled?(isBlank(raw)?'var(--paper-2)':'var(--panel)'):'var(--paper-2)',
      stroke:filled?(isBlank(raw)?'var(--flag)':'var(--x)'):'var(--line)',
      'stroke-width':1,'stroke-dasharray':filled?'':'3 3'});
    node.style.cursor='pointer';
    node.onclick=()=>{ if(filled){state.reveal=i;render();} };
    g.appendChild(node);
    if(filled){
      const t=mk('text',{x,y:y+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':14},glyphFor(v.name));
      t.style.pointerEvents='none';
      g.appendChild(t);
      const tx=cx+(R+24)*Math.cos(ang), ty=cy+(R+24)*Math.sin(ang);
      g.appendChild(mk('text',{x:tx,y:ty,
        'text-anchor':Math.cos(ang)>0.2?'start':(Math.cos(ang)<-0.2?'end':'middle'),
        'dominant-baseline':'middle','font-size':10.5,
        fill: state.reveal===i?'var(--x)':'var(--muted)'}, shorten(v.name,20)));
    }
    svg.appendChild(g);
  });
  const placed=state.placed.length;
  const hub=mk('g',{class:'hub'+(hubChanged(rowIdx)?' tick':'')});
  hub.appendChild(mk('circle',{cx,cy,r:R*0.5,class:'hubdisc',fill:'var(--panel)',stroke:'var(--x)','stroke-width':2}));
  const hl=obsLabel(p,rowIdx);
  hub.appendChild(mk('text',{x:cx,y:cy-17,'text-anchor':'middle','dominant-baseline':'middle','font-size':10.5,fill:'var(--muted)'},
    'Observation '+(rowIdx+1)));
  hub.appendChild(mk('text',{x:cx,y:cy+3,'text-anchor':'middle','dominant-baseline':'middle',class:'hubyear',
    'font-size':hl.length<=5?24:15,'font-weight':700,fill:'var(--fg)'},shorten(hl,10)));
  hub.appendChild(mk('text',{x:cx,y:cy+24,'text-anchor':'middle','dominant-baseline':'middle','font-size':10,fill:'var(--muted)'},
    placed?`${placed} of ${vars.length} placed`:'drop things here'));
  hub.style.pointerEvents='none';
  svg.appendChild(hub);
  return svg;
}

/* ============================================================
   IDENTIFICATION — histograms, merge, third variable
   ============================================================ */
/* the variables a student can build with, and the space they build on.
   Identification is only this. Interpretation has it too, so a student who
   gets an idea while explaining can build the chart that tests it. */
function kindPanel(draft,p,b){
  if(!draft.varTypes) draft.varTypes={};
  const n=el('p','tiny muted'); n.style.margin='0 0 .45rem';
  n.textContent='DRS reads each variable as categorical (groups or labels) or numerical (numbers on a scale). You can switch a variable whose values are numbers, such as 0 and 1 for no and yes. Variables written in words, and the time variable, stay as they are.';
  b.appendChild(n);
  const list=el('div','kindlist');
  p.vars.forEach(v=>{
    if(v.distinct<=1) return;
    const row=el('div','kindrow');
    const nm=el('span','kn'); nm.textContent=v.name;
    row.appendChild(nm);
    const det=detectedKind(v);
    const nmOf=k=>k==='number'?'Numerical':'Categorical';
    if(!canSwitchKind(p,v)){
      const fx=el('span','kfix');
      fx.textContent=nmOf(det)+(v.idx===obsCol(p)?', the time variable':(v.numeric?'':', written in words'));
      row.appendChild(fx);
    }else{
      const seg=el('div','kseg'); seg.setAttribute('role','radiogroup'); seg.setAttribute('aria-label','How '+v.name+' is read');
      const cur=draft.varTypes[v.name]||det;
      ['groups','number'].forEach(k=>{
        const bt=document.createElement('button'); bt.type='button';
        bt.setAttribute('role','radio'); bt.setAttribute('aria-checked',String(cur===k));
        bt.textContent=nmOf(k)+(k===det?' (as found)':'');
        bt.onclick=()=>{
          if(k===det) delete draft.varTypes[v.name]; else draft.varTypes[v.name]=k;
          render();
        };
        seg.appendChild(bt);
      });
      row.appendChild(seg);
    }
    list.appendChild(row);
  });
  b.appendChild(list);
}
function taskVars(){
  const t=activeTask();
  return t&&t.vars&&t.vars.length?t.vars:null;
}
function varTray(tray,p){
  const allowed=taskVars();
  tray.appendChild(hh('Variables'));
  p.vars.forEach(v=>{
    if(allowed&&!allowed.includes(v.name))return;
    const c=document.createElement('button');
    const kind=varKind(v);
    c.className='chip '+(kind==='number'?'num':'cat');
    c.innerHTML=`<span class="nm">${esc(v.name)}</span><span class="fl">${esc(varFlag(v))}</span>`;
    c.onclick=()=>addViz(v);
    makeDraggableChip(c,v,p);
    tray.appendChild(c);
  });
}
function buildCanvas(surf,p,emptyText){
  const canvas=el('div','surface');
  canvas.id='canvas';
  if(!state.vizzes.length){
    const e=el('div','empty');
    e.textContent= state.route==='menu'
      ? 'Nothing here yet. Choose variables above and draw a chart.'
      : emptyText;
    canvas.appendChild(e);
  }else{
    state.vizzes.forEach(v=>canvas.appendChild(renderViz(p,v)));
  }
  setupCanvasDrop(canvas,p);
  setupGestures(canvas);
  surf.appendChild(canvas);
}
function fingerHint(surf){
  if(state.route==='gesture'&&window.matchMedia&&matchMedia('(pointer:coarse)').matches){
    const fing=el('p','tiny muted'); fing.style.margin='0 0 .4rem';
    fing.textContent='On a touchscreen you can also put two fingers on one chart and twist it to turn it sideways, or put a finger on each of two charts and bring them together to combine them.';
    surf.appendChild(fing);
  }
}

/* Identification: a workbench. Variables on the left, the build space in the
   middle, and nothing to answer - the questions all wait on Interpretation. */
function paneIdentification(p){
  const {tray,surf}=workLayout({noItem:true});
  varTray(tray,p);
  if(state.route==='menu') surf.appendChild(menuRoute(p,taskVars()));
  fingerHint(surf);
  buildCanvas(surf,p,shows('id.empty')?txt('id.empty'):'');
}

function menuRoute(p,allowed){
  const wrap=el('div','menuroute');
  const numv=p.vars.filter(v=>v.numeric&&v.distinct>1&&(!allowed||allowed.includes(v.name)));
  const catv=p.vars.filter(v=>v.distinct>1&&v.distinct<=12&&(!allowed||allowed.includes(v.name)));
  const mkSel=(label,opts,blank)=>{
    const l=document.createElement('label'); l.textContent=label;
    const s=document.createElement('select');
    if(blank){const o=document.createElement('option');o.value='';o.textContent='none';s.appendChild(o);}
    opts.forEach(v=>{const o=document.createElement('option');o.value=v.idx;o.textContent=v.name;s.appendChild(o);});
    l.appendChild(s); wrap.appendChild(l); return s;
  };
  const sx=mkSel('Bottom axis',numv,false);
  const sy=mkSel('Side axis',numv,false);
  const sc2=mkSel('Colour by',catv,true);
  if(numv.length>1) sy.selectedIndex=1;
  wrap.appendChild(btn('Draw chart',()=>{
    state.vizzes=[{id:state.vizSeq++,type:'scatter',xi:+sx.value,yi:+sy.value,ci:sc2.value===''?null:+sc2.value}];
    render();
  }));
  wrap.appendChild(btn('Show just one variable',()=>{
    state.vizzes.push({id:state.vizSeq++,type:'hist',xi:+sx.value,rotated:false});
    render();
  },'ghost'));
  return wrap;
}

/* Categorical or numerical. DRS decides from the values; a teacher can
   switch a variable whose values are numbers underneath (Ice Bridges is 0 or
   1, so it reads as two groups, but as numbers it can be drawn across the
   years). Variables written in words never switch. */
function detectedKind(v){ return (v.numeric&&v.distinct>2)?'number':'groups'; }
function canSwitchKind(p,v){
  return !!(v&&v.numeric&&v.nums.length>0&&v.distinct>1&&v.idx!==obsCol(p));
}
function kindOverride(v){
  const t=activeTask();
  const o=t&&t.varTypes?t.varTypes[v.name]:null;
  if(o!=='number'&&o!=='groups') return null;
  return (v.numeric&&v.nums.length>0)?o:null;
}
function varKind(v){ return kindOverride(v)||detectedKind(v); }
/* for a scale, colour ramp or axis: numbers, unless the teacher said groups */
function asNumber(v){ const o=kindOverride(v); return o?o==='number':!!v.numeric; }
function varFlag(v){
  if(varKind(v)==='number') return 'number';
  const k=rawGroups(v).length;
  if(k<=1) return 'same in every row';
  return k+' groups';
}
function rawGroups(v){
  const seen=new Map();
  v.values.forEach(raw=>{
    const key=String(raw===null||raw===undefined?'':raw);
    seen.set(key,(seen.get(key)||0)+1);
  });
  return [...seen.entries()].map(([key,n])=>({key,n,label:groupLabel(key)}))
    .sort((a,b)=>b.n-a.n).slice(0,12);
}
function groupLabel(key){
  if(key.trim()!=='') return key;
  if(key.length===0) return '(blank)';
  return '(blank: '+key.length+(key.length===1?' space)':' spaces)');
}

function addViz(v){
  if(varKind(v)==='groups'){
    if(state.vizzes.some(z=>z.type==='bars'&&z.xi===v.idx))return;
    state.vizzes.push({id:state.vizSeq++,type:'bars',xi:v.idx});
    render(); return;
  }
  if(state.vizzes.some(z=>z.type==='hist'&&z.xi===v.idx))return;
  state.vizzes.push({id:state.vizSeq++,type:'hist',xi:v.idx,rotated:false});
  render();
}

/* --- drag a variable chip onto a scatterplot (third variable) --- */
let dragPayload=null;
function makeDraggableChip(node,v,p){
  node.style.touchAction='none';
  node.addEventListener('pointerdown',e=>{
    if(state.route==='menu')return;
    e.preventDefault();
    try{node.setPointerCapture&&node.setPointerCapture(e.pointerId);}catch(_){}
    dragPayload={kind:'var',idx:v.idx,numeric:v.numeric};
    node.classList.add('dragging');
    const x0=e.clientX,y0=e.clientY;
    const g=el('div','dragimg txt'); g.textContent=v.name;
    g.style.left=x0+'px'; g.style.top=y0+'px';
    document.body.appendChild(g);
    const hit=(x,y)=>{
      const t=document.elementFromPoint(x,y);
      if(!t||!t.closest)return {};
      return {viz:t.closest('.viz'),canvas:t.closest('#canvas')};
    };
    const move=ev=>{
      g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
      const h=hit(ev.clientX,ev.clientY);
      document.querySelectorAll('.viz').forEach(n=>n.classList.toggle('target',n===h.viz));
      const cv=document.getElementById('canvas');
      if(cv) cv.classList.toggle('drop',!!h.canvas&&!h.viz);
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      g.remove(); node.classList.remove('dragging');
      document.querySelectorAll('.viz').forEach(n=>n.classList.remove('target'));
      const cv=document.getElementById('canvas'); if(cv) cv.classList.remove('drop');
      const moved=Math.abs(ev.clientX-x0)>6||Math.abs(ev.clientY-y0)>6;
      const h=hit(ev.clientX,ev.clientY);
      dragPayload=null;
      if(!moved){ addViz(v); return; }
      if(h.viz) dropVarOnViz(p,v,+h.viz.dataset.id);
      else if(h.canvas) addViz(v);
      else render();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  });
}

function dropVarOnViz(p,v,vizId){
  const z=state.vizzes.find(x=>x.id===vizId);
  if(!z){render();return;}
  if(z.type==='parallel'){
    warn('Two distributions are already side by side here. To build a scatterplot, split them apart and turn one sideways.');
    return;
  }
  if(z.type==='bars'){
    warn('This chart counts how often each answer appears. Drop a variable on a scatterplot instead, to colour the dots.');
    return;
  }
  if(z.type==='hist'){
    if(varKind(v)==='groups'){ warn('That one has groups, not numbers. Build a scatterplot first, then drop it on to colour the dots.'); return; }
    if(z.xi===v.idx){ warn('That is already the variable in this chart.'); return; }
    // a variable arriving from the tray is upright, so the same rule applies as
    // for two charts: same facing gives two distributions side by side, and only
    // an upright meeting a sideways one gives a scatterplot.
    if(!z.rotated){
      const par={id:state.vizSeq++,type:'parallel',xi:z.xi,xj:v.idx,rotated:false};
      state.vizzes=state.vizzes.filter(x=>x.id!==z.id);
      state.vizzes.push(par);
      render();
      const pn=document.querySelector('.viz[data-id="'+par.id+'"]');
      if(pn) pn.classList.add('merging');
      return;
    }
    // the chart underneath is sideways, so it becomes the side axis
    const xi=v.idx, yi=z.xi;
    const oc=obsCol(p);
    if(oc>=0&&yi===oc&&xi!==oc){ warn(txt('id.axisRule',{v:p.cols[oc]})); return; }
    const merged={id:state.vizSeq++,type:'scatter',xi,yi,ci:null,trend:false};
    state.vizzes=state.vizzes.filter(x=>x.id!==z.id);
    state.vizzes.push(merged);
    if((state.idPage||1)<2) state.idPage=2;
    render();
    const node=document.querySelector('.viz[data-id="'+merged.id+'"]');
    if(node) node.classList.add('merging');
    return;
  }
  if(z.type==='scatter'){
    if(z.xi===v.idx||z.yi===v.idx){ warn('That variable is already an axis on this chart.'); return; }
    if(v.numeric&&p.vars[v.idx].nums.length===0){ warn('That column has no numbers to make a scale from.'); return; }
    const had=(z.ci!==null&&z.ci!==undefined)?p.cols[z.ci]:null;
    z.ci=v.idx;
    if((state.idPage||1)<3) state.idPage=3;
    if(had) toast('Colours now show '+p.cols[v.idx]+' instead of '+had);
    render(); return;
  }
  if(z.type==='dual'){
    if(z.xi===v.idx||z.yi===v.idx||z.y2===v.idx){ warn('That variable is already on this chart.'); return; }
    if(!asNumber(v)){ warn('This chart needs numbers on both sides.'); return; }
    const old=p.cols[z.y2];
    z.y2=v.idx;
    toast('The right-hand scale now shows '+p.cols[v.idx]+' instead of '+old);
    render(); return;
  }
  render();
}
function setupCanvasDrop(canvas,p){
  canvas.addEventListener('pointerover',()=>{ if(dragPayload) canvas.classList.add('drop'); });
  canvas.addEventListener('pointerout',()=>canvas.classList.remove('drop'));
}



/* ============================================================
   ANNOTATION — marks, drawings, notes, reference lines and shaded areas.
   They belong to one chart and go wherever that chart goes: Identification,
   Interpretation, story cards and the saved story. Positions are kept
   relative to the chart's plot area (0 to 1 across it), so a chart can be
   resized and everything stays over the same values.
   ============================================================ */
const ANNO_TOOLS=[
  ['point','Mark a point','Tap a dot to mark it. Tap a marked dot again to take the mark off.'],
  ['draw','Draw','Draw on a chart with a finger or the mouse.'],
  ['note','Add a note','Tap a chart where the note should point. Tap a note to change or remove it.'],
  ['line','Reference line','Drag across a chart for a straight line. Close to level or upright, it snaps and shows its value.'],
  ['area','Shade an area','Drag a box over part of a chart. It is shaded and says how many points are inside.']
];
function annoOf(v){
  if(!v.anno) v.anno={};
  ['paths','notes','lines','areas'].forEach(k=>{ if(!Array.isArray(v.anno[k])) v.anno[k]=[]; });
  return v.anno;
}
function annoCount(v){
  const a=v.anno; if(!a) return 0;
  return (a.paths||[]).length+(a.notes||[]).length+(a.lines||[]).length+(a.areas||[]).length;
}
function chartTool(){ return state.chartTool||'point'; }
/* marking up charts belongs to Storytelling: off while a student is building
   (Identification) or answering questions (Interpretation) */
function annoLive(){ return !(state.view==='student'&&(state.stage==='identification'||state.stage==='interpretation')); }
function plotOf(svg){
  if(svg._plot) return svg._plot;
  const vb=(svg.getAttribute('viewBox')||'0 0 300 200').split(/[\s,]+/).map(Number);
  return {l:0,t:0,r:vb[2]||300,b:vb[3]||200};
}
const toN=(P,x,y)=>[(x-P.l)/((P.r-P.l)||1),(y-P.t)/((P.b-P.t)||1)];
const fromN=(P,nx,ny)=>[P.l+nx*(P.r-P.l),P.t+ny*(P.b-P.t)];
function noteLines(text){
  const words=String(text||'').split(/\s+/).filter(Boolean), out=[];
  let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length>26&&cur){ out.push(cur); cur=w; } else cur=(cur+' '+w).trim();
  });
  if(cur) out.push(cur);
  if(out.length>5){ out.length=5; out[4]=out[4].replace(/.{0,2}$/,'\u2026'); }
  return out.length?out:['\u2026'];
}
function drawAnno(svg,v){
  svg._notes=[];
  const a=v.anno;
  if(!a||!annoCount(v)) return svg;
  const P=plotOf(svg);
  const vb=(svg.getAttribute('viewBox')||'0 0 300 200').split(/[\s,]+/).map(Number);
  const W=vb[2]||300, H=vb[3]||200;
  const g=mk('g',{class:'annot'}); g.style.pointerEvents='none';
  const halo={'paint-order':'stroke',stroke:'var(--panel)','stroke-width':3,'stroke-linejoin':'round'};
  (a.areas||[]).forEach(ar=>{
    const [x1,y1]=fromN(P,Math.min(ar.x1,ar.x2),Math.min(ar.y1,ar.y2));
    const [x2,y2]=fromN(P,Math.max(ar.x1,ar.x2),Math.max(ar.y1,ar.y2));
    g.appendChild(mk('rect',{x:x1,y:y1,width:Math.max(1,x2-x1),height:Math.max(1,y2-y1),
      fill:'var(--y)','fill-opacity':.14,stroke:'var(--y)','stroke-width':1.2,'stroke-dasharray':'4 3'}));
    if(P.count){
      const c=P.count(x1,y1,x2,y2);
      c.at.forEach(([X,Y])=>g.appendChild(mk('circle',{cx:X,cy:Y,r:5.4,fill:'none',stroke:'var(--y)','stroke-width':1.6})));
      const unit=c.n===1?c.unit.replace(/s$/,''):c.unit;
      const ly=y1>13?y1-4:Math.min(y2-3,y1+11);
      g.appendChild(mk('text',Object.assign({x:x1+3,y:ly,'font-size':9.5,'font-weight':600,fill:'var(--y)'},halo),
        c.n+' '+unit+' inside'));
    }
  });
  (a.lines||[]).forEach(ln=>{
    const [x1,y1]=fromN(P,ln.x1,ln.y1), [x2,y2]=fromN(P,ln.x2,ln.y2);
    g.appendChild(mk('line',{x1,y1,x2,y2,stroke:'var(--flag)','stroke-width':1.8,
      'stroke-dasharray':'6 3','stroke-linecap':'round'}));
    let lab=null, lx, ly, anchor='start';
    if(ln.y1===ln.y2&&P.fy){ lab=P.fy(y1); lx=Math.max(x1,x2)+4; ly=y1-3;
      if(lx>W-30){ lx=Math.max(x1,x2)-2; anchor='end'; ly=y1-4; } }
    else if(ln.x1===ln.x2&&P.fx){ lab=P.fx(x1); lx=x1+4; ly=Math.min(y1,y2)+9; }
    if(lab!==null) g.appendChild(mk('text',Object.assign({x:lx,y:ly,'font-size':9,'text-anchor':anchor,fill:'var(--flag)'},halo),lab));
  });
  (a.paths||[]).forEach(pt=>{
    if(pt.length<2) return;
    g.appendChild(mk('polyline',{points:pt.map(q=>fromN(P,q[0],q[1]).map(z=>z.toFixed(1)).join(',')).join(' '),
      fill:'none',stroke:'var(--flag)','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','stroke-opacity':.85}));
  });
  (a.notes||[]).forEach((nt,i)=>{
    const [x,y]=fromN(P,nt.x,nt.y);
    const lines=noteLines(nt.text);
    const bw=Math.min(W-4,14+Math.max(...lines.map(l=>l.length))*5.1), bh=7+lines.length*11.5;
    let bx=x+9, by=y-bh-7;
    if(bx+bw>W-2) bx=Math.max(2,x-9-bw);
    if(by<2) by=Math.min(H-bh-2,y+9);
    g.appendChild(mk('line',{x1:x,y1:y,x2:bx<x?bx+bw:bx,y2:by<y?by+bh:by,stroke:'var(--y)','stroke-width':1}));
    g.appendChild(mk('circle',{cx:x,cy:y,r:3,fill:'var(--y)'}));
    g.appendChild(mk('rect',{x:bx,y:by,width:bw,height:bh,rx:3,fill:'var(--panel)',stroke:'var(--y)','stroke-width':1}));
    lines.forEach((l,k)=>g.appendChild(mk('text',{x:bx+6,y:by+12+k*11.5,'font-size':9.5,
      fill:nt.text?'var(--fg)':'var(--muted)'},l)));
    svg._notes.push({i,x,y,bx,by,bw,bh});
  });
  svg.appendChild(g);
  return svg;
}
function svgPt(svg,cx,cy){
  const m=svg.getScreenCTM(); if(!m) return [0,0];
  const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy;
  const q=pt.matrixTransform(m.inverse());
  return [q.x,q.y];
}
/* close to level or upright snaps to exactly level or upright */
function snapLine(a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1], t=Math.tan(7*Math.PI/180);
  if(Math.abs(dy)<=Math.abs(dx)*t) return [b[0],a[1]];
  if(Math.abs(dx)<=Math.abs(dy)*t) return [a[0],b[1]];
  return b;
}
function annoPush(v,kind){ if(!state.annoHist) state.annoHist=[]; state.annoHist.push({id:v.id,kind}); }
function annoUndo(){
  const h=state.annoHist||[];
  while(h.length){
    const e=h.pop(), v=state.vizzes.find(z=>z.id===e.id);
    if(v&&v.anno&&v.anno[e.kind]&&v.anno[e.kind].length){ v.anno[e.kind].pop(); render(); return; }
  }
  toast('Nothing to undo');
}
/* the transparent layer that catches the pen, note, line and area tools */
function annoPad(host,p,v){
  if(!annoLive()) return null;
  const tool=chartTool();
  if(!['draw','note','line','area'].includes(tool)) return null;
  const pad=el('div','annopad');
  pad.style.cursor=tool==='note'?'text':'crosshair';
  pad.addEventListener('pointerdown',e=>{
    const svg=host.querySelector('svg'); if(!svg) return;
    e.preventDefault(); e.stopPropagation();
    const P=plotOf(svg), a=annoOf(v);
    const p0=svgPt(svg,e.clientX,e.clientY);
    if(tool==='note'){
      const hit=(svg._notes||[]).find(n=>(p0[0]>=n.bx&&p0[0]<=n.bx+n.bw&&p0[1]>=n.by&&p0[1]<=n.by+n.bh)||Math.hypot(p0[0]-n.x,p0[1]-n.y)<8);
      if(hit){ noteEditor(v,hit.i,e.clientX,e.clientY); return; }
      const [nx,ny]=toN(P,p0[0],p0[1]);
      a.notes.push({x:nx,y:ny,text:''}); annoPush(v,'notes');
      const idx=a.notes.length-1;
      render();
      requestAnimationFrame(()=>noteEditor(v,idx,e.clientX,e.clientY));
      return;
    }
    let live, cur=p0; const path=[p0];
    if(tool==='draw') live=mk('polyline',{points:p0.join(','),fill:'none',stroke:'var(--flag)','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'});
    else if(tool==='line') live=mk('line',{x1:p0[0],y1:p0[1],x2:p0[0],y2:p0[1],stroke:'var(--flag)','stroke-width':1.8,'stroke-dasharray':'6 3'});
    else live=mk('rect',{x:p0[0],y:p0[1],width:0,height:0,fill:'var(--y)','fill-opacity':.14,stroke:'var(--y)','stroke-dasharray':'4 3'});
    live.style.pointerEvents='none';
    svg.appendChild(live);
    const move=ev=>{
      cur=svgPt(svg,ev.clientX,ev.clientY);
      if(tool==='draw'){
        const last=path[path.length-1];
        if(Math.abs(cur[0]-last[0])<1.5&&Math.abs(cur[1]-last[1])<1.5) return;
        path.push(cur); live.setAttribute('points',path.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '));
      }else if(tool==='line'){
        const q=snapLine(p0,cur); live.setAttribute('x2',q[0]); live.setAttribute('y2',q[1]);
      }else{
        live.setAttribute('x',Math.min(p0[0],cur[0])); live.setAttribute('y',Math.min(p0[1],cur[1]));
        live.setAttribute('width',Math.abs(cur[0]-p0[0])); live.setAttribute('height',Math.abs(cur[1]-p0[1]));
      }
    };
    const up=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      GEST.stroke=null;
      if(GEST.active||GEST.fired){                 // a two-finger gesture won instead
        if(live&&live.parentNode) live.parentNode.removeChild(live);
        return;
      }
      if(tool==='draw'){
        if(path.length>1){ a.paths.push(path.map(q=>toN(P,q[0],q[1]))); annoPush(v,'paths'); }
      }else if(tool==='line'){
        const q=snapLine(p0,cur);
        if(Math.hypot(q[0]-p0[0],q[1]-p0[1])>6){
          const A=toN(P,p0[0],p0[1]), B=toN(P,q[0],q[1]);
          if(q[1]===p0[1]) B[1]=A[1];
          if(q[0]===p0[0]) B[0]=A[0];
          a.lines.push({x1:A[0],y1:A[1],x2:B[0],y2:B[1]}); annoPush(v,'lines');
        }
      }else if(Math.abs(cur[0]-p0[0])>5&&Math.abs(cur[1]-p0[1])>5){
        const A=toN(P,p0[0],p0[1]), B=toN(P,cur[0],cur[1]);
        a.areas.push({x1:A[0],y1:A[1],x2:B[0],y2:B[1]}); annoPush(v,'areas');
      }
      render();
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
    GEST.stroke=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      if(live&&live.parentNode) live.parentNode.removeChild(live);
      GEST.stroke=null;
    };
  });
  return pad;
}
/* a chart with its annotation layer on top */
function annoHost(p,v,svg){
  const h=el('div','annohost');
  h.appendChild(svg);
  const pad=annoPad(h,p,v);
  if(pad) h.appendChild(pad);
  return h;
}
function noteEditor(v,i,cx,cy){
  document.querySelectorAll('.noteed').forEach(n=>n.remove());
  const a=annoOf(v), nt=a.notes[i];
  if(!nt) return;
  const box=el('div','noteed');
  box.setAttribute('role','dialog'); box.setAttribute('aria-label','Note on this chart');
  const ta=document.createElement('textarea'); ta.rows=3; ta.value=nt.text||'';
  ta.placeholder='What do you notice here?';
  const row=el('div','row'); row.style.marginTop='.35rem';
  let closed=false;
  const close=keep=>{
    if(closed) return; closed=true;
    document.removeEventListener('pointerdown',outside,true);
    if(keep){ nt.text=ta.value.trim(); if(!nt.text){ const k=a.notes.indexOf(nt); if(k>=0) a.notes.splice(k,1); } }
    else { const k=a.notes.indexOf(nt); if(k>=0) a.notes.splice(k,1); }
    box.remove(); render();
  };
  const outside=ev=>{ if(!box.contains(ev.target)) close(true); };
  row.appendChild(btn('Done',()=>close(true)));
  row.appendChild(btn('Remove note',()=>close(false),'ghost'));
  ta.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ ev.preventDefault(); close(true); } });
  box.append(ta,row);
  document.body.appendChild(box);
  const bw=236, bh=box.offsetHeight||120;
  box.style.left=Math.max(8,Math.min(innerWidth-bw-8,cx+12))+'px';
  box.style.top=Math.max(8,Math.min(innerHeight-bh-8,cy+12))+'px';
  ta.focus();
  setTimeout(()=>document.addEventListener('pointerdown',outside,true),0);
}
/* one toolbar, the same on Interpretation and the story canvas */
function annoBar(){
  const tool=chartTool();
  const box=el('div','annoblock');
  const row=el('div','row annorow');
  const bar=el('div','annobar');
  bar.setAttribute('role','group'); bar.setAttribute('aria-label','Chart tools');

    },'ghost'));

  box.appendChild(tip);
  return box;

/* --- two distributions facing the same way, side by side for comparison --- */
function binOf(vals,k){
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const bw=((hi-lo)||1)/k, bins=new Array(k).fill(0);
  vals.forEach(x=>{let i=Math.floor((x-lo)/bw);if(i>=k)i=k-1;if(i<0)i=0;bins[i]++;});
  return {lo,hi,bw,bins,mx:Math.max(...bins)};
}
function parallelSvg(p,v){
  const up=!v.rotated;
  const W=CHART_BOX?CHART_BOX.w:(up?320:360), H=CHART_BOX?CHART_BOX.h:300;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'display:block'});
  const panes=[{idx:v.xi,col:'var(--x)'},{idx:v.xj,col:'var(--y)'}];
  const bad=panes.some(q=>!p.vars[q.idx].nums.length);
  if(bad){
    svg.appendChild(mk('text',{x:10,y:30,'font-size':11,fill:'var(--muted)'},'no numbers'));
    return svg;
  }
  panes.forEach((q,pi)=>{
    const vals=p.vars[q.idx].nums;
    const k=Math.min(12,Math.max(5,Math.round(Math.sqrt(vals.length))));
    const B=binOf(vals,k);
    if(up){
      const top=18+pi*(H/2-4), bot=top+(H/2-52);
      const xs=sc(B.lo,B.hi+B.bw,46,W-10), ys=sc(0,B.mx,bot,top);
      B.bins.forEach((c,i)=>{
        svg.appendChild(mk('rect',{x:xs(B.lo+i*B.bw)+1,y:ys(c),
          width:Math.max(1,xs(B.lo+B.bw)-xs(B.lo)-2),height:Math.max(0,bot-ys(c)),
          fill:q.col,'fill-opacity':.75}));
      });
      svg.appendChild(mk('line',{x1:46,y1:bot,x2:W-10,y2:bot,stroke:'var(--line)'}));
      niceTicks(B.lo,B.hi,4).forEach(t=>svg.appendChild(mk('text',{x:xs(t),y:bot+12,'font-size':9,
        'text-anchor':'middle',fill:'var(--muted)'},fmtC(p,q.idx,t))));
      svg.appendChild(mk('text',{x:46,y:top-5,'font-size':9.5,fill:q.col},shorten(p.cols[q.idx],36)));
    }else{
      const left=52+pi*(W/2+4), right=left+(W/2-70);
      const ys=sc(B.lo,B.hi+B.bw,H-34,26), xs=sc(0,B.mx,left,right);
      B.bins.forEach((c,i)=>{
        const y0=ys(B.lo+(i+1)*B.bw), y1=ys(B.lo+i*B.bw);
        svg.appendChild(mk('rect',{x:left,y:y0+1,width:Math.max(0,xs(c)-left),
          height:Math.max(1,y1-y0-2),fill:q.col,'fill-opacity':.75}));
      });
      svg.appendChild(mk('line',{x1:left,y1:26,x2:left,y2:H-34,stroke:'var(--line)'}));
      niceTicks(B.lo,B.hi,4).forEach(t=>svg.appendChild(mk('text',{x:left-4,y:ys(t),'font-size':9,
        'text-anchor':'end','dominant-baseline':'middle',fill:'var(--muted)'},fmtC(p,q.idx,t))));
      svg.appendChild(mk('text',{x:left,y:18,'font-size':9.5,fill:q.col},shorten(p.cols[q.idx],20)));
    }
  });
  svg.appendChild(mk('text',{x:W/2,y:H-6,'font-size':9,'text-anchor':'middle',fill:'var(--muted)'},
    'two distributions, not a relationship'));
  return svg;
}

/* --- how often each answer appears, blanks included as answers of their own --- */
function barsSvg(p,v){
  const W=CHART_BOX?CHART_BOX.w:380,L=CHART_BOX?Math.min(150,Math.round(W*.38)):150,B=34,T=14,Rr=14;
  const gs=rawGroups(p.vars[v.xi]);
  const H=CHART_BOX?CHART_BOX.h:Math.max(120,T+B+gs.length*26);
  const step=CHART_BOX?Math.max(8,(H-T-B)/Math.max(1,gs.length)):26;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'display:block'});
  if(!gs.length){
    svg.appendChild(mk('text',{x:12,y:40,'font-size':11,fill:'var(--muted)'},'nothing recorded'));
    return svg;
  }
  const hi=Math.max(...gs.map(g=>g.n));
  const xs=sc(0,hi,L,W-Rr);
  svg.appendChild(mk('line',{x1:L,y1:T,x2:L,y2:H-B,stroke:'var(--line)'}));
  gs.forEach((g,i)=>{
    const y=T+i*step, h=Math.min(18,step*.72);
    const blank=g.key.trim()==='';
    svg.appendChild(mk('rect',{x:L,y,width:Math.max(1,xs(g.n)-L),height:h,
      fill:blank?'var(--paper-2)':'var(--x)','fill-opacity':blank?1:.7,
      stroke:blank?'var(--flag)':'none','stroke-width':blank?1.2:0,
      'stroke-dasharray':blank?'3 2':''}));
    svg.appendChild(mk('text',{x:L-6,y:y+h/2,'font-size':9.5,'text-anchor':'end',
      'dominant-baseline':'middle',fill:blank?'var(--flag)':'var(--fg)'},shorten(g.label,24)));
    svg.appendChild(mk('text',{x:xs(g.n)+5,y:y+h/2,'font-size':9.5,'dominant-baseline':'middle',
      fill:'var(--muted)'},String(g.n)));
  });
  svg.appendChild(mk('text',{x:(L+W-Rr)/2,y:H-8,'font-size':9.5,'text-anchor':'middle',
    fill:'var(--muted)'},'how many observations'));
  svg._plot={l:L,r:W-Rr,t:T,b:H-B,fx:px=>String(Math.round(hi*(px-L)/((W-Rr-L)||1)))};
  return svg;
}

/* --- a smooth curve through the dots, left to right --- */
function smoothPath(pts){
  // pts are already in screen coordinates, sorted by x
  if(pts.length<2) return '';
  if(pts.length===2) return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} L${pts[1][0].toFixed(1)} ${pts[1][1].toFixed(1)}`;
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i===0?0:i-1], p1=pts[i], p2=pts[i+1], p3=pts[i+2!==pts.length?i+2:i+1];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function curveThrough(data,xs,ys,stroke){
  // data: [{x,y}] in data units. Averages neighbours so the curve shows the trend
  // rather than zig-zagging through every point.
  const srt=data.slice().sort((a,b)=>a.x-b.x);
  if(srt.length<3) return null;
  const win=Math.max(1,Math.round(srt.length/14));
  const sm=[];
  for(let i=0;i<srt.length;i++){
    let sx=0,sy=0,k=0;
    for(let j=i-win;j<=i+win;j++){ if(j<0||j>=srt.length)continue; sx+=srt[j].x; sy+=srt[j].y; k++; }
    sm.push([xs(sx/k),ys(sy/k)]);
  }
  const thin=sm.filter((q,i)=>i===0||i===sm.length-1||i%Math.max(1,Math.round(sm.length/28))===0);
  const d=smoothPath(thin);
  if(!d)return null;
  return mk('path',{d,fill:'none',stroke,'stroke-width':2,'stroke-opacity':.85,
    'stroke-linecap':'round','stroke-linejoin':'round'});
}
function drawLayer(svg,v,W,H,L,Rr,T,B){ /* chart drawing now lives in the annotation layer */ }

/* --- two things measured across the same variable, one scale on each side --- */
function dualSvg(p,v){
  const W=CHART_BOX?CHART_BOX.w:380,H=CHART_BOX?CHART_BOX.h:300,L=52,Rp=52,B=40,T=16;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'display:block'});
  const A=[],Bp=[];
  for(let r=0;r<p.n;r++){
    const x=num(p.rows[r][v.xi]);
    if(x===null)continue;
    const y1=num(p.rows[r][v.yi]), y2=num(p.rows[r][v.y2]);
    if(y1!==null) A.push({x,y:y1,r});
    if(y2!==null) Bp.push({x,y:y2,r});
  }
  if(!A.length&&!Bp.length){
    svg.appendChild(mk('text',{x:12,y:40,'font-size':11,fill:'var(--muted)'},'no overlapping values'));
    return svg;
  }
  const allx=A.concat(Bp).map(d=>d.x);
  const xlo=Math.min(...allx), xhi=Math.max(...allx);
  const a1=A.map(d=>d.y), a2=Bp.map(d=>d.y);
  const l1=a1.length?Math.min(...a1):0, h1=a1.length?Math.max(...a1):1;
  const l2=a2.length?Math.min(...a2):0, h2=a2.length?Math.max(...a2):1;
  const xs=sc(xlo,xhi,L,W-Rp), y1s=sc(l1,h1,H-B,T), y2s=sc(l2,h2,H-B,T);

  svg.appendChild(mk('line',{x1:L,y1:H-B,x2:W-Rp,y2:H-B,stroke:'var(--line)'}));
  svg.appendChild(mk('line',{x1:L,y1:T,x2:L,y2:H-B,stroke:'var(--x)'}));
  svg.appendChild(mk('line',{x1:W-Rp,y1:T,x2:W-Rp,y2:H-B,stroke:'var(--y)'}));

  niceTicks(xlo,xhi,4).forEach(t=>svg.appendChild(mk('text',{x:xs(t),y:H-B+13,'font-size':9,
    'text-anchor':'middle',fill:'var(--muted)'},fmtC(p,v.xi,t))));
  niceTicks(l1,h1,4).forEach(t=>svg.appendChild(mk('text',{x:L-5,y:y1s(t),'font-size':9,
    'text-anchor':'end','dominant-baseline':'middle',fill:'var(--x)'},fmtC(p,v.yi,t))));
  niceTicks(l2,h2,4).forEach(t=>svg.appendChild(mk('text',{x:W-Rp+5,y:y2s(t),'font-size':9,
    'text-anchor':'start','dominant-baseline':'middle',fill:'var(--y)'},fmtC(p,v.y2,t))));

  svg.appendChild(mk('text',{x:(L+W-Rp)/2,y:H-6,'font-size':9.5,'text-anchor':'middle',
    fill:'var(--muted)'},shorten(p.cols[v.xi],38)));
  svg.appendChild(mk('text',{x:11,y:(T+H-B)/2,'font-size':9.5,'text-anchor':'middle',fill:'var(--x)',
    transform:`rotate(-90 11 ${(T+H-B)/2})`},shorten(p.cols[v.yi],30)));
  svg.appendChild(mk('text',{x:W-10,y:(T+H-B)/2,'font-size':9.5,'text-anchor':'middle',fill:'var(--y)',
    transform:`rotate(90 ${W-10} ${(T+H-B)/2})`},shorten(p.cols[v.y2],30)));

  const plot=(arr,ysc,col,shape)=>{
    arr.forEach(d=>{
      const flagged=isMarked(v.id,d.r);
      let node;
      if(shape==='square'){
        const sz=flagged?9:6.4;
        node=mk('rect',{x:xs(d.x)-sz/2,y:ysc(d.y)-sz/2,width:sz,height:sz,
          fill:flagged?'none':col,'fill-opacity':.7,
          stroke:flagged?'var(--flag)':'none','stroke-width':flagged?2:0});
      }else{
        node=mk('circle',{cx:xs(d.x),cy:ysc(d.y),r:flagged?5.5:3.6,
          fill:flagged?'none':col,'fill-opacity':.7,
          stroke:flagged?'var(--flag)':'none','stroke-width':flagged?2:0});
      }
      if(annoLive()) node.style.cursor='pointer';
      const lbl=(shape==='square')?p.cols[v.y2]:p.cols[v.yi];
      const li=(shape==='square')?v.y2:v.yi;
      node.onclick=()=>toggleMark(v.id,d.r,
        `${p.cols[v.xi]} ${fmtC(p,v.xi,d.x)}, ${lbl} ${fmtC(p,li,d.y)}`);
      node.appendChild(mk('title',{},`${p.cols[v.xi]}: ${fmtC(p,v.xi,d.x)}\n${lbl}: ${fmtC(p,li,d.y)}`));
      svg.appendChild(node);
      if(flagged) markLabel(svg,xs(d.x),ysc(d.y),fmtC(p,li,d.y),W);
    });
  };
  plot(A,y1s,'var(--x)','circle');
  plot(Bp,y2s,'var(--y)','square');
  if(v.curve){
    const c1=curveThrough(A,xs,y1s,'var(--x)'); if(c1) svg.appendChild(c1);
    const c2=curveThrough(Bp,xs,y2s,'var(--y)'); if(c2) svg.appendChild(c2);
  }

  const key=mk('g',{});
  key.appendChild(mk('circle',{cx:L+8,cy:T-4,r:3.6,fill:'var(--x)','fill-opacity':.7}));
  key.appendChild(mk('text',{x:L+16,y:T-1,'font-size':9,fill:'var(--muted)'},shorten(p.cols[v.yi],16)));
  key.appendChild(mk('rect',{x:L+108,y:T-7.2,width:6.4,height:6.4,fill:'var(--y)','fill-opacity':.7}));
  key.appendChild(mk('text',{x:L+119,y:T-1,'font-size':9,fill:'var(--muted)'},shorten(p.cols[v.y2],16)));
  svg.appendChild(key);
  svg._plot={l:L,r:W-Rp,t:T,b:H-B,
    fx:px=>fmtC(p,v.xi,xlo+(px-L)/((W-Rp-L)||1)*(xhi-xlo)),
    fy:py=>fmtC(p,v.yi,l1+((H-B)-py)/((H-B-T)||1)*(h1-l1)),
    count:(x1,y1,x2,y2)=>{const at=[];
      A.forEach(d=>{const X=xs(d.x),Y=y1s(d.y);if(X>=x1&&X<=x2&&Y>=y1&&Y<=y2)at.push([X,Y]);});
      Bp.forEach(d=>{const X=xs(d.x),Y=y2s(d.y);if(X>=x1&&X<=x2&&Y>=y1&&Y<=y2)at.push([X,Y]);});
      return {n:at.length,at,unit:'points'};}};
  return svg;
}

/* --- render a single visualization --- */
function renderViz(p,v){
  const box=el('div','viz');
  box.dataset.id=v.id;
  const head=el('div','vizhead');
  const grip=document.createElement('button'); grip.className='grip'; grip.innerHTML='&#9995;'; grip.title='Drag to combine';
  const title=el('span','t');
  title.textContent = v.type==='parallel' ? `${p.cols[v.xi]} beside ${p.cols[v.xj]}`
                    : (v.type==='hist'||v.type==='bars') ? p.cols[v.xi]
                    : v.type==='dual' ? `${p.cols[v.yi]} and ${p.cols[v.y2]} across ${p.cols[v.xi]}`
                    : `${p.cols[v.xi]} and ${p.cols[v.yi]}` + (v.ci!==null&&v.ci!==undefined?` by ${p.cols[v.ci]}`:'');
  head.append(grip,title);

  if(v.type==='parallel'){
    const sp=document.createElement('button'); sp.className='iconb'; sp.textContent='split apart';
    sp.onclick=()=>{
      state.vizzes=state.vizzes.filter(z=>z.id!==v.id);
      state.vizzes.push({id:state.vizSeq++,type:'hist',xi:v.xi,rotated:v.rotated});
      state.vizzes.push({id:state.vizSeq++,type:'hist',xi:v.xj,rotated:v.rotated});
      render();
    };
    head.appendChild(sp);
    const tn=document.createElement('button'); tn.className='iconb';
    tn.textContent=v.rotated?'stand upright':'turn sideways';
    tn.onclick=()=>{v.rotated=!v.rotated;render();};
    head.appendChild(tn);
  }
  if(v.type==='hist'&&state.route==='gesture'){
    const rot=document.createElement('button'); rot.className='iconb';
    rot.textContent=v.rotated?'upright':'sideways';
    rot.title='Turn the distribution';
    rot.onclick=()=>{v.rotated=!v.rotated;render();};
    head.appendChild(rot);
  }
  if(v.type==='scatter'||v.type==='dual'){
    const cv=document.createElement('button'); cv.className='iconb';
    cv.textContent=v.curve?'remove the curve':'connect with a curve';
    cv.title='Draw a smooth curve through the dots';
    cv.onclick=()=>{v.curve=!v.curve;render();};
    head.appendChild(cv);
  }
  if(v.type==='scatter'){
    const tl=document.createElement('button'); tl.className='iconb';
    tl.textContent=v.trend?'remove trend line':'add a trend line';
    tl.onclick=()=>{v.trend=!v.trend;render();};
    head.appendChild(tl);
  }
  if(v.type==='scatter'&&v.ci!==null&&v.ci!==undefined){
    const cl=document.createElement('button'); cl.className='iconb'; cl.textContent='clear colour';
    cl.onclick=()=>{v.ci=null;render();};
    head.appendChild(cl);
  }
  head.appendChild(zoomButtons(v));
  if(state.view==='student'&&state.stage==='interpretation'){
    const st=document.createElement('button');
    st.type='button'; st.className='iconb star'+(state.starred[v.id]?' on':'');
    st.textContent=state.starred[v.id]?'\u2605 in my story':'\u2606 keep for my story';
    st.title='Charts you keep are shown first in Storytelling. Nothing is deleted either way.';
    st.onclick=()=>{ state.starred[v.id]=!state.starred[v.id]; render(); };
    head.appendChild(st);
  }
  const close=document.createElement('button'); close.className='iconb'; close.textContent='×';
  close.title='Remove'; close.onclick=()=>{state.vizzes=state.vizzes.filter(z=>z.id!==v.id);render();};
  head.appendChild(close);
  box.appendChild(head);
  box.appendChild(annoHost(p,v,chartSvg(p,v)));
  if(state.view==='student'&&state.stage==='interpretation'&&state.starred[v.id]){
    const w=document.createElement('textarea');
    w.rows=2; w.className='whykeep';
    w.placeholder=shows('in.whykeep')?txt('in.whykeep'):'';
    w.value=state.keepWhy[v.id]||'';
    w.oninput=()=>{state.keepWhy[v.id]=w.value;};
    box.appendChild(w);
  }

  if(state.route==='gesture'){
    grip.addEventListener('pointerdown',e=>{
      e.preventDefault();
      dragPayload={kind:'viz',id:v.id};
      box.classList.add('dragging');
      const move=ev=>{
        if(GEST.active) return;          // a second finger has taken over
        document.querySelectorAll('.viz').forEach(n=>n.classList.remove('target'));
        const t=document.elementFromPoint(ev.clientX,ev.clientY);
        const host=t&&t.closest?t.closest('.viz'):null;
        if(host&&host.dataset.id!==String(v.id)) host.classList.add('target');
      };
      const up=ev=>{
        window.removeEventListener('pointermove',move);
        window.removeEventListener('pointerup',up);
        box.classList.remove('dragging');
        if(GEST.active||GEST.fired){ dragPayload=null; return; }
        document.querySelectorAll('.viz').forEach(n=>n.classList.remove('target'));
        const t=document.elementFromPoint(ev.clientX,ev.clientY);
        const host=t&&t.closest?t.closest('.viz'):null;
        dragPayload=null;
        if(host&&host.dataset.id!==String(v.id)) combine(p,v.id,+host.dataset.id);
      };
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
    });
    // drop a variable chip onto a scatterplot to colour it
    box.addEventListener('pointerup',()=>{
      if(dragPayload&&dragPayload.kind==='var'&&v.type==='scatter'){
        v.ci=dragPayload.idx; dragPayload=null;
        toast('Coloured by '+p.cols[v.ci]); render();
      }
    });
  }
  return box;
}

/* the merge — faithful to the proposal: rotation decides the result */
function combine(p,dragId,targetId){
  const a=state.vizzes.find(z=>z.id===dragId), b=state.vizzes.find(z=>z.id===targetId);
  if(!a||!b)return;
  if(a.type==='scatter'&&b.type==='scatter'){
    if(a.xi!==b.xi){
      warn('These two can only share one chart if they have the same variable on the bottom axis. This one has '+p.cols[a.xi]+', that one has '+p.cols[b.xi]+'.');
      return;
    }
    if(a.yi===b.yi){ warn('Both charts show the same thing on the side axis.'); return; }
    const dual={id:state.vizSeq++,type:'dual',xi:b.xi,yi:b.yi,y2:a.yi,trend:false};
    state.vizzes=state.vizzes.filter(z=>z.id!==a.id&&z.id!==b.id);
    state.vizzes.push(dual);
    if((state.idPage||1)<3) state.idPage=3;
    render();
    const node=document.querySelector('.viz[data-id="'+dual.id+'"]');
    if(node) node.classList.add('merging');
    return;
  }
  if(a.type!=='hist'||b.type!=='hist'){warn('Drag one scatterplot onto another to put them in the same chart, or a variable onto a chart to add it.');return;}
  if(a.rotated===b.rotated){
    if(a.xi===b.xi){ warn('Those are the same variable.'); return; }
    const par={id:state.vizSeq++,type:'parallel',xi:b.xi,xj:a.xi,rotated:a.rotated};
    state.vizzes=state.vizzes.filter(z=>z.id!==a.id&&z.id!==b.id);
    state.vizzes.push(par);
    render();
    const pn=document.querySelector('.viz[data-id="'+par.id+'"]');
    if(pn) pn.classList.add('merging');
    return;
  }
  // upright keeps its variable along the bottom; the sideways one becomes the side axis
  const xh=a.rotated?b:a, yh=a.rotated?a:b;
  const oc=obsCol(p);
  if(oc>=0&&yh.xi===oc&&xh.xi!==oc){ warn(txt('id.axisRule',{v:p.cols[oc]})); return; }
  const merged={id:state.vizSeq++,type:'scatter',xi:xh.xi,yi:yh.xi,ci:null};
  state.vizzes=state.vizzes.filter(z=>z.id!==a.id&&z.id!==b.id);
  state.vizzes.push(merged);
  if((state.idPage||1)<2) state.idPage=2;
  render();
  const node=document.querySelector(`.viz[data-id="${merged.id}"]`);
  if(node) node.classList.add('merging');
}

/* ============================================================
   TWO-FINGER GESTURES — touch and pen, alongside the buttons.

   Two fingers on ONE chart, twisted   -> that distribution turns sideways,
                                          the same as the sideways button.
   Two fingers on TWO charts, brought  -> the two charts combine, the same as
   together                               dragging one onto the other.

   Nothing here replaces a button, so a mouse-only machine loses nothing.
   The browser hands us fingers one at a time and never tells us how they
   relate, so we keep our own record of where each one is and work out the
   distance between them (a pinch) and the angle between them (a twist).
   ============================================================ */
const GEST={
  wired:false,      // window listeners attached once, not once per render
  active:false,     // two fingers are down on charts
  pts:new Map(),    // pointerId -> {vizId,x,y}
  start:null,       // the gap and angle the gesture began with
  fired:false,      // one action per gesture, so a slow twist cannot repeat
  stroke:null       // an annotation stroke to abandon if a second finger lands
};
const GEST_TWIST=0.7;   // about forty degrees of turn before a twist counts
const GEST_PINCH=0.55;  // fingers must close to just over half the opening gap

function gestClear(){
  GEST.active=false; GEST.start=null; GEST.fired=false;
  document.querySelectorAll('.viz').forEach(n=>n.classList.remove('gest','target'));
}

function gestDown(e){
  if(e.pointerType==='mouse') return;            // a mouse only ever has one pointer
  const box=e.target&&e.target.closest?e.target.closest('.viz'):null;
  if(!box) return;
  GEST.pts.set(e.pointerId,{vizId:+box.dataset.id,x:e.clientX,y:e.clientY});
  if(GEST.pts.size!==2) return;
  const [a,b]=[...GEST.pts.values()];
  GEST.active=true; GEST.fired=false;
  GEST.start={
    dist:Math.hypot(a.x-b.x,a.y-b.y),
    ang:Math.atan2(b.y-a.y,b.x-a.x),
    sameViz:a.vizId===b.vizId,
    ids:[a.vizId,b.vizId]
  };
  // whatever one finger had already begun, let go of it cleanly
  if(GEST.stroke){ try{GEST.stroke();}catch(_){} GEST.stroke=null; }
  dragPayload=null;
  document.querySelectorAll('.viz').forEach(n=>{
    n.classList.remove('dragging','target','gest');
    if(GEST.start.ids.includes(+n.dataset.id)) n.classList.add('gest');
  });
}

function gestMove(e){
  const rec=GEST.pts.get(e.pointerId);
  if(!rec) return;
  rec.x=e.clientX; rec.y=e.clientY;
  if(!GEST.active||GEST.fired||!GEST.start) return;
  if(e.cancelable) e.preventDefault();
  const [a,b]=[...GEST.pts.values()].slice(0,2);
  if(GEST.start.sameViz){
    let turn=Math.atan2(b.y-a.y,b.x-a.x)-GEST.start.ang;
    while(turn>Math.PI) turn-=2*Math.PI;
    while(turn<-Math.PI) turn+=2*Math.PI;
    if(Math.abs(turn)>GEST_TWIST){ GEST.fired=true; gestTwist(GEST.start.ids[0]); }
  }else{
    const gap=Math.hypot(a.x-b.x,a.y-b.y);
    if(gap<GEST.start.dist*GEST_PINCH){
      GEST.fired=true;
      const p=prof(state.dsKey), ids=GEST.start.ids.slice();
      document.querySelectorAll('.viz').forEach(n=>n.classList.remove('gest','target'));
      combine(p,ids[0],ids[1]);
    }
  }
}

function gestUp(e){
  GEST.pts.delete(e.pointerId);
  if(GEST.pts.size<2) gestClear();
}

function gestTwist(id){
  const v=state.vizzes.find(z=>z.id===id);
  if(!v) return;
  if(v.type!=='hist'&&v.type!=='parallel'){
    warn('Only a distribution turns sideways. This chart already has a variable on each axis.');
    return;
  }
  v.rotated=!v.rotated;
  render();
  const n=document.querySelector('.viz[data-id="'+id+'"]');
  if(n) n.classList.add('merging');

function setupGestures(canvas){
  if(state.route!=='gesture') return;           // the menu route stays a clean comparison
  canvas.addEventListener('pointerdown',gestDown,true);
  // Safari on iPad treats two fingers as page zoom unless we say otherwise
  ['gesturestart','gesturechange','gestureend'].forEach(t=>
    canvas.addEventListener(t,ev=>ev.preventDefault()));
  if(GEST.wired) return;
  GEST.wired=true;
  window.addEventListener('pointermove',gestMove,{capture:true,passive:false});
  window.addEventListener('pointerup',gestUp,true);
  window.addEventListener('pointercancel',gestUp,true);
}

/* --- charts --- */
function sc(d0,d1,r0,r1){ const s=(d1-d0)||1; return v=>r0+((v-d0)/s)*(r1-r0); }
function niceTicks(lo,hi,count){
  const span=(hi-lo)||1, step=Math.pow(10,Math.floor(Math.log10(span/count)));
  const errs=[1,2,5,10].map(m=>({m,e:Math.abs(span/(step*m)-count)}));
  const m=errs.sort((a,b)=>a.e-b.e)[0].m, s=step*m;
  const out=[]; for(let t=Math.ceil(lo/s)*s;t<=hi+1e-9;t+=s) out.push(+t.toFixed(10));
  return out;
}
function histSvg(p,v){
  const W=CHART_BOX?CHART_BOX.w:(v.rotated?200:300),H=CHART_BOX?CHART_BOX.h:(v.rotated?260:190);
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'display:block'});
  const vals=p.vars[v.xi].nums;
  if(!vals.length){svg.appendChild(mk('text',{x:10,y:30,'font-size':11,fill:'var(--muted)'},'no numbers'));return svg;}
  const lo=Math.min(...vals),hi=Math.max(...vals),k=Math.min(12,Math.max(5,Math.round(Math.sqrt(vals.length))));
  const bw=((hi-lo)||1)/k, bins=new Array(k).fill(0);
  vals.forEach(x=>{let i=Math.floor((x-lo)/bw);if(i>=k)i=k-1;if(i<0)i=0;bins[i]++;});
  const mx=Math.max(...bins), pad=28;
  const col=v.rotated?'var(--y)':'var(--x)';
  if(!v.rotated){
    const xs=sc(lo,hi+bw,pad,W-8), ys=sc(0,mx,H-pad,8);
    bins.forEach((c,i)=>{
      svg.appendChild(mk('rect',{x:xs(lo+i*bw)+1,y:ys(c),width:Math.max(1,xs(lo+bw)-xs(lo)-2),

    svg.appendChild(mk('line',{x1:pad,y1:H-pad,x2:W-8,y2:H-pad,stroke:'var(--line)'}));
    niceTicks(lo,hi,4).forEach(t=>svg.appendChild(mk('text',{x:xs(t),y:H-pad+13,'font-size':9,
      'text-anchor':'middle',fill:'var(--muted)'},fmtC(p,v.xi,t))));
    svg._plot={l:pad,r:W-8,t:8,b:H-pad,
      fx:px=>fmtC(p,v.xi,lo+(px-pad)/((W-8-pad)||1)*(hi+bw-lo)),
      fy:py=>String(Math.round(mx*((H-pad)-py)/((H-pad-8)||1))),
      count:(x1,y1,x2,y2)=>({n:vals.filter(x=>{const X=xs(x);return X>=x1&&X<=x2;}).length,at:[],unit:'observations'})};
  }else{
    const ys=sc(lo,hi+bw,H-pad,8), xs=sc(0,mx,pad,W-8);
    bins.forEach((c,i)=>{
      const y0=ys(lo+(i+1)*bw), y1=ys(lo+i*bw);
      svg.appendChild(mk('rect',{x:pad,y:y0+1,width:xs(c)-pad,height:Math.max(1,y1-y0-2),fill:col,'fill-opacity':.75}));
    });
    svg.appendChild(mk('line',{x1:pad,y1:8,x2:pad,y2:H-pad,stroke:'var(--line)'}));
    niceTicks(lo,hi,4).forEach(t=>svg.appendChild(mk('text',{x:pad-4,y:ys(t),'font-size':9,
      'text-anchor':'end','dominant-baseline':'middle',fill:'var(--muted)'},fmtC(p,v.xi,t))));
    svg._plot={l:pad,r:W-8,t:8,b:H-pad,
      fy:py=>fmtC(p,v.xi,lo+((H-pad)-py)/((H-pad-8)||1)*(hi+bw-lo)),
      fx:px=>String(Math.round(mx*(px-pad)/((W-8-pad)||1))),
      count:(x1,y1,x2,y2)=>({n:vals.filter(x=>{const Y=ys(x);return Y>=y1&&Y<=y2;}).length,at:[],unit:'observations'})};
  }
